[package]
name = "mollendorff-forge"
version = "10.0.0-rc.18"
edition = "2021"
authors = ["Claude (Opus 4.5) - Principal Autonomous AI <noreply@anthropic.com>", "Möllendorff AI <admin@mollendorff.ai>"]
description = "YAML financial modeling engine with Excel-style formulas, Monte Carlo, decision trees, real options and an MCP server for AI agents. Release candidate."
repository = "https://github.com/mollendorff-ai/forge"
homepage = "https://mollendorff.ai/forge"
documentation = "https://github.com/mollendorff-ai/forge#readme"
license = "MIT OR Apache-2.0"
keywords = ["yaml", "formula", "excel", "asimov", "ai-built"]
categories = ["command-line-utilities", "parsing", "development-tools"]
readme = "README.md"
exclude = [
    "test-data/*",
    ".git*",
    ".asimov/*",
    ".cargo/*",
    ".cargo-husky/*",
    ".claude/*",
    ".vscode/*",
    ".markdownlint*",
    ".yamllint",
    "docs/*",
    "dist/*",
    "bin/*",
    "editors/*",
    "scripts/*",
    "releases/*",
    "forge-wasm/*",
    "validation/*",
    "Makefile",
    "*.md",
    "!README.md",
]
# Note: examples/ is included because src/cli/commands/examples.rs uses include_str!()

# Main binary (175 functions, all features)
# Build: cargo build --release
# cargo binstall mollendorff-forge downloads the binary of the GitHub release
# (forge-<target>.tar.gz, forge-<target>.zip on Windows) instead of building it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/forge-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# The command line, the MCP server and the REST API (default), and Excel.
# `--no-default-features` builds the parser, the calculator, the analysis
# engines and the commands' core functions alone, which is what the browser
# build uses (ADR-055); watch, update, export and import need `cli` or `excel`.
[features]
default = ["cli"]
cli = [
    "excel",
    "dep:clap",
    "dep:notify",
    "dep:notify-debouncer-mini",
    "dep:tokio",
    "dep:rmcp",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:tempfile",
    "dep:sha2",
    "dep:base64",
]
excel = ["dep:rust_xlsxwriter", "dep:calamine", "dep:regex", "dep:zip"]

# forge-wasm runs the same core functions in a browser (ADR-055); it is not
# published and not part of this crate's package
[workspace]
members = ["forge-wasm", "validation/gnumeric", "validation/r"]

[[bin]]
name = "forge"
path = "src/main.rs"
required-features = ["cli"]


[dependencies]
# YAML parsing
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
serde_json = "1.0"  # JSON handling for schema validation

# JSON Schema validation (v1.0.0 array model)
jsonschema = { version = "0.60", default-features = false, features = ["idna"] }

# CLI
clap = { version = "4.5.53", features = ["derive", "env"], optional = true }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Dependency graph (for formula ordering)
petgraph = "0.8"

# Ordered maps: tables, columns and scalars keep the order of the model file
indexmap = { version = "2", features = ["serde"] }
# Fast, fixed hashing for the evaluator's name lookups (already used by indexmap)
foldhash = "0.2"

# Regex for array indexing preprocessing
regex = { version = "1.12", optional = true }

# Pretty output
colored = "3.0"

# Excel export (v1.0.0 array model)
rust_xlsxwriter = { version = "0.102", optional = true }

# Text results that look like numbers are marked as text in the saved workbook
# (already in the build through rust_xlsxwriter and calamine)
zip = { version = "9", optional = true, default-features = false, features = ["deflate"] }

# Excel import (v1.0.0 array model)
calamine = { version = "0.38", optional = true }

# File watching (v1.4.0 watch mode)
notify = { version = "8.2", optional = true }
notify-debouncer-mini = { version = "0.7", optional = true }

# Async runtime (API server, MCP server)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"], optional = true }

# MCP server (Model Context Protocol via rmcp SDK)
rmcp = { version = "3.8", features = ["server", "transport-io"], optional = true }

# API Server
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.7", features = ["cors", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"

# Temp files (inline content for MCP tools)
tempfile = { version = "3.8", optional = true }

# SHA-256 of downloaded release archives (forge update)
sha2 = { version = "0.11", optional = true }

# Monte Carlo simulation
rand_distr = "0.6"  # Distribution sampling (Normal, Triangular, PERT, etc.)
statrs = "0.19"     # Statistical functions (PDF, CDF, percentiles)
base64 = { version = "0.23.1", optional = true }

# A closed pipe (`forge functions | head`) ends the CLI quietly
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# jsonschema may follow a $ref to a local file everywhere but in a browser,
# where its file resolver does not build (Forge's schemas are built in)
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
jsonschema = { version = "0.60", default-features = false, features = ["resolve-file"] }

# In a browser (wasm32-unknown-unknown, ADR-055): randomness for unseeded
# simulations from the browser's crypto, and today's date from its clock.
# Both apply to that target only; other builds are unchanged.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# jsonschema's hashing (ahash) still uses getrandom 0.3
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
# A workbook's creation time from the browser's clock (std's clock panics
# there); only when Excel is built in (feature `excel`)
rust_xlsxwriter = { version = "0.102", optional = true, features = ["wasm"] }

# The validation suites against Gnumeric and R are workspace members in
# validation/ (ADR-057)

[dev-dependencies]
# Testing
pretty_assertions = "1.4"
tempfile = "3.8"
assert_cmd = "2.0"  # CLI integration testing
predicates = "3.1"  # CLI output assertions
# Git hooks (auto-installs on cargo test)
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }

# Allow coverage cfg for conditional compilation (ADR-006)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# Pedantic linting - code is for humans to read (ADR-004)
[lints.clippy]
# Pedantic + nursery + cargo enforced via `make lint` with -D warnings
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Transitive deps pull different versions of the same crate; unfixable without swapping dependencies
multiple_crate_versions = "allow"
# Rust has no f64::from(usize) or f64::from(i64) — these casts are unavoidable in numeric code.
# Precision loss only matters for values > 2^52 (~4.5e15), which never occur in financial math.
cast_precision_loss = "allow"

[profile.release]
# Optimize for size and performance
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Forge in the browser (forge-wasm, ADR-055, Studio): built for size, since
# there the download is what a person waits for. Measured on 2026-11-11 against
# the release profile (opt-level 3): the module is 20% smaller over the wire
# (gzip, 2.32 MB to 1.86 MB) and as fast (a 10,000-run simulation of the bagel
# example 1.79 s against 1.62 s; calculate and tornado faster). opt-level "z"
# saves 31% but makes that simulation 64% slower.
[profile.wasm]
inherits = "release"
opt-level = "s"
