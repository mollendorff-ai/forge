# Forge Roadmap
# Version: Cargo.toml | History: CHANGELOG.md | Config: project.yaml
#
# Rewritten 2026-11-07 after a day of real use through MCP (see CHANGELOG
# 10.0.0-rc.3 and the fixes after it). Every bug found that day, including
# a wrong answer, was found by building a model, not by review or coverage.
# The organizing question for every item is therefore: does this make the
# next real model built with Forge more likely to be right and less painful?
# Reach (distribution, REST parity, transports, benchmarks) comes after that.
#
# A roadmap item is an instruction to an autonomous agent. Each one has an
# acceptance criterion the agent cannot satisfy by writing more code: a
# number checked outside Forge, a documented behaviour observed, a decision
# written down. "Polish" and "improve" are not criteria.

state:
  version: >-
    10.0.0-rc.23, released 2026-11-14: eight wrong answers in date and
    financial functions fixed (NETWORKDAYS/WORKDAY holidays, WEEKDAY types
    11-17, DATEDIF YM, DATE years below 1900, TIME past 24 hours, EFFECT and
    NOMINAL periods, IPMT/PPMT and DDB periods out of range), so the two
    weeks in docs/STABILITY.md start again from rc.23: no earlier than
    2026-11-28. rc.22 (2026-11-13): YEARFRAC basis 0 from the last day of
    February to a 31st fixed, and the CLI and MCP agree on dates. rc.21 (2026-11-13): a date as a scalar (ADR-060) and
    format: beside unit: (ADR-061), both in model format 5.4.0. rc.20 (2026-11-13): a table column can aggregate a
    column (ADR-058), an empty cell in a column of numbers (ADR-059, model
    format 5.3.0, COUNTBLANK: 203 functions), and two wrong answers in
    forge import fixed (an empty cell imported as 0, and a range where Forge
    reads the row's value). Those fixes restart the two-week stable clock in
    docs/STABILITY.md: from rc.20, no earlier than 2026-11-27. rc.19 added 26
    functions and the rolling-forecast and capex-plan examples; rc.18 made
    Studio work on a phone and moved the validation suites into this
    repository (ADR-057); rc.17 suggested the keys of the model format and
    shrank Studio's download by 20%; rc.16 made Studio work offline, added
    and deleted elements on its cards, and added the Grid tab.
    rc.15 added the Excel workbook and Save to Files in Studio and 15-digit
    numbers; rc.14 was the first release with Studio; rc.13 fixed a wrong
    answer in forge export (T1-TEXT-NUMBERS) and the function list (169, not
    175).
  format: model format 5.1.0 (ADR-051), with inputs as plain numbers, formula
    scalars as a formula mapping, and results written next to formulas in
    place; 5.2.0 (ADR-053) adds the period column, 5.3.0 (ADR-059) the
    empty cell and 5.4.0 a date as a scalar (ADR-060) and a number format
    beside the unit (ADR-061), each needed only by a
    file that has one. examples/ are 5.1.0, or the format of the newest of
    these they use (the rolling forecast and the bagel are 5.4.0); test-data/ and
    validation/ stay 5.0.0 on purpose (a few validation specs are 5.2.0 to
    5.4.0, for those features).
  scope: all analysis engines are supported (ADR-050). The maintainer uses
    them and expects more scenario and simulation features.
  users: none known. One outside contributor used Forge for a few weeks in
    2026 and paused.
  what_works: calculate, validate, audit, export, import, includes with
    @namespace.name, scenarios, simulate, goal-seek, break-even,
    sensitivity, tornado, MCP with inline content, REST API with inline
    content. Verified on one 12-month model with an included costs file;
    totals matched an independent calculation and the Excel export
    recalculated with 0 mismatches.
  verified_on_a_real_model: every analytics command, on the examples/bagel
    models, with headline numbers asserted in tests/bagel_example.rs against
    independent calculations (T1-USE, 2026-11-07). The numbers were right in
    all of them; the bugs were in what surrounded them (variance flags,
    output order, a 74,000-token bootstrap reply, unreported ties).
  unverified: watch and upgrade (file tooling, not analytics).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 1 — TRUST (next release or two)
# ═══════════════════════════════════════════════════════════════════════════════

tier1:
  # From an evaluation of rc.23 (2026-11-14): every result checked by hand
  # matched, 1,828 tests and 1,791 Gnumeric cases passed. What it found is in
  # the checks around the numbers and in what the project says about itself.
  # In order of impact; T1-TEST-RULE, T1-GENERATED and T1-PROPERTIES are the
  # testing plan that follows from it ("covered" is not "correct").
  - id: T1-R-HARNESS
    title: "The R formula suite cannot fail, and 15 of its date checks do"
    why: "validation/r/validators/r/run_all.sh runs each validator as `Rscript ... | tee`, so the status it tests is tee's, never R's: a failing validator is counted as passed, and the Validation workflow stays green. On rc.23 it prints 121 passed, 15 failed, then All validators passed, and exits 0. The 15 are DATE and WORKDAY: since rc.21 (ADR-060) Forge prints a date result as text (2024-02-29) and forge_helper.R reads a serial number, gets NA and fails the check. Forge's answers are right; the README's 136 checks pass is not true on main"
    how: "set -o pipefail in run_all.sh (or test PIPESTATUS); forge_helper.R reads an ISO date as a date. Then make one validator fail on purpose and see the script and the workflow fail. Correct the count in README.md and VALIDATION.md"
    acceptance: "A deliberately wrong expected value fails run_all.sh with a non-zero exit and fails the Validation workflow; with it removed, all 136 checks pass, and the README and VALIDATION.md say what the run printed"

  - id: T1-TEST-RULE
    title: "Every bug fix starts with a failing test, not only a wrong answer"
    why: ".asimov/project.yaml and the PR template ask for a failing test only for a wrong answer. Errors, crashes, wrong messages and refusals that should not happen get fixed without one, so they can come back"
    how: "Extend the rule in .asimov/project.yaml and the checkbox in .github/pull_request_template.md: the test reproduces the bug, fails on the commit before the fix and passes after it"
    acceptance: "Both files state the wider rule; the next bug-fix PR carries such a test and says which commit it fails on"

  - id: T1-GENERATED
    title: "Generated cases against Gnumeric and LibreOffice, in CI"
    why: "The validation cases are written by hand, so bugs live in inputs nobody imagined (YEARFRAC from the last day of February). validation/sweep already generates cases (dates.py, fin.py, vdb.py: 9,327 over a fixed grid) and found the eight wrong answers fixed in rc.23, but it runs only by hand and covers only date and financial functions"
    how: "An ADR first. Build on validation/sweep rather than beside it: draw arguments per function at random with a fixed seed (printed with each failure so it can be replayed), weighted toward edges: month ends, leap years, Feb 28 and 29, the 31st, zero, negatives, empty cells, very large and very small numbers. Run each case through Forge and through Gnumeric, or LibreOffice where Gnumeric cannot judge, and report every disagreement. A disagreement confirmed as a bug becomes a handwritten case in validation/gnumeric/tests under T1-TEST-RULE; one where both engines differ from Excel goes to T1-EXCEL-CHECKS. Date and financial functions first, then the rest (T1-SWEEP-REST)"
    acceptance: "The ADR is written; a small seeded batch runs on every pull request and a large one in weekly.yml; replaying a reported seed gives the same case; every disagreement found so far is either a case in validation/gnumeric/tests or a written reason"

  - id: T1-PROPERTIES
    title: "Property tests for rules that must always hold"
    why: "Some promises need no reference engine, only the rule itself, and nothing tests them on inputs nobody wrote. Forge has no property tests (no proptest or quickcheck)"
    how: "The proptest crate as a dev-dependency, on generated models: format: never changes a value (ADR-061); export then import gives the same numbers; calculating a model twice gives the same output; a seeded simulation gives the same numbers twice (docs/STABILITY.md point 4). A shrunk failing input becomes an ordinary test under T1-TEST-RULE"
    acceptance: "The four properties run in cargo test with a fixed case count that keeps CI under its time limit; any failure they found is fixed with a test"

  - id: T1-SWEEP-REST
    title: "Sweep the function families not yet swept, before the stable release"
    why: "Sweeping dates and finance found eight wrong answers in one run, some silent (NETWORKDAYS and WORKDAY accepted holidays and ignored them). Statistical, lookup, text and math functions have only their handwritten cases"
    how: "With T1-GENERATED's generator once it exists, or validation/sweep's way until then"
    acceptance: "Each family has had a run against both engines; every disagreement is fixed with a test, recorded for T1-EXCEL-CHECKS, or explained in validation/sweep/README.md"

  - id: T1-MSRV
    title: "Declare the oldest Rust Forge builds with, and check it"
    why: "cargo build on Rust 1.97.0 (July 2026) fails with 8 x error[E0658] (Option::map_or_default, unstable there); it builds on 1.100.0. Cargo.toml has no rust-version, so a newcomer gets a compiler error, not update Rust. CI runs only the latest stable, and clippy there suggests the newest APIs (PR #167)"
    how: "rust-version in Cargo.toml and the same msrv in clippy.toml (clippy then stops suggesting newer APIs), and a CI job that builds on that version. Or replace the 8 map_or_default calls and pick an older version"
    acceptance: "Building with an older toolchain says which version is needed; the CI job builds on the declared version"

  - id: T1-CLAIMS
    title: "What Forge says about itself matches what it does"
    why: "The README is candid, but other places drift from it. GitHub About: 10-15x fewer tokens than Excel, which nothing measures and the README says was not measured. forge --help and VALIDATION.md: Beta (it is a release candidate). VALIDATION.md: tests on stable and beta Rust on every push (beta is weekly). Cargo.toml comment: 175 functions (203). README goal-seek block: 397.044208 -> 79999.999976, the command prints 397.04 -> 80,000.00. Counts dated 2026-11-12: 1,768 tests (1,828 on rc.23), 1,460 Gnumeric cases with 70 by LibreOffice in 51 files (1,931, 139 and 55). Cargo.toml authors and 40 places in docs: Claude (Opus 4.5) - Principal Autonomous AI, a self-given title and one model of several"
    how: "Correct each. Have CI write the counts where it already measures them (the badges do), so they cannot go stale. The author line names Claude (Anthropic) plainly. The About text is changed by the maintainer on GitHub (Safari, desktop view)"
    acceptance: "A search of the repository for Beta, 175 functions, 1,768, 1,460 and Principal Autonomous AI finds only the changelog; the README's command blocks are what the commands print (tests/doc_examples.rs or similar checks them); the About text matches the README's first line"

  - id: T1-VALIDATE-GAPS
    title: "validate refuses a table with columns of different lengths, and a missing name suggests the closest"
    why: "forge validate on a table with a 3-row and a 2-row column says All tables are valid (the error comes only when a formula reads the table), and forge export writes it. A missing scalar is reported as Unknown column: a.price, with no suggestion, while .asimov/project.yaml says an unknown name is an error that suggests the closest name (a.prce was one letter away)"
    how: "Check column lengths in validate and export; say unknown name for a scalar and suggest the nearest existing name, as for columns"
    acceptance: "Both cases have tests (T1-TEST-RULE); validate exits 1 on the ragged table; the message for a.price names a.prce"

  - id: T1-ADR-PRUNE
    title: "Delete the speculative ADRs from the public folder"
    why: "ADR-026 (FPGA for high-frequency trading, after $1M+ AUM), ADR-028 (crystal analysis, not implemented, DANEEL work) and ADR-030 (go-to-market tiers, superseded) say little about Forge and cost a reader's trust; their dated notes do not undo the first impression"
    how: "Delete the three files and the parked items that point to them (P-FPGA, P-CRYSTAL); keep ADR-031's one line on the licence history. The maintainer confirms before the files go"
    acceptance: "No link in the repository points to a deleted ADR (the docs link check passes)"

  - id: T1-MCP-ROOT
    title: "An optional folder that MCP and REST file paths must stay inside"
    why: "The MCP tools take file_path, yaml_path and excel_path, so an agent, or a prompt injected into one, can read any model or workbook and write a file anywhere the user can. Normal for a local MCP server, and SECURITY.md lists the MCP server in scope"
    how: "forge mcp --root DIR and forge serve --root DIR: a path outside DIR (after resolving .. and links) is refused with the reason; without --root, nothing changes"
    acceptance: "Tests show a path outside the root refused for read and write, including through .. and a symbolic link; docs/MCP.md and SECURITY.md describe it"

  - id: T1-TIDY
    title: "Remove the committed __pycache__"
    why: "validation/sweep/__pycache__/harness.cpython-313.pyc is in git"
    how: "git rm it and ignore __pycache__/ in .gitignore"
    acceptance: "git ls-files lists no .pyc file"

  - id: T1-LISTINGS
    title: "Outside listings show today's Forge"
    why: "The LobeHub MCP listing (royalbit forge) still shows the Elastic-2.0 licence and the battle-tested wording of an old README"
    how: "The maintainer asks LobeHub to refresh or remove it; check other listings (ecosyste.ms, docs.rs for old versions) at the same time"
    acceptance: "The listing shows MIT OR Apache-2.0 and the current description, or is gone"

  # Found while making dates real dates (ADR-054, 2026-11-10): places where
  # Forge and Excel may give different answers without a warning, and places
  # where Forge says less than it knows.
  - id: T1-YEARFRAC-FEB
    title: "Confirm in Excel: YEARFRAC from the last day of February to a 31st, basis 0, and the security functions"
    why: "Built (2026-11-13) on published evidence: YEARFRAC(2026-02-28, 2026-12-31, 0) is 301/360 in Forge now, as in Gnumeric, LibreOffice and the algorithm Microsoft confirmed matches Excel 2007 (D. A. Wheeler, OASIS office-formula, June 2008); Microsoft's YEARFRAC page warns about this start. Not yet typed into Excel itself. PRICEDISC, YIELDDISC and ACCRINT keep the NASD count (300/360 here): nothing published says they share the exception, and Excel's PRICEDISC on month ends (2026-11-06) agrees with NASD where both engines do not"
    how: "In Excel: =YEARFRAC(DATE(2026,2,28),DATE(2026,12,31),0) (Forge 0.8361), =PRICEDISC(DATE(2026,2,28),DATE(2026,12,31),0.05,100,0) (Forge 95.8333, engines 95.8194), =YIELDDISC(DATE(2026,2,28),DATE(2026,12,31),97,100,0) (Forge 0.03711, engines 0.03699), =ACCRINT(DATE(2026,2,28),DATE(2026,8,31),DATE(2026,12,31),0.1,1000,2,0) (Forge 83.3333, LibreOffice 83.6111). If YEARFRAC is not 0.8361, revert it; if a security function gives the engines' value, give it YEARFRAC's count"
    acceptance: "The four Excel values are recorded in validation/gnumeric (financial.yaml) with the date they were checked, and Forge gives them"

  - id: T1-EXCEL-CHECKS
    title: "Results to check in real Excel, where the engines and Forge do not settle it"
    why: "Each differs from something published or from one or both engines. VDB(2400,300,10*12,6,18,3): Microsoft's page says 396.31, Forge, Gnumeric, LibreOffice and a Python loop give 540.19. WEEKNUM(DATE(2020,12,31),11): Forge and the calendar say 53, LibreOffice says 1 (nine year-end cases of types 11 to 17 are checked against Forge only). Found by the sweep of 2026-11-13 (validation/sweep): VDB with a fractional start differs from both engines in all 281 such cases (VDB(100,10,3,0.5,1): Forge 22.22, both 33.33; whole starts all agree); TIME(23,59,59.5): Forge 0.999988 (seconds truncated, as Excel is believed to), both 0.999994; DATEDIF(DATE(2024,2,29),DATE(2025,12,29),\"YD\"): Forge 304, LibreOffice 303; SYD(10000,1000,0.5,1): Forge #NUM! (period after a life under 1), both 12000; DATE(1899,12,31): Forge 3799-12-31 by Microsoft's DATE page, both engines 1899-12-31"
    how: "Type each in Excel. VDB 396.31: find what differs. WEEKNUM 1: change the year-end rule of types 11 to 17. VDB with a fractional start at 33.33: count it as the engines do. For the others, give Forge Excel's answer where it differs"
    acceptance: "The Excel values are recorded in validation/gnumeric with the date they were checked, and Forge gives them"

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 2 — MODELING (what would change how Forge feels to use)
# ═══════════════════════════════════════════════════════════════════════════════

tier2:
  - id: T2-FIRST-USER
    title: "Watch one real person build a model with Forge"
    why: "No known users. Every bug found on 2026-11-07 came from building a model, and the maintainer's plan is to test demand with one real user before investing in reach (tier 3)"
    how: "One FP&A analyst or AI pipeline builder, their own small model, Studio or the command line, the maintainer watching without helping. Write down where they stop"
    acceptance: "Notes from the session are in this file as tier items with acceptance criteria, or the decision that nothing needs to change"

  # The earlier tier-2 items are done (2026-11-10): forge report, the
  # comparison example and the first-model starter.
  # Found building examples/rolling-forecast (2026-11-12), the FP&A audit:
  # actuals then forecast, fiscal quarters, year to date, a budget looked up
  # by month and price/volume/mix all work; three did not, and all three are
  # built: a table of quarters (ADR-058), empty cells (ADR-059) and a date as
  # a scalar (ADR-060). The number format the maintainer asked for is built
  # too (ADR-061).

# ═══════════════════════════════════════════════════════════════════════════════
# STUDIO — the web interface (ADR-055, ADR-056)
# ═══════════════════════════════════════════════════════════════════════════════
# A track of its own, worked in its own session alongside the engine tiers.
# It does not wait for tier 1 and does not compete with it. Done: S1, the
# engine builds without the command line or the servers, and for wasm32 in CI
# (PR #126); S2, forge-wasm runs Forge's 20 tools in WebAssembly with the
# native answers, 4.62 MB (1.51 MB gzipped) before wasm-opt (PR #129); S3,
# Forge Studio in studio/ calculating with forge-wasm, every scalar on screen
# checked against forge calculate in a headless browser.
# S4, Studio published on GitHub Pages after each release (workflow
# pages.yml; it publishes once Pages is switched on and the workflow runs).
# S5, the editor and the cards side by side above 900 px; S6, formula colours
# read from the VS Code extension's grammar, with one copy of the rules; S7,
# a formula edited on its card, kept only when Forge accepts it; S8, Excel
# export and import in the browser, the workbook forge export writes.

# S13, Studio at forge.mollendorff.ai (2026-11-13): a CNAME at EasyDNS,
# mollendorff.ai verified for the organization on GitHub Pages, no wildcard
# record (GitHub advises against one: any account could claim a subdomain).

studio:
  - id: S-HOME
    title: "A one-page home for Möllendorff AI at mollendorff.ai"
    why: "The organization has no page of its own: one place that says what Möllendorff AI is and leads to Forge Studio and the repositories. mollendorff.com and mollendorff.ca forward to it"
    how: "Its own small repository on GitHub Pages (mollendorff-ai.github.io), static, no scripts it does not need, no cookies or analytics, like Studio. Forge Studio stays at forge.mollendorff.ai, so neither can break the other or read the other's storage"
    acceptance: "mollendorff.ai shows the page over HTTPS; .com and .ca reach it; it links to forge.mollendorff.ai and to the Forge and Ref repositories; no request leaves for another site"
  # Decided 2026-11-12, not to be added: editing in the Grid tab. The cards
  # and the YAML editor already edit values and formulas, a column has one
  # formula and a grid invites one per cell, and Studio is not an imitation of
  # Excel. The grid stays a read-only view (ADR-056 addendum, S11).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 3 — REACH (after tier 1 is done and at least two people use it)
# ═══════════════════════════════════════════════════════════════════════════════

tier3:
  - id: T3-API
    title: "REST endpoints for the analytics tools (parity with the 20 MCP tools) + OpenAPI spec"
    why: "validate, calculate and audit already take inline content; the rest only exist over MCP"
    acceptance: "Each endpoint shares its core function with the MCP tool; an OpenAPI document is generated from the handlers, not written by hand"

  - id: T3-TRANSPORT
    title: "MCP over HTTP/SSE via rmcp"
    why: "Needed for hosted or browser clients; nobody has one yet"

  - id: T3-BENCH
    title: "Per-function benchmarks"
    why: "Content for a talk, not a user need"

  - id: T3-MCP-TOKENS
    title: "Shorter MCP tool list"
    why: "16.7 KB for 20 tools; the descriptions are short already, the per-field docs repeat. Worth about 400 tokens per session; do it when there is nothing above it"

# ═══════════════════════════════════════════════════════════════════════════════
# PARKED (nothing lost; revisit when a user asks)
# ═══════════════════════════════════════════════════════════════════════════════

parked:
  - id: P-STUDIO-ASSISTANT
    title: "An AI assistant in Forge Studio that builds a model in conversation"
    why: "Forge was built for AI agents and its tools already run in the page (forge-wasm): an assistant could write the YAML and check it with Forge as an agent does through MCP. The maintainer's idea, 2026-11-11, parked by him"
    how: "An ADR first. Studio has no server, so the calls to a model would use the person's own API key, kept in their browser; each conversation costs on that key, and the model's text goes to the provider"
  - id: P-STUDIO-TOUR
    title: "A guided first visit in Forge Studio"
    why: "An FP&A analyst who has never seen YAML might not know where to tap. No one has been seen getting lost yet, and a tour has to change with every screen it explains. Parked 2026-11-13"
    how: "Revisit when someone using Studio for the first time is seen getting stuck; try one hint on the first screen before anything like a tour"
  - id: P-STUDIO-FRENCH
    title: "Forge Studio's interface in French"
    why: "The maintainer is in Montreal and the first readers may be French-speaking FP&A teams. Parked 2026-11-13: every label is written in the code and most tests read the English text, every later feature would need both languages, and Forge's own messages are in English, so the page would turn English when something goes wrong"
    how: "An ADR first: strings out of the code into one table, and whether Forge's messages are translated in the engine (then the page shows them as they are). Numbers typed with a decimal comma are read already; how a number is shown (1 234,56) belongs to format: and the engine. A model stays English: function names (SUM, not SOMME) and separators are the same in every file"
    trigger: "A French-speaking user asks, or Studio is shown to a Quebec audience"
  - id: P-GAME
    title: "Game theory module"
  - id: P-GPU
    title: "GPU acceleration"
  - id: P-FPGA
    title: "FPGA acceleration (ADR-026)"
  - id: P-CRYSTAL
    title: "Crystal analysis for DANEEL (ADR-028)"
  - id: P-SIMD
    title: "SIMD / Rayon"
    why: "Models run in milliseconds"
  - id: P-COV100
    title: "100% coverage enforcement"
    why: "Coverage did not catch any of the 2026-11-07 bugs; T1-USE is the better spend"

# Completed work is recorded in CHANGELOG.md, one entry per release.
