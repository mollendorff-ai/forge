# ═══════════════════════════════════════════════════════════════════════════════
# STUDIO — the web interface (ADR-055, ADR-056)
# ═══════════════════════════════════════════════════════════════════════════════
# A track of its own, worked in its own session alongside the engine tiers.
# It does not wait for tier 1 and does not compete with it. Done: S1, the
# engine builds without the command line or the servers, and for wasm32 in CI
# (PR #126); S2, forge-wasm runs Forge's 20 tools in WebAssembly with the
# native answers, 4.62 MB (1.51 MB gzipped) before wasm-opt (PR #129); S3,
# Forge Studio in studio/ calculating with forge-wasm, every scalar on screen
# checked against forge calculate in a headless browser.
# S4, Studio published on GitHub Pages after each release (workflow
# pages.yml; it publishes once Pages is switched on and the workflow runs).
# S5, the editor and the cards side by side above 900 px; S6, formula colours
# read from the VS Code extension's grammar, with one copy of the rules; S7,
# a formula edited on its card, kept only when Forge accepts it; S8, Excel
# export and import in the browser, the workbook forge export writes.

# S13, Studio at forge.mollendorff.ai (2026-11-13): a CNAME at EasyDNS,
# mollendorff.ai verified for the organization on GitHub Pages, no wildcard
# record (GitHub advises against one: any account could claim a subdomain).

studio:
  - id: S-HOME
    title: "A one-page home for Möllendorff AI at mollendorff.ai"
    why: "The organization has no page of its own: one place that says what Möllendorff AI is and leads to Forge Studio and the repositories. mollendorff.com and mollendorff.ca forward to it"
    how: "Its own small repository on GitHub Pages (mollendorff-ai.github.io), static, no scripts it does not need, no cookies or analytics, like Studio. Forge Studio stays at forge.mollendorff.ai, so neither can break the other or read the other's storage"
    acceptance: "mollendorff.ai shows the page over HTTPS; .com and .ca reach it; it links to forge.mollendorff.ai and to the Forge and Ref repositories; no request leaves for another site"
  # Decided 2026-11-12, not to be added: editing in the Grid tab. The cards
  # and the YAML editor already edit values and formulas, a column has one
  # formula and a grid invites one per cell, and Studio is not an imitation of
  # Excel. The grid stays a read-only view (ADR-056 addendum, S11).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 3 — REACH (after tier 1 is done and at least two people use it)
# ═══════════════════════════════════════════════════════════════════════════════

tier3:
  - id: T3-API
    title: "REST endpoints for the analytics tools (parity with the 20 MCP tools) + OpenAPI spec"
    why: "validate, calculate and audit already take inline content; the rest only exist over MCP"
    acceptance: "Each endpoint shares its core function with the MCP tool; an OpenAPI document is generated from the handlers, not written by hand"

  - id: T3-TRANSPORT
    title: "MCP over HTTP/SSE via rmcp"
    why: "Needed for hosted or browser clients; nobody has one yet"

  - id: T3-BENCH
    title: "Per-function benchmarks"
    why: "Content for a talk, not a user need"

  - id: T3-MCP-TOKENS
    title: "Shorter MCP tool list"
    why: "16.7 KB for 20 tools; the descriptions are short already, the per-field docs repeat. Worth about 400 tokens per session; do it when there is nothing above it"

# ═══════════════════════════════════════════════════════════════════════════════
# PARKED (nothing lost; revisit when a user asks)
# ═══════════════════════════════════════════════════════════════════════════════

parked:
  - id: P-STUDIO-ASSISTANT
    title: "An AI assistant in Forge Studio that builds a model in conversation"
    why: "Forge was built for AI agents and its tools already run in the page (forge-wasm): an assistant could write the YAML and check it with Forge as an agent does through MCP. The maintainer's idea, 2026-11-11, parked by him"
    how: "An ADR first. Studio has no server, so the calls to a model would use the person's own API key, kept in their browser; each conversation costs on that key, and the model's text goes to the provider"
  - id: P-STUDIO-TOUR
    title: "A guided first visit in Forge Studio"
    why: "An FP&A analyst who has never seen YAML might not know where to tap. No one has been seen getting lost yet, and a tour has to change with every screen it explains. Parked 2026-11-13"
    how: "Revisit when someone using Studio for the first time is seen getting stuck; try one hint on the first screen before anything like a tour"
  - id: P-STUDIO-FRENCH
    title: "Forge Studio's interface in French"
    why: "The maintainer is in Montreal and the first readers may be French-speaking FP&A teams. Parked 2026-11-13: every label is written in the code and most tests read the English text, every later feature would need both languages, and Forge's own messages are in English, so the page would turn English when something goes wrong"
    how: "An ADR first: strings out of the code into one table, and whether Forge's messages are translated in the engine (then the page shows them as they are). Numbers typed with a decimal comma are read already; how a number is shown (1 234,56) belongs to format: and the engine. A model stays English: function names (SUM, not SOMME) and separators are the same in every file"
    trigger: "A French-speaking user asks, or Studio is shown to a Quebec audience"
  - id: P-GAME
    title: "Game theory module"
  - id: P-GPU
    title: "GPU acceleration"
  - id: P-FPGA
    title: "FPGA acceleration (ADR-026)"
  - id: P-CRYSTAL
    title: "Crystal analysis for DANEEL (ADR-028)"
  - id: P-SIMD
    title: "SIMD / Rayon"
    why: "Models run in milliseconds"
  - id: P-COV100
    title: "100% coverage enforcement"
    why: "Coverage did not catch any of the 2026-11-07 bugs; T1-USE is the better spend"

# Completed work is recorded in CHANGELOG.md, one entry per release.
