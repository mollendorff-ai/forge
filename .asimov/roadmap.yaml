  - id: T1-IMPORT-OTHER-LANGUAGES
    title: "forge import reads a sheet of scalars headed in French, Chinese or any language"
    run_with: "Opus 5.5, medium effort: a heuristic in the importer, where a wrong guess makes a table of what were scalars"
    why: "Found 2026-11-21. Forge's names are Unicode, and a model in French or Chinese calculates and survives export and import. But the rule that makes a sheet of labels a sheet of scalars (T1-EXAMPLE-EXCEL-ROUNDTRIP) looks for English words over the columns: Value, Unit, Notes, Comment. A French drivers sheet headed Hypothèse, Valeur, Unité comes in as a table; formulas that read its cells come in as values, with warnings. Not a wrong answer, but the import loses every formula that reads an assumption"
    how: "A rule that does not depend on the language, by preference: a sheet whose cells other sheets read one at a time ($B$7) and never as a range is a sheet of scalars. Otherwise a short list of the header words in French (Valeur, Unité, Commentaire), the languages of the people Studio is for"
    acceptance: "A French and a Chinese drivers sheet, written outside Forge, import as scalars and the formulas that read them stay formulas, asserted in inline tests; the rule is in docs/FEATURES.md"

