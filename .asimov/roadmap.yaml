  # T1-EXCEL-EQUALITY is done (2026-11-18): Excel for iPhone gives Forge's
  # answer to all 13 comparisons of ADR-065, 1E15+1=1E15 and XLOOKUP over a
  # range among them; ADR-065, edge_equality.yaml and VALIDATION.md say so.
  # The same sheet found the subtraction below.

  # T1-EXCEL-SUBTRACTION is done (2026-11-18): Excel's rule measured in
  # three sheets of 69 formulas and followed (ADR-066): a formula's last + or
  # - and SUM's last addition are 0 below 8 units in the last place of the
  # larger operand. The same sheets found the item below.

  - id: T1-EXCEL-LITERAL-DIGITS
    title: "Decide whether a number typed in a formula keeps more than 15 significant digits"
    why: "Excel for iPhone showed =1E15+1-1000000000000000.5 as =1000000000000000+1-1000000000000000 and gave 1 (2026-11-18): Excel cuts a typed number to 15 significant digits when the formula is entered. Forge keeps every digit and gives 0 (0.5, 4 units in the last place, then ADR-066). A model rarely types 16 digits, so the two agree on everything else checked"
    how: "Check in Excel where the cut applies (a number in a formula, a typed value in a cell, a value read from a workbook), and whether it rounds or truncates; then follow it in the parser and the importer, or write it down in VALIDATION.md"
    acceptance: "Excel's answers for at least 5 placements are in an edge case file; the difference is fixed test-first or written down"

