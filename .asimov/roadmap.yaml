# Forge Roadmap
# Version: Cargo.toml | History: CHANGELOG.md | Config: project.yaml
#
# Rewritten 2026-11-07 after a day of real use through MCP (see CHANGELOG
# 10.0.0-rc.3 and the fixes after it). Every bug found that day, including
# a wrong answer, was found by building a model, not by review or coverage.
# The organizing question for every item is therefore: does this make the
# next real model built with Forge more likely to be right and less painful?
# Reach (distribution, REST parity, transports, benchmarks) comes after that.
#
# A roadmap item is an instruction to an autonomous agent. Each one has an
# acceptance criterion the agent cannot satisfy by writing more code: a
# number checked outside Forge, a documented behaviour observed, a decision
# written down. "Polish" and "improve" are not criteria.

state:
  version: >-
    10.0.0-rc.22, released 2026-11-13: YEARFRAC basis 0 from the last day
    of February to a 31st fixed (a wrong answer, so the two weeks in
    docs/STABILITY.md start again from rc.22: no earlier than 2026-11-27,
    the same day as before since rc.20 was also today), and the CLI and MCP
    agree on dates. rc.21 (2026-11-13): a date as a scalar (ADR-060) and
    format: beside unit: (ADR-061), both in model format 5.4.0. rc.20 (2026-11-13): a table column can aggregate a
    column (ADR-058), an empty cell in a column of numbers (ADR-059, model
    format 5.3.0, COUNTBLANK: 203 functions), and two wrong answers in
    forge import fixed (an empty cell imported as 0, and a range where Forge
    reads the row's value). Those fixes restart the two-week stable clock in
    docs/STABILITY.md: from rc.20, no earlier than 2026-11-27. rc.19 added 26
    functions and the rolling-forecast and capex-plan examples; rc.18 made
    Studio work on a phone and moved the validation suites into this
    repository (ADR-057); rc.17 suggested the keys of the model format and
    shrank Studio's download by 20%; rc.16 made Studio work offline, added
    and deleted elements on its cards, and added the Grid tab.
    rc.15 added the Excel workbook and Save to Files in Studio and 15-digit
    numbers; rc.14 was the first release with Studio; rc.13 fixed a wrong
    answer in forge export (T1-TEXT-NUMBERS) and the function list (169, not
    175).
  format: model format 5.1.0 (ADR-051), with inputs as plain numbers, formula
    scalars as a formula mapping, and results written next to formulas in
    place; 5.2.0 (ADR-053) adds the period column, 5.3.0 (ADR-059) the
    empty cell and 5.4.0 a date as a scalar (ADR-060) and a number format
    beside the unit (ADR-061), each needed only by a
    file that has one. examples/ are 5.1.0, or the format of the newest of
    these they use (the rolling forecast and the bagel are 5.4.0); test-data/ and
    validation/ stay 5.0.0 on purpose (a few validation specs are 5.2.0 to
    5.4.0, for those features).
  scope: all analysis engines are supported (ADR-050). The maintainer uses
    them and expects more scenario and simulation features.
  users: none known. One outside contributor used Forge for a few weeks in
    2026 and paused.
  what_works: calculate, validate, audit, export, import, includes with
    @namespace.name, scenarios, simulate, goal-seek, break-even,
    sensitivity, tornado, MCP with inline content, REST API with inline
    content. Verified on one 12-month model with an included costs file;
    totals matched an independent calculation and the Excel export
    recalculated with 0 mismatches.
  verified_on_a_real_model: every analytics command, on the examples/bagel
    models, with headline numbers asserted in tests/bagel_example.rs against
    independent calculations (T1-USE, 2026-11-07). The numbers were right in
    all of them; the bugs were in what surrounded them (variance flags,
    output order, a 74,000-token bootstrap reply, unreported ties).
  unverified: watch and upgrade (file tooling, not analytics).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 1 — TRUST (next release or two)
# ═══════════════════════════════════════════════════════════════════════════════

tier1:
  # Found while making dates real dates (ADR-054, 2026-11-10): places where
  # Forge and Excel may give different answers without a warning, and places
  # where Forge says less than it knows.
  - id: T1-YEARFRAC-FEB
    title: "Confirm in Excel: YEARFRAC from the last day of February to a 31st, basis 0, and the security functions"
    why: "Built (2026-11-13) on published evidence: YEARFRAC(2026-02-28, 2026-12-31, 0) is 301/360 in Forge now, as in Gnumeric, LibreOffice and the algorithm Microsoft confirmed matches Excel 2007 (D. A. Wheeler, OASIS office-formula, June 2008); Microsoft's YEARFRAC page warns about this start. Not yet typed into Excel itself. PRICEDISC, YIELDDISC and ACCRINT keep the NASD count (300/360 here): nothing published says they share the exception, and Excel's PRICEDISC on month ends (2026-11-06) agrees with NASD where both engines do not"
    how: "In Excel: =YEARFRAC(DATE(2026,2,28),DATE(2026,12,31),0) (Forge 0.8361), =PRICEDISC(DATE(2026,2,28),DATE(2026,12,31),0.05,100,0) (Forge 95.8333, engines 95.8194), =YIELDDISC(DATE(2026,2,28),DATE(2026,12,31),97,100,0) (Forge 0.03711, engines 0.03699), =ACCRINT(DATE(2026,2,28),DATE(2026,8,31),DATE(2026,12,31),0.1,1000,2,0) (Forge 83.3333, LibreOffice 83.6111). If YEARFRAC is not 0.8361, revert it; if a security function gives the engines' value, give it YEARFRAC's count"
    acceptance: "The four Excel values are recorded in validation/gnumeric (financial.yaml) with the date they were checked, and Forge gives them"

  - id: T1-EXCEL-CHECKS
    title: "Results to check in real Excel, where the engines and Forge do not settle it"
    why: "Each differs from something published or from one or both engines. VDB(2400,300,10*12,6,18,3): Microsoft's page says 396.31, Forge, Gnumeric, LibreOffice and a Python loop give 540.19. WEEKNUM(DATE(2020,12,31),11): Forge and the calendar say 53, LibreOffice says 1 (nine year-end cases of types 11 to 17 are checked against Forge only). Found by the sweep of 2026-11-13 (validation/sweep): VDB with a fractional start differs from both engines in all 281 such cases (VDB(100,10,3,0.5,1): Forge 22.22, both 33.33; whole starts all agree); TIME(23,59,59.5): Forge 0.999988 (seconds truncated, as Excel is believed to), both 0.999994; DATEDIF(DATE(2024,2,29),DATE(2025,12,29),\"YD\"): Forge 304, LibreOffice 303; SYD(10000,1000,0.5,1): Forge #NUM! (period after a life under 1), both 12000; DATE(1899,12,31): Forge 3799-12-31 by Microsoft's DATE page, both engines 1899-12-31"
    how: "Type each in Excel. VDB 396.31: find what differs. WEEKNUM 1: change the year-end rule of types 11 to 17. VDB with a fractional start at 33.33: count it as the engines do. For the others, give Forge Excel's answer where it differs"
    acceptance: "The Excel values are recorded in validation/gnumeric with the date they were checked, and Forge gives them"

