# Forge Roadmap
# Version: Cargo.toml | History: CHANGELOG.md | Config: project.yaml
#
# Rewritten 2026-11-07 after a day of real use through MCP (see CHANGELOG
# 10.0.0-rc.3 and the fixes after it). Every bug found that day, including
# a wrong answer, was found by building a model, not by review or coverage.
# The organizing question for every item is therefore: does this make the
# next real model built with Forge more likely to be right and less painful?
# Reach (distribution, REST parity, transports, benchmarks) comes after that.
#
# A roadmap item is an instruction to an autonomous agent. Each one has an
# acceptance criterion the agent cannot satisfy by writing more code: a
# number checked outside Forge, a documented behaviour observed, a decision
# written down. "Polish" and "improve" are not criteria.

state:
  version: 10.0.0-rc.11, released 2026-11-10 after two wrong answers in forge
    import (the first row's formula taken for the whole column; Excel's ROW()
    and COLUMN() read as Forge's). The two-week stable clock in
    docs/STABILITY.md runs from this release (no earlier than 2026-11-24); a
    new wrong answer restarts it. rc.11 also adds PREV, period columns and
    model format 5.2.0 (ADR-053).
  format: model format 5.1.0 (ADR-051), with inputs as plain numbers, formula
    scalars as a formula mapping, and results written next to formulas in
    place; 5.2.0 (ADR-053) adds the period column and is needed only by a
    file that has one. examples/ are 5.1.0, and 5.2.0 where they have a period
    column; test-data/ and the validation repos stay 5.0.0 on purpose (one
    spec of forge-e2e-gnumeric is 5.2.0, for the period column).
  scope: all analysis engines are supported (ADR-050). The maintainer uses
    them and expects more scenario and simulation features.
  users: none known. One outside contributor used Forge for a few weeks in
    2026 and paused.
  what_works: calculate, validate, audit, export, import, includes with
    @namespace.name, scenarios, simulate, goal-seek, break-even,
    sensitivity, tornado, MCP with inline content, REST API with inline
    content. Verified on one 12-month model with an included costs file;
    totals matched an independent calculation and the Excel export
    recalculated with 0 mismatches.
  verified_on_a_real_model: every analytics command, on the examples/bagel
    models, with headline numbers asserted in tests/bagel_example.rs against
    independent calculations (T1-USE, 2026-11-07). The numbers were right in
    all of them; the bugs were in what surrounded them (variance flags,
    output order, a 74,000-token bootstrap reply, unreported ties).
  unverified: watch and upgrade (file tooling, not analytics).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 1 — TRUST (next release or two)
# ═══════════════════════════════════════════════════════════════════════════════

tier1:
  [] # every tier-1 item is done (2026-11-09); the next ones come from tier 2

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 2 — MODELING (what would change how Forge feels to use)
# ═══════════════════════════════════════════════════════════════════════════════

tier2:
  # From a real use on 2026-11-10: five apartment options as five groups of
  # scalars with the same keys. forge calculate gave every number right; a
  # side-by-side table of them took a Python script, and the first model
  # failed twice on its format. Ahead of tier 3 because they come from use.
  - id: T2-REPORT
    title: "forge report: a calculated model's scalars as a table"
    why: "Forge computes but does not present. calculate --dry-run prints one line per scalar (le_george.year1_monthly = 1510); comparing five groups side by side took a script. compare lines up scenarios of one model, not groups"
    how: "A read-only command: one row per group, one column per key, groups with the same keys in one table, others in their own, in file order; inputs before formulas; table, csv, json and markdown. It never calculates and never writes the file; uncalculated formulas are said so in one line. The CLI surface is approved by the maintainer before code, because a command's flags are kept within 10.x (docs/STABILITY.md)"
    acceptance: "On the comparison example, every number report prints equals the value calculate wrote, the file is byte-identical after report, the markdown output parses as one pipe table per key set, and a rate such as 0.0479 is not printed as 0.05"

  - id: T2-FIRST-MODEL
    title: "A first model that calculates without a format error"
    why: "The two mistakes every first model makes are _forge_version set to the Forge version and a bare =formula in a group of scalars. Both errors already say what is wrong and how to write it (since 2026-11-08), but the mistake is still made, and LLMs, the stated users, make it first"
    how: "There is no forge init; the templates are forge examples (and the MCP examples tool). Add a starter that shows both shapes, a group of scalars with {formula: ...} and a table with bare =formula columns, each with a one-line comment saying why. Add a short Your first model section with those two rules first. Optionally end the version error with the exact line to write"
    acceptance: "The starter, copied as is, calculates; an LLM given only the starter and asked for a five-option comparison writes a file that calculates on the first try (tried once, noted in the PR)"

  - id: T2-COMPARE-EXAMPLE
    title: "Example: comparing options side by side"
    why: "The flow that prompted T2-REPORT, calculate then report, should be one file anyone can run"
    how: "examples/options/compare-options.yaml (not examples/scenarios/, which would sit beside scenarios.yaml and suggest the scenarios command): five invented options (rental units or phone plans) with the same formula keys, referenced from the report doc. Lands with or after T2-REPORT"
    acceptance: "Runs in CI with the other examples, and its numbers are checked against the same calculation in Python in tests/demo_examples.rs"

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 3 — REACH (after tier 1 is done and at least two people use it)
# ═══════════════════════════════════════════════════════════════════════════════

tier3:
  - id: T3-EXPORT-DATES
    title: "Date columns as real dates in Excel"
    why: "forge export writes dates as text (2026-12-01), a period column included (ADR-053). Charts, filters and pivots in Excel want real dates"
    how: "Decide what a text function on a date column means first: LEFT(month, 4) is 2026 in Forge and would be 4635 on a date serial in Excel. forge import must read date cells back as ISO text"
    acceptance: "A date column is a date in Excel, every forge-e2e-gnumeric date case still passes in Gnumeric and after import, and a formula whose result would differ is written as its value"

  - id: T3-IMPORT-PREV
    title: "Import reads PREV back as written"
    why: "forge import reads a column that reads the row above as IF(ROW() = 1, first, PREV(...)): correct, but not the PREV(value, first) the model was exported from, and a column that reads two or more rows up comes in as values"
    acceptance: "A model with PREV(value, first) and PREV(value, first, 2) columns is exported and imported to the same formulas, respaced"

  - id: T3-DIST
    title: "Homebrew formula + cargo-binstall"
    why: "Nobody installs from source; but nobody is trying to yet"
    acceptance: "brew install and cargo binstall both produce a binary whose --version matches the release"

  - id: T3-API
    title: "REST endpoints for the analytics tools (parity with the 20 MCP tools) + OpenAPI spec"
    why: "validate, calculate and audit already take inline content; the rest only exist over MCP"
    acceptance: "Each endpoint shares its core function with the MCP tool; an OpenAPI document is generated from the handlers, not written by hand"

  - id: T3-TRANSPORT
    title: "MCP over HTTP/SSE via rmcp"
    why: "Needed for hosted or browser clients; nobody has one yet"

  - id: T3-BENCH
    title: "Per-function benchmarks"
    why: "Content for a talk, not a user need"

  - id: T3-MCP-TOKENS
    title: "Shorter MCP tool list"
    why: "16.7 KB for 20 tools; the descriptions are short already, the per-field docs repeat. Worth about 400 tokens per session; do it when there is nothing above it"

