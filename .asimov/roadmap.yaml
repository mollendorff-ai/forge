# ═══════════════════════════════════════════════════════════════════════════════
# TIER 2 — MODELING (what would change how Forge feels to use)
# ═══════════════════════════════════════════════════════════════════════════════

tier2:
  - id: T2-SCENARIO-CHECKS
    title: "A model states what each scenario should give, and forge validate checks it"
    why: "Found 2026-11-22 trying to remove the last Python from kinship-protocol (github.com/mollendorff-ai/kinship-protocol), whose CI runs scripts/check_models.py (647 lines) to pin the figures its docs quote. forge validate checks the value: stored next to each formula, but only for the base case: it takes no --scenario, and most of kinship's figures are results of scenarios (a cost of conflict, a noise level, a horizon, a number of generations). So the expected figures live in a script, and nothing in the model says what a scenario should give. forge compare shows scenarios side by side and checks nothing. The maintainer chose this route (2026-11-22) over committed output files that CI diffs, which are regenerated, not stated"
    how: "ADR-074 (accepted 2026-11-22). Built 2026-11-22: steps 1 to 4, expect: (format 5.6.0), forge validate, calculate --scenario writing nothing, MCP, REST and Studio; examples/games/stag-hunt.yaml states its figures. Steps 5 and 6 built 2026-11-22 (see T2-BAYESIAN-LINK); kinship-protocol's v0.8.0 moves its figures in once they are released. The ADR: an expect: in each scenario and at the top of the file (format 5.6.0), checked by forge validate within 1e-6, calculate --scenario writing nothing, and for T2-BAYESIAN-LINK a network that reads scalars, --scenario and named queries, built together; =BAYES() left out. An ADR first (ADR-074): where a scenario's expected results are written (a value: on the formula for each scenario, or an expect: beside the scenario's scalars), what forge validate says when one differs (the scenario, the name, both numbers, as it does for the base case), the tolerance, and whether forge calculate --scenario writes them as it writes the base case's. The MCP validate and Studio say the same as the command. Decide it with kinship-protocol's models in front of it: every figure its script pins is the first real use. Then T2-BAYESIAN-LINK's first step, so that its Bayesian check can move too"
    acceptance: "kinship-protocol's expected figures live in its models and forge validate checks every one, scenario by scenario, so its scripts/check_models.py can be deleted; breaking a value in a scenario makes validate fail with the scenario named; the ADR says what was left out"

  - id: T2-BAYESIAN-LINK
    title: "Let a Bayesian network's results drive the model"
    why: "Asked 2026-11-15 whether Forge's Bayesian networks are 'too basic' (a Grok review). Read from the code: exact inference on discrete nodes by variable elimination with hard evidence, checked against R's bnlearn on ten networks; no learning from data, no continuous nodes (now refused with a reason; before, 'No factors remaining'), no soft evidence, no joint most-probable explanation. Competing with pgmpy or bnlearn on inference features would be scope creep. What is missing for an FP&A user is that the network sits beside the model: its probabilities cannot come from formulas, and its results cannot feed formulas, scenarios or a simulation, as the other engines' do (the probability of default given the economy feeding expected loss is the use no spreadsheet does)"
    how: "ADR-074 (accepted 2026-11-22, built: see below) decides it: a prior or table entry may be a formula over scalars, forge bayesian takes --scenario, and named queries in the network give each posterior as a scalar of the model (bayesian_network.<query>.<state>), which formulas, expect:, simulate and tornado read; =BAYES() is left out, since a query is easier for an agent to write and check. An ADR first: a node's prior or table entries written as formulas, and a query result readable from a formula (such as =BAYES(network, node, state, evidence)), without a second model format. Decide it with a real use in front of it (T2-FIRST-USER), not before. A real use has come (2026-11-22): kinship-protocol's mistake_or_defection.yaml is checked at nine settings of the prior and the noise by a script that rewrites the network's numbers, because forge bayesian refuses a formula in a prior or a table ('invalid type: string, expected f64') and takes no --scenario. A first step smaller than =BAYES(): a node's prior and table entries may be formulas over scalars, and forge bayesian takes --scenario, so the nine settings are scenarios of one file; decide it in the same ADR as T2-SCENARIO-CHECKS or beside it"
    acceptance: "A worked example in examples/ where a posterior feeds a result in the model, calculated and checked against a hand calculation, and the ADR says what was left out. For the first step: kinship-protocol's nine settings are scenarios of one file, and forge bayesian --scenario gives each of them, checked against Bayes' rule worked out by hand"
    built: "2026-11-22, ADR-074 steps 5 and 6. A prior or table entry is a number or a formula over the model's scalars (src/bayesian/written.rs), worked out after them and under the scenario applied, each row then checked to be probabilities, with the node named; forge bayesian --scenario, and scenario on forge_bayesian and forge-wasm's bayesian; named queries (bayesian_network.queries.<q>: {node, evidence}) checked when the file is read, whose posteriors are scalars bayesian_network.<q>.<state>, the network a cell of the calculation as a game is (src/core/array_calculator/network.rs), a cycle refused. examples/expected_loss.yaml: the probability of default given the economy feeding an expected loss, Bayes' rule by hand beside it, both pinned by expect: in the file and two scenarios. simulate moves a prior that reads an MC.* input, and tornado one that reads a scalar, each run checked by hand (src/cli/commands/simulate/mod.rs, src/tornado/engine.rs). What is left of the acceptance is kinship-protocol's: its nine settings as scenarios of one file, after a release"
    studio: "forge_bayesian takes a scenario (2026-11-22), but Forge Studio's Bayesian card does not pass the scenario chosen on the Model view yet (runAnalyses in studio/app.js), as the game card does; it is drawn at the plan in every scenario. A test needs a network with scenarios in one of Studio's example sets (examples/expected_loss.yaml is in none)"

  - id: T2-GAME-THEORY
    title: "Games: a payoff table, and which strategies are an equilibrium"
    why: "Parked as P-GAME until a user asked; the maintainer asked on 2026-11-16, for his own kinship-protocol (github.com/mollendorff-ai/kinship-protocol), which calls Forge its game-theory calculator and wants more games. Read from its 13 models: a game is written by hand as scalars, one formula per strategy per parameter step (stag_hunt.yaml: c0_coop, c0_defect, c0_coop_wins, then c1_, c2_, c3_), a 'wins' flag is an IF the author writes, and the Axelrod tournament's average payoffs are numbers typed in (grim_base 2.622), calculated somewhere else. Forge works out a payoff and cannot say which strategy is dominated or where the equilibrium is. The second use is the one behind T1-MA-EXAMPLE: a bidding contest or a price answer, where the other side reacts"
    how: "ADR-068 (accepted 2026-11-19): a games: section in model format 5.5.0, exact expected values for tournaments, results readable by formulas. The maintainer asked for it before the stable release (2026-11-19). Built: the section and its parser, schema 5.5.0, a game as a cell of the calculation, dominated strategies, pure equilibria for any number of players, mixed ones for two (checked against nashpy 0.0.43 and by hand), tornado, simulate, sensitivity and goal-seek on a game result, and a warning from forge export that names the games (Excel cannot find an equilibrium; the payoff formulas are not written and the results are numbers as of the export). Then (PR #299): the forge game command; tournaments (exact match values as joint Markov chains, noise, continuation, collectively stable strategies; every pair of the nine strategies within 2.4 standard errors of the axelrod library's seeded average); the forge_game MCP tool (21 tools) and game in forge-wasm; seven examples in examples/games with their numbers asserted (stag hunt, chicken and Axelrod from kinship-protocol, inspection with its tornado, a noisy tournament, battle of the sexes, the continuation sweep). kinship-protocol's three models are rewritten in its own repository (its v0.5.0, 2026-11-20), with the four further games; one went against this item's acceptance text: in its noisy tournament generous TitForTat came 5th at 5% noise and TitForTwoTats won at 1%, so 'a forgiving strategy wins' holds only while mistakes are rare (its docs/MORE_GAMES.md). The e2e suite is T2-GAME-THEORY-E2E. The ADR says what is left out (more than two players in mixed strategies, extensive-form games, auctions)."
    acceptance: "kinship-protocol's stag hunt, chicken and Axelrod tournament are rewritten as game sections and give the results its models store today, or the difference is explained; the tournament's average payoffs are calculated by Forge and no longer typed in; every equilibrium in the tests is checked against the outside tool or a hand calculation. Two more games, chosen because the three above do not cover them: an inspection game (an AI complies or cheats, a human audits or trusts; it has no pure equilibrium, so it tests the mixed path, and a tornado on the penalty shows the known result that a harsher penalty lowers the audit rate and not the cheating), and a tournament with noise (each move is mistaken with a small seeded probability, so tit-for-tat falls apart and a forgiving strategy wins), each with its equilibrium or ranking checked the same way. Optional, same checks: a battle of the sexes (two pure equilibria and one mixed), and a sweep of the continuation probability that shows cooperation taking over near the threshold kinship-protocol derives by formula"

  - id: T2-GAME-THEORY-E2E
    title: "Check the games against an outside engine, as the analytics are checked against R"
    why: "Every equilibrium asserted in the unit tests is checked against nashpy or by hand, once, when the test is written. Nothing runs Forge as a program against another engine, as validation/gnumeric and validation/r do. nashpy runs the same support enumeration as Forge, so it is not independent of the method; Gambit (pygambit 16.7.0 installs from PyPI) is a separate implementation with its own pure, mixed and LCP solvers. Spreadsheets cannot check an equilibrium, so Gnumeric and LibreOffice only matter for the export, which now warns instead (2026-11-19)"
    how: "After the forge game command, a suite validation/games (ADR-057 puts the suites in validation/) run by the Validation workflow. Specs are game models run through forge game -o json and compared with Gambit; tournaments are compared with the axelrod library as averages over many seeded runs within a stated tolerance. Then generated cases as in validation/sweep: seeded random games from 2x2 to 6x6, ties included on purpose, where Forge and Gambit must find the same equilibria, and every one Gambit finds and Forge does not must be in a game Forge reports as degenerate. R has no package that is a reference for equilibria, so it checks only the closed forms of 2x2 games"
    acceptance: "The suite runs in CI on every pull request that changes src/ or the suite; the three kinship-protocol games, the two new ones and the generated games agree with Gambit; a disagreement that is not a reported degenerate game fails the run; VALIDATION.md has a section and a row in its summary table"
    built: "2026-11-20, validation/games (Python, as validation/sweep; the README holds the rules): the named games and the shipped examples against Gambit, every pair of the nine strategies in three settings against axelrod, seeded random games 2x2 to 6x6 against Gambit, and R for the 2x2 closed forms. A degenerate report has to be proved as well as made (a game with a tie at a pure strategy or an equilibrium is reported, and one reported is shown to have one), so it cannot excuse a disagreement it does not describe. Job `Games vs Gambit, axelrod and R` in validation.yml"

  - id: T2-GAME-THEORY-MORE
    title: "Games with more than two players, and strategies that spread"
    why: "Proposed 2026-11-16 beside T2-GAME-THEORY, from the maintainer's list of games for kinship-protocol. A five-player public goods game is the project's own setup (five AIs), and replicator dynamics (strategy shares changing by generation) would sit beside its predator_prey.yaml. T2-GAME-THEORY leaves both out on purpose: mixed strategies beyond two players, and any dynamics. Parked so the idea is kept, not planned. Used 2026-11-21 on rc.31: kinship-protocol v0.6.0 has the five-player public goods game (models/public_goods.yaml), and Forge's pure equilibria for five players agree with Gambit (pygambit 16.7, enumpure_solve) and a hand enumeration in all five of its scenarios: 1, 1, 32, 1 and 1 equilibria, the 32 being the degenerate case where every profile is one. What it lacked: symmetric: true takes exactly two players (`games.pg is symmetric, which needs two players with the same strategies`), so a game whose five players have the same payoffs is 32 cells written out by a script, where a player's own strategy and how many others play each would do; a tournament's round must be a symmetric two-player game, so the repeated public goods game cannot be written; and replicator dynamics, as above"
    how: "ADR-073 (accepted 2026-11-21): the count form, symmetric mixed equilibria of two-strategy games and a dynamics: key are built; tournaments of many players and the general mixed case stay out. After T2-GAME-THEORY is built and used. An ADR first, deciding whether pure equilibria for n players are enough for the public goods game, and whether replicator dynamics belong in a game section or in the existing time-series model. Extensive-form games such as the ultimatum game stay out"
    acceptance: "A five-player public goods game whose pure equilibria are checked against the outside tool or a hand calculation, and the ADR says what was left out"
    built: "2026-11-21, ADR-073 steps 1 to 4. The count form (#334): a symmetric game of any number of players with one payoff per strategy over <game>.others.<strategy>, examples/games/public-goods.yaml, and validation/games/counted.py against Gambit's enumpure_solve. The symmetric mixed equilibria of a symmetric game of two strategies (src/games/population.rs): the roots of the population function by polycool (roots 0.0.8, chosen in the ADR, misses roots; measured and noted there), <game>.equilibrium_<k>.stable, the degenerate case named, examples/games/volunteers-dilemma.yaml, and validation/games/symmetric.py against the closed form, the exact roots (sympy) and Gambit's enumpoly_solve. Step 5, the dynamics: key (src/games/dynamics.rs): the discrete replicator equation of a symmetric game of any number of players and strategies, <game>.dynamics.share.<strategy> and <game>.dynamics.payoff, the path in forge game and its -o output, examples/games/hawk-dove.yaml and dynamics in stag-hunt.yaml, and validation/games/dynamics.py against egttools 0.2.1 every generation; the suite found the step leaving the simplex where the average payoff is below 0, fixed before release (ADR-073's note under question 3). Studio's view (2026-11-22): a game of players alike drawn by count, its pure equilibria by split, the dynamics as a chart of the shares and a table of the path, and public-goods, volunteers-dilemma and hawk-dove in the Games set, each number checked against Forge's report by studio/tests/games.mjs. Checked again in R (validation/games/many_players.R: the dynamics stepped again, the symmetric mixes as polynomial roots, the closed forms) and through forge_game in-process. The bagel's games of many shops (2026-11-22): the price war across the city (dynamics) and the street's festival of five shops (examples/bagel/street_fund.yaml)"

  - id: T2-FIRST-USER
    title: "Watch one real person build a model with Forge"
    why: "Every bug found on 2026-11-07 came from building a model, and fresh agents have found the rest (T1-AGENT-FRICTION). A person who did not write Forge has not been watched yet. This is to find where a model goes wrong or a command confuses, not to test demand: adoption is not a goal (2026-11-16)"
    how: "When someone offers, not by recruiting: one FP&A analyst or AI pipeline builder, their own small model, Studio or the command line, the maintainer watching without helping. Write down where they stop"
    acceptance: "Notes from the session are in this file as tier items with acceptance criteria, or the decision that nothing needs to change"

