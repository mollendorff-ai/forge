tier1:
  # From an evaluation of rc.23 (2026-11-14): every result checked by hand
  # matched, 1,828 tests and 1,791 Gnumeric cases passed. What it found is in
  # the checks around the numbers and in what the project says about itself.
  # In order of impact; T1-TEST-RULE, T1-GENERATED and T1-PROPERTIES are the
  # testing plan that follows from it ("covered" is not "correct").
  # T1-GENERATED is done (2026-11-14): ADR-062 built. Generated cases run on
  # every pull request (seed 1) and every week (a new seed) in validation.yml,
  # with the known differences in validation/sweep/known.py.

  # T1-CLAIMS is done (seen 2026-11-16): the GitHub About text is the
  # README's first line, followed by "A Rust engine with a command line, an
  # MCP server and a browser app."; the 10-15x token claim is gone.

  - id: T1-LISTINGS
    title: "Outside listings show today's Forge"
    why: "The LobeHub MCP listing (royalbit forge) still shows the Elastic-2.0 licence and the battle-tested wording of an old README"
    how: "The maintainer asks LobeHub to refresh or remove it; check other listings (ecosyste.ms, docs.rs for old versions) at the same time"
    acceptance: "The listing shows MIT OR Apache-2.0 and the current description, or is gone"

  # Found while making dates real dates (ADR-054, 2026-11-10): places where
  # Forge and Excel may give different answers without a warning, and places
  # where Forge says less than it knows.

  - id: T1-AGENT-FRICTION
    title: "Run the five prompts of docs/PROMPTS.md again with fresh agents, after the friction fixes"
    why: "The fixes from the 2026-11-15 runs are in (CHANGELOG [Unreleased]): short flags agree, --output-var, bare names, validate's messages, variance's is_favorable and --fail-on-alert, export and import notes, real-options' value added, help and example paths. Not changed, by design: a table column is one formula or a list of literals, so a product mix needs an IF on a name"
    how: "A fresh agent per prompt, on a release that has the fixes; each reports where it had to work around Forge"
    acceptance: "The five prompts in docs/PROMPTS.md run again by fresh agents, whose reports name none of the earlier friction"

  # Found by a fresh agent running the bagel example on rc.27 (2026-11-16);
  # both done the same day (CHANGELOG [Unreleased]): T1-SIM-SHOW-ONE,
  # forge simulate --output-var and forge_simulate's outputs; and
  # T1-SIM-MEAN-VS-PLAN, each input's plan value beside its mean and each
  # output's value at plan (tests/simulate_plan.rs checks the bagel's 786.32
  # and the closed-form gap of -16,703.34).

  # Non-negotiable (the maintainer, 2026-11-16): 100% test coverage, pedantic
  # linting and formatting, each a gate that fails CI, not a badge. Formatting
  # (cargo fmt --check) and pedantic clippy with -D warnings are gates already;
  # since 2026-11-16 the MSRV job lints every target, tests included.

  - id: T1-COVERAGE-GATE
    title: "100% coverage: lines, functions and regions, with nothing skipped"
    why: "ADR-004 requires 100%, but its 2026-11-08 note made it a goal; P-COV100 was parked for the same reason, now overruled by the maintainer (2026-11-16: no exceptions, no skipping). Measured on PR #257's head (2026-11-16): lines 88.04%, functions 84.46%, regions 86.31%. Since then the Coverage job fails below floors in ci.yml (88.0, 84.4 and 86.3 at first; 88.9, 85.4 and 87.3 since PR #258; 89.6, 86.1 and 88.1 since PR #259), which only rise, and make coverage fails below 100"
    how: "List each uncovered line by file (cargo llvm-cov --ignore-filename-regex 'tests/' --summary-only, then --show-missing-lines). Cover each with a test that asserts a result. A line no test can reach is a defensive branch that cannot happen: remove it, or make the type rule it out; never exclude it from the count. Raise the floors in ci.yml with each merge that raises coverage"
    acceptance: "The floors in ci.yml are 100 for lines, functions and regions, and the Coverage job passes on main; validation/repo/src/no_skipping.rs counts no coverage-only code and no ignored test"

  # T1-TESTS-INLINE is done (2026-11-17, PRs #257 to #263): every test is
  # inline, in the module it tests, in every crate, and no Rust file is over
  # 1,500 lines. The oversized parents were split by what they do (the
  # evaluator, the calculator, the workbook references, the MCP server, the
  # exporter, then analysis, excel_io and prediction by command); the test
  # modules kept in files of their own were folded back; the tests/ files
  # that call the library moved into their modules; the command line runs
  # in-process (cli::run_from on a Console, outln!/errln!), so the tests that
  # started the binary call it (cli::forge, mcp::Session); and the checks of
  # the repository's own text are validation/repo, which runs the built
  # binary as a reader does. The closed pipe is a step of the MCP Protocol
  # Test job. Both budgets in validation/repo/src/no_skipping.rs are 0.

  # T1-NO-SKIPPING, casts outside the calculator are done (2026-11-17): no
  # allow of cast_possible_truncation, cast_sign_loss or cast_possible_wrap is
  # left outside core/array_calculator and the validation suites. A float
  # becomes an integer through num_traits::ToPrimitive, each edge decided
  # and tested (a percentile below 0 or above 100, NaN, a range of too many
  # steps); Excel rows and columns are counted in u32 and u16, so the writer's
  # own limits refuse a cell; a binomial tree has u16 steps, at most 65,535.
  # The calculator outside the evaluator is done too (2026-11-17): its 24
  # casts were all in core/array_calculator/dates.rs, 612 lines of older date
  # functions that nothing called, hidden by allow(dead_code), now deleted.
  # The evaluator is done (2026-11-17): its 104 casts that could truncate,
  # lose a sign or wrap are checked conversions, each edge tested, and the
  # module-wide allow is gone. They hid six crashes (DATE, EDATE, EOMONTH,
  # TIME, SEQUENCE, RANDARRAY, DB and PERCENTILE.EXC past an i32) and two
  # wrong answers (ISEVEN past 2^63, WORKDAY past the calendar), fixed test
  # first. Found on the way and not casts, so left for their own change:
  # VLOOKUP and HLOOKUP ignored col_index and row_index (fixed 2026-11-17:
  # #VALUE! below 1, #REF! past the one column or row, and the approximate
  # search is MATCH's); ROUND(x, -400) is
  # #NUM! (Gnumeric 0); DB with a fractional period cuts it (Gnumeric 0);
  # TIME(1, -30, 0) is 0:30 (Gnumeric #NUM!); HOUR(1E+20) is 0 (Gnumeric
  # #NUM!). cast_precision_loss is done too (2026-11-18): no allow is left, in
  # Cargo.toml or in an attribute. A count, a place in an array or a day count
  # becomes a number through precision::count, whole and unsigned, built from
  # 32-bit halves that convert without loss and give the bits `as f64` gives
  # (not a try_from: a count past 2^53 cannot exist in memory, and an error
  # branch no test can reach breaks the coverage rule). The two validation
  # suites do not link Forge, so each has its own small conversion.
  # approx_constant is done too (2026-11-18): 18 allows, 17 of which hid
  # nothing; the 3 literals that did became FRAC_1_SQRT_2. too_many_lines is done too (2026-11-18): 14 functions of 131 to 572
  # lines split by what they do, none rewritten (the dispatch tables keep one
  # line per function), and the stale allows in the Gnumeric Cargo.toml and
  # the R suite gone. 38 allows left in attributes and 13 in Cargo.toml files.
  # T1-NO-SKIPPING, float_cmp is done (2026-11-17): no allow is left. Tests
  # assert an exact number with assert_exact! (the same bits, src/lib.rs),
  # and the ten exact comparisons in the engine (MODE, a variance on budget,
  # the depreciation periods, the writer's same number) go through
  # core::precision::same, IEEE equality named and tested. 155 allows left.
  - id: T1-NO-SKIPPING
    title: "No way round the three rules, in every crate"
    why: "Counted 2026-11-16 by validation/repo/src/no_skipping.rs, which fails if any count rises: 218 lint allow or expect attributes (float_cmp 62, cast_possible_truncation 59, approx_constant 18, cast_precision_loss 16, too_many_lines 13, unnecessary_wraps 8, dead_code 6, and 15 more), 16 lints allowed in Cargo.toml files (multiple_crate_versions and cast_precision_loss in the main crate and forge-wasm; 8 in validation/gnumeric and 4 in validation/r), the cargo lint group missing in both validation crates, 31 places of code compiled only for or only without coverage (23 test files run nothing under coverage), and 2 ignored tests (a release-only timing test, and a round-trip corpus that needs FORGE_ROUNDTRIP_DIR)"
    how: "One kind of lint or one crate per pull request, each lowering its budget in validation/repo/src/no_skipping.rs. A count is not a size: the #![allow] of three cast lints at the top of core/array_calculator/evaluator/mod.rs is one attribute and covers the whole evaluator, about 24,000 lines, so it is worth more than most. float_cmp in tests: an assertion helper for an exact value. Casts: checked conversions (try_from) with the error named, in numeric code with a test at the boundary, since a careless cast is a wrong answer. too_many_lines: split the function. multiple_crate_versions: update or replace the dependency that pulls the second version. The coverage-only test files: make each run under cargo llvm-cov (it measures the binary they start). The two ignored tests: run the timing test in the release-build job it was meant for, and give the round-trip corpus a fixture in the repository"
    acceptance: "Every budget in validation/repo/src/no_skipping.rs is 0 and the test passes; CLAUDE.md and project.yaml name no exception"

  # From an independent audit of rc.26 at f389e22 (2026-11-15), checked again
  # on main at f77fa0a (rc.27, 2026-11-16): the examples were recomputed
  # outside Forge and agreed to the cent; the findings are in what a malformed
  # model does, which an AI agent writing the model through MCP can cause.
  # Of the audit's T1-LINT-GATE, the scope.rs doc comment was fixed in
  # d335791 and the ten test sites (float_cmp, missing_const_for_fn) on
  # 2026-11-16; its release attestations (T1-SUPPLY-CHAIN) are in d335791.
  # T1-NONFINITE is done (2026-11-16): every distribution argument, max - min
  # and the draws at both ends must be finite (distributions.rs,
  # src/monte_carlo/distributions.rs (its refused_everywhere tests)); it found T1-HUGE-STATS and T1-DISCRETE.
  # T1-DEPTH is done (2026-11-16): a formula may nest 128 levels (parser.rs
  # MAX_DEPTH, src/core/array_calculator/mod.rs (its formula_depth tests)); the audit's 256 overflowed a 2 MiB debug
  # thread, which is the size of a test thread.

  - id: T1-HUGE-STATS
    title: "The summary statistics of a simulation overflow above about 1e154"
    why: "Found 2026-11-16 while fixing T1-NONFINITE: MC.Triangular(-1E+307, 0, 1E+307) draws finite values and forge simulate prints a finite mean, median, extremes and percentiles, but Std Dev: inf, because Statistics::from_samples squares each deviation (src/monte_carlo/statistics.rs). Any output, from a distribution or a formula (x^200), with values above about 1.3e154 does the same; a sum of many values near 1e306 makes the mean inf too, and the histogram's max - min can overflow. The variance of values near 1e307 (about 1e613) cannot be a number at all"
    how: "An ADR or a short decision first: refuse an output whose values cannot be summarized, or report the standard deviation by scaling (the largest deviation out, then back in) and the variance as too large to show. Keep the results of every model that calculates today the same to the last digit (compute the plain way first, as triangular_quantile does)"
    acceptance: "forge simulate on MC.Triangular(-1E+307, 0, 1E+307) prints no inf and no NaN, or exits 1 saying why; the decision is written down; the refused_everywhere tests in src/monte_carlo/distributions.rs no longer allow the one inf line"

  - id: T1-DISCRETE
    title: "MC.Discrete is documented and cannot be used"
    why: "Found 2026-11-16: docs/FEATURES.md, docs/FUNCTIONS.md, docs/MCP.md, docs/FPA-PREDICTION-METHODS.md and forge simulate --help list MC.Discrete(values, probabilities), but parse_distribution (src/monte_carlo/distributions.rs) has no branch for it: MC.Discrete(1, 0.5, 2, 0.5) gives 'Unknown distribution type: Discrete', and with array constants {1,2} or [1, 2] the arguments do not parse. Distribution::discrete exists, is checked, and is reached only from tests"
    how: "Decide the syntax (array constants, ADR-064, are the Excel way: MC.Discrete({1,2,3}, {0.2,0.5,0.3})) and parse it, with an example and a test against a hand calculation; or take MC.Discrete out of the five places that list it, until it is built"
    acceptance: "Either a model with MC.Discrete simulates and its probabilities are checked in a test, or no document or help text names it"

  # T1-EQUAL-NEAR-ZERO is done (2026-11-17, ADR-065): the six operators and
  # the COUNTIF-family criteria compare two numbers rounded to 15 significant
  # digits, the exact lookups and RANK's membership exactly, as Microsoft's
  # documentation and Q&A answers describe Excel; -1E-12 = 0 is FALSE. The
  # equal-near-zero rule in known.py is gone. Without Excel at hand, the rule
  # was taken from documentation: T1-EXCEL-EQUALITY checks it.
  - id: T1-EXCEL-EQUALITY
    title: "Check ADR-065's comparisons in Excel"
    why: "ADR-065 follows Microsoft's description of Excel's comparison (15 significant digits for the operators and COUNTIF, exact for the lookups), not a check in Excel. Its table lists 13 formulas; 1E15+1=1E15 is TRUE in Forge by that rule and FALSE in LibreOffice and Gnumeric, and XLOOKUP over a range differs in LibreOffice. Also open: Excel sets a final subtraction near zero to 0 (=0.1+0.2-0.3, LibreOffice 0, Forge 5.55E-17)"
    how: "Type ADR-065's table into Excel (desktop or the iPhone app) with 0.1+0.2-0.3 and 1E15+0.2-1E15; put Excel's answers into validation/gnumeric/tests/edge/edge_equality.yaml as edge_excel_checks*.yaml does; fix any difference test first; decide the subtraction separately"
    acceptance: "ADR-065 says which rows Excel confirmed, edge_equality.yaml cites Excel for them, and a difference from Excel is fixed or written down"

  - id: T1-SUPPLY-CHAIN
    title: "Workflow and dependency hygiene"
    why: "Checked on f77fa0a. Release attestations are done (d335791). Left: six of seven workflows have no top-level permissions: block (pages.yml has one); actions are pinned by tag or branch (actions/checkout@v7, dtolnay/rust-toolchain@stable and @master, taiki-e/install-action@cargo-llvm-cov), not by commit; studio/ has a package.json but no lockfile and CI and pages.yml run npm install; .cargo/audit.toml ignores RUSTSEC-2024-0436 (paste), but Cargo.lock has pastey, not paste, so the ignore is stale"
    how: "permissions: contents: read at the top of each workflow, widened per job where a job writes; pin each action by commit with its tag in a comment; commit studio/package-lock.json and use npm ci; drop the stale audit ignore"
    acceptance: "Every workflow starts with a permissions: block; no uses: line ends in a branch or tag name that can move; npm ci works in studio/ and CI uses it; cargo audit passes with no ignore for a crate absent from Cargo.lock"

  - id: T1-MA-EXAMPLE
    title: "An acquisition example: what Forge already does for a deal"
    why: "Asked 2026-11-16 why Forge has nothing for mergers and acquisitions, which large companies do all the time. Most of a deal model is not game theory but arithmetic Forge already has: a price and how it is paid, synergies by year, the buyer's earnings per share before and after (accretion or dilution), an earn-out, scenarios, a tornado and a simulation on the synergies. examples/ has a bagel shop, a household, a mortgage and a capital plan, and no deal"
    how: "examples/acquisition/, as examples/bagel is built: a buyer and a target as included files, a deal table by year (price, debt and shares issued, synergies, integration cost), accretion or dilution per year, NPV and IRR of the deal, three scenarios, a tornado, and a Monte Carlo on the synergies. Invented companies and round numbers, with a README that says what each file shows. No engine change; what the example makes hard goes here as tier items"
    acceptance: "The example runs from a fresh install with every analytics command it names, its headline numbers are asserted in a test against an independent calculation (as src/cli/commands/examples.rs (its bagel_example tests) does), and docs/EXAMPLES.md lists it"

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 2 — MODELING (what would change how Forge feels to use)
# ═══════════════════════════════════════════════════════════════════════════════

tier2:
  - id: T2-BAYESIAN-LINK
    title: "Let a Bayesian network's results drive the model"
    why: "Asked 2026-11-15 whether Forge's Bayesian networks are 'too basic' (a Grok review). Read from the code: exact inference on discrete nodes by variable elimination with hard evidence, checked against R's bnlearn on ten networks; no learning from data, no continuous nodes (now refused with a reason; before, 'No factors remaining'), no soft evidence, no joint most-probable explanation. Competing with pgmpy or bnlearn on inference features would be scope creep. What is missing for an FP&A user is that the network sits beside the model: its probabilities cannot come from formulas, and its results cannot feed formulas, scenarios or a simulation, as the other engines' do (the probability of default given the economy feeding expected loss is the use no spreadsheet does)"
    how: "An ADR first: a node's prior or table entries written as formulas, and a query result readable from a formula (such as =BAYES(network, node, state, evidence)), without a second model format. Decide it with a real use in front of it (T2-FIRST-USER), not before"
    acceptance: "A worked example in examples/ where a posterior feeds a result in the model, calculated and checked against a hand calculation, and the ADR says what was left out"

  - id: T2-GAME-THEORY
    title: "Games: a payoff table, and which strategies are an equilibrium"
    why: "Parked as P-GAME until a user asked; the maintainer asked on 2026-11-16, for his own kinship-protocol (github.com/mollendorff-ai/kinship-protocol), which calls Forge its game-theory calculator and wants more games. Read from its 13 models: a game is written by hand as scalars, one formula per strategy per parameter step (stag_hunt.yaml: c0_coop, c0_defect, c0_coop_wins, then c1_, c2_, c3_), a 'wins' flag is an IF the author writes, and the Axelrod tournament's average payoffs are numbers typed in (grim_base 2.622), calculated somewhere else. Forge works out a payoff and cannot say which strategy is dominated or where the equilibrium is. The second use is the one behind T1-MA-EXAMPLE: a bidding contest or a price answer, where the other side reacts"
    how: "After the stable release. An ADR first, because it adds a section to the model format: a game with players, named strategies and a payoff table whose cells are formulas over the model, so scenarios, tornado and simulate work on a game as on any model. A forge game command that reports dominated strategies, pure-strategy Nash equilibria and, for two players, mixed ones; then repeated games: a round-robin tournament of named strategies with a continuation probability, seeded where a strategy is random. The ADR says what is left out (more than two players in mixed strategies, extensive-form games, auctions). Checked against an outside tool, as the analytics are against R: Python's nashpy, or Gambit"
    acceptance: "kinship-protocol's stag hunt, chicken and Axelrod tournament are rewritten as game sections and give the results its models store today, or the difference is explained; the tournament's average payoffs are calculated by Forge and no longer typed in; every equilibrium in the tests is checked against the outside tool or a hand calculation. Two more games, chosen because the three above do not cover them: an inspection game (an AI complies or cheats, a human audits or trusts; it has no pure equilibrium, so it tests the mixed path, and a tornado on the penalty shows the known result that a harsher penalty lowers the audit rate and not the cheating), and a tournament with noise (each move is mistaken with a small seeded probability, so tit-for-tat falls apart and a forgiving strategy wins), each with its equilibrium or ranking checked the same way. Optional, same checks: a battle of the sexes (two pure equilibria and one mixed), and a sweep of the continuation probability that shows cooperation taking over near the threshold kinship-protocol derives by formula"

  - id: T2-GAME-THEORY-MORE
    title: "Games with more than two players, and strategies that spread"
    why: "Proposed 2026-11-16 beside T2-GAME-THEORY, from the maintainer's list of games for kinship-protocol. A five-player public goods game is the project's own setup (five AIs), and replicator dynamics (strategy shares changing by generation) would sit beside its predator_prey.yaml. T2-GAME-THEORY leaves both out on purpose: mixed strategies beyond two players, and any dynamics. Parked so the idea is kept, not planned"
    how: "After T2-GAME-THEORY is built and used. An ADR first, deciding whether pure equilibria for n players are enough for the public goods game, and whether replicator dynamics belong in a game section or in the existing time-series model. Extensive-form games such as the ultimatum game stay out"
    acceptance: "A five-player public goods game whose pure equilibria are checked against the outside tool or a hand calculation, and the ADR says what was left out"

  - id: T2-FIRST-USER
    title: "Watch one real person build a model with Forge"
    why: "Every bug found on 2026-11-07 came from building a model, and fresh agents have found the rest (T1-AGENT-FRICTION). A person who did not write Forge has not been watched yet. This is to find where a model goes wrong or a command confuses, not to test demand: adoption is not a goal (2026-11-16)"
    how: "When someone offers, not by recruiting: one FP&A analyst or AI pipeline builder, their own small model, Studio or the command line, the maintainer watching without helping. Write down where they stop"
    acceptance: "Notes from the session are in this file as tier items with acceptance criteria, or the decision that nothing needs to change"

