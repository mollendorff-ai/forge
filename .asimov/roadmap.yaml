# Forge Roadmap
# Version: Cargo.toml | History: CHANGELOG.md | Config: project.yaml
#
# Rewritten 2026-11-07 after a day of real use through MCP (see CHANGELOG
# 10.0.0-rc.3 and the fixes after it). Every bug found that day, including
# a wrong answer, was found by building a model, not by review or coverage.
# The organizing question for every item is therefore: does this make the
# next real model built with Forge more likely to be right and less painful?
# Reach (distribution, REST parity, transports, benchmarks) comes after that.
#
# A roadmap item is an instruction to an autonomous agent. Each one has an
# acceptance criterion the agent cannot satisfy by writing more code: a
# number checked outside Forge, a documented behaviour observed, a decision
# written down. "Polish" and "improve" are not criteria.

state:
  version: 10.0.0-rc.8, released 2026-11-08 after two wrong answers
    (POWER(0, 0) gave 1; ADDRESS gave addresses Excel does not). The two-week
    stable clock in docs/STABILITY.md runs from this release (no earlier than
    2026-11-23); a new wrong answer restarts it.
  format: model format 5.1.0 (ADR-051), with inputs as plain numbers, formula
    scalars as a formula mapping, and results written next to formulas in
    place. examples/ are 5.1.0; test-data/ and the validation repos stay
    5.0.0 on purpose.
  scope: all analysis engines are supported (ADR-050). The maintainer uses
    them and expects more scenario and simulation features.
  users: none known. One outside contributor used Forge for a few weeks in
    2026 and paused.
  what_works: calculate, validate, audit, export, import, includes with
    @namespace.name, scenarios, simulate, goal-seek, break-even,
    sensitivity, tornado, MCP with inline content, REST API with inline
    content. Verified on one 12-month model with an included costs file;
    totals matched an independent calculation and the Excel export
    recalculated with 0 mismatches.
  verified_on_a_real_model: every analytics command, on the examples/bagel
    models, with headline numbers asserted in tests/bagel_example.rs against
    independent calculations (T1-USE, 2026-11-07). The numbers were right in
    all of them; the bugs were in what surrounded them (variance flags,
    output order, a 74,000-token bootstrap reply, unreported ties).
  unverified: watch and upgrade (file tooling, not analytics).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 1 — TRUST (next release or two)
# ═══════════════════════════════════════════════════════════════════════════════

tier1:
  [] # every tier-1 item is done (2026-11-09); the next ones come from tier 2

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 2 — MODELING (what would change how Forge feels to use)
# ═══════════════════════════════════════════════════════════════════════════════

tier2:
  - id: T2-EDITORS
    title: "Editor extensions start a forge-lsp binary that no longer exists"
    why: "editors/vscode and editors/zed launch forge-lsp (ADR-005 removed the language server), so neither extension works"
    acceptance: "Either the extensions provide syntax highlighting and the schema without a server, or editors/ is removed and the README says so"

  - id: T2-EXPORT-LET
    title: "Export LET, LAMBDA, COUNTUNIQUE and TODAY as Excel formulas"
    why: "forge export writes them as values, so those cells do not follow their inputs in Excel; 36 forge-e2e-gnumeric cases skip Gnumeric for it (VARIANCE* and BREAKEVEN_* are done)"
    how: "LET and LAMBDA need their names kept local (Excel stores them as _xlpm.name), but Gnumeric 1.12 cannot read either, so a check needs another engine; COUNTUNIQUE has no expression Gnumeric reads (SUMPRODUCT(1/COUNTIF(r, r)) gives #VALUE!); Forge's TODAY is text, Excel's a date serial"
    acceptance: "Each translated function's e2e cases drop their gnumeric_skip and pass in an engine that recalculates them"

  - id: T2-TIME
    title: "Periods as a first-class axis"
    why: "Every financial model has time. Today seasonality, growth and NPV are arithmetic on `month - 1`; a user coming from Excel or a planning tool expects revenue[t-1]"
    how: "Design first (ADR with 3 worked examples: monthly budget, loan schedule, 5-year DCF). Likely shape: a table may declare `period: {start: 2026-11, count: 12, unit: month}`; row formulas may reference prev()/offset() and period attributes; export writes real dates in the first column"
    acceptance: "ADR merged with the three examples; the loan schedule example matches an amortization computed in Python to the cent; Gnumeric recalculation of its export matches"

  - id: T2-INCLUDE-COLUMNS
    title: "Read table columns from included files (@costs.prices.flour as a column)"
    why: "Includes read scalars only; shared price lists and rate curves are tables"
    acceptance: "A row formula referencing an included column calculates; a length mismatch is a clear error naming both files"

  - id: T2-DEMOS
    title: "Three demo models people actually have, built through MCP"
    why: "Top of funnel, and they double as T1-USE fixtures. Not SaaS valuation theatre: a household budget vs actual, a loan with extra payments, a small business 12-month plan with an included costs file"
    acceptance: "Each runs with `forge calculate` in under a second, has a README paragraph, and its headline numbers are asserted against an outside computation"

  - id: T2-AUDIT
    title: "forge audit reads included values and table formulas fully"
    why: "The tree now keeps dotted names whole, but @namespace values show as Unknown"
    acceptance: "audit on the bagel example shows @costs.* leaves with their values and source file"

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 3 — REACH (after tier 1 is done and at least two people use it)
# ═══════════════════════════════════════════════════════════════════════════════

tier3:
  - id: T3-DIST
    title: "Homebrew formula + cargo-binstall"
    why: "Nobody installs from source; but nobody is trying to yet"
    acceptance: "brew install and cargo binstall both produce a binary whose --version matches the release"

  - id: T3-API
    title: "REST endpoints for the analytics tools (parity with the 20 MCP tools) + OpenAPI spec"
    why: "validate, calculate and audit already take inline content; the rest only exist over MCP"
    acceptance: "Each endpoint shares its core function with the MCP tool; an OpenAPI document is generated from the handlers, not written by hand"

  - id: T3-TRANSPORT
    title: "MCP over HTTP/SSE via rmcp"
    why: "Needed for hosted or browser clients; nobody has one yet"

  - id: T3-SUMPRODUCT
    title: "SUMPRODUCT"
    why: "Common in finance; SUM(a*b) works today"
    acceptance: "Added to forge-e2e-gnumeric cases"

  - id: T3-BENCH
    title: "Per-function benchmarks"
    why: "Content for a talk, not a user need"

  - id: T3-MCP-TOKENS
    title: "Shorter MCP tool list"
    why: "16.7 KB for 20 tools; the descriptions are short already, the per-field docs repeat. Worth about 400 tokens per session; do it when there is nothing above it"

