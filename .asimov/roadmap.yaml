# Forge Roadmap
# Version: Cargo.toml | History: CHANGELOG.md | Config: project.yaml
#
# Rewritten 2026-11-07 after a day of real use through MCP (see CHANGELOG
# 10.0.0-rc.3 and the fixes after it). Every bug found that day, including
# a wrong answer, was found by building a model, not by review or coverage.
# The organizing question for every item is therefore: does this make the
# next real model built with Forge more likely to be right and less painful?
# Reach (distribution, REST parity, transports, benchmarks) comes after that.
#
# A roadmap item is an instruction to an autonomous agent. Each one has an
# acceptance criterion the agent cannot satisfy by writing more code: a
# number checked outside Forge, a documented behaviour observed, a decision
# written down. "Polish" and "improve" are not criteria.

state:
  version: >-
    10.0.0-rc.18, released 2026-11-12: Forge Studio on a phone (key
    suggestions on the keyboard, a smaller Delete), the validation suites in
    this repository (ADR-057) and numbers printed the same way by simulate,
    variance and sensitivity. rc.17 suggested the keys of the model format in
    the YAML editor and shrank Studio's download by 20%; rc.16 made Studio
    work offline, added and deleted elements on its cards, suggested names
    and functions in formulas, and added the Grid tab.
    No wrong answer since rc.13, so the two-week stable clock in
    docs/STABILITY.md still runs from rc.13 (no earlier than 2026-11-24).
    rc.15 added the Excel workbook and Save to Files in Studio and 15-digit
    numbers; rc.14 was the first release with Studio; rc.13 fixed a wrong
    answer in forge export (T1-TEXT-NUMBERS) and the function list (169, not
    175).
  format: model format 5.1.0 (ADR-051), with inputs as plain numbers, formula
    scalars as a formula mapping, and results written next to formulas in
    place; 5.2.0 (ADR-053) adds the period column and is needed only by a
    file that has one. examples/ are 5.1.0, and 5.2.0 where they have a period
    column; test-data/ and the validation repos stay 5.0.0 on purpose (one
    spec of forge-e2e-gnumeric is 5.2.0, for the period column).
  scope: all analysis engines are supported (ADR-050). The maintainer uses
    them and expects more scenario and simulation features.
  users: none known. One outside contributor used Forge for a few weeks in
    2026 and paused.
  what_works: calculate, validate, audit, export, import, includes with
    @namespace.name, scenarios, simulate, goal-seek, break-even,
    sensitivity, tornado, MCP with inline content, REST API with inline
    content. Verified on one 12-month model with an included costs file;
    totals matched an independent calculation and the Excel export
    recalculated with 0 mismatches.
  verified_on_a_real_model: every analytics command, on the examples/bagel
    models, with headline numbers asserted in tests/bagel_example.rs against
    independent calculations (T1-USE, 2026-11-07). The numbers were right in
    all of them; the bugs were in what surrounded them (variance flags,
    output order, a 74,000-token bootstrap reply, unreported ties).
  unverified: watch and upgrade (file tooling, not analytics).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 1 — TRUST (next release or two)
# ═══════════════════════════════════════════════════════════════════════════════

tier1:
  # Found while making dates real dates (ADR-054, 2026-11-10): places where
  # Forge and Excel may give different answers without a warning, and places
  # where Forge says less than it knows.
  - id: T1-YEARFRAC-FEB
    title: "YEARFRAC from the last day of February to a 31st, basis 0"
    why: "YEARFRAC(2026-02-28, 2026-12-31) is 300/360 in Forge and 301/360 in Gnumeric and LibreOffice. Forge applies the 30/360 rule for a 31st after moving the February start to the 30th; the published account of Excel's own YEARFRAC does not. The Excel check of 2026-11-06 covered an end on the 17th, not on a 31st"
    how: "Type =YEARFRAC(DATE(2026,2,28), DATE(2026,12,31), 0) in Excel: 0.8333 is Forge's, 0.8361 the engines'. If Excel gives 0.8361, change YEARFRAC, and check ACCRINT and PRICEDISC with the same dates before touching the day count they share"
    acceptance: "The Excel value is recorded in forge-e2e-gnumeric with the date it was checked, and Forge gives it"

  - id: T1-VALIDATION-IN-REPO
    title: "The two validation suites move into this repository (ADR-057)"
    why: "A change that touches the engine and a suite needs two pull requests and code that works with both versions (#161 and forge-e2e-r#13, 2026-11-12); a merge in a suite changes what Forge's CI does; forge-e2e-r has no CI of its own. The reason for the split (ADR-027: Forge was 636,000 lines) is gone. The maintainer's idea, 2026-11-12"
    how: "As ADR-057 says: git subtree add of each suite, not squashed, into validation/gnumeric and validation/r; workspace members that still run the binary through FORGE_BIN; the Validation workflow runs the suites of the commit it builds; a CI check that fails a pull request that changes an existing expected value without saying so in its title; the living documents updated. Then archive the two repositories"
    status: "Built (#164, #165). The Validation workflow on main ran from validation/ on 2026-11-12, green, with the counts below. Left: merging the README notes (forge-e2e-gnumeric#19, forge-e2e-r#14) and archiving the two repositories, which this session cannot do (GitHub refuses repository settings writes through its proxy)"
    acceptance: "The Validation workflow on main, with no clone of another repository, gives the counts of the last run from the separate repositories (1,445 passed and 1 skipped against Gnumeric; 136 function checks and 70 of 77 analytics specs against R); git log shows the suites' own commits; the two old repositories are read-only and their READMEs say where the suites went"

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 2 — MODELING (what would change how Forge feels to use)
# ═══════════════════════════════════════════════════════════════════════════════

tier2:
  # The earlier tier-2 items are done (2026-11-10): forge report, the
  # comparison example and the first-model starter.
  # Found building examples/rolling-forecast (2026-11-12), the FP&A audit:
  # actuals then forecast, fiscal quarters, year to date, a budget looked up
  # by month and price/volume/mix all work; these three did not.
  - id: T2-TABLE-AGGREGATES
    title: "A table column that aggregates another table: a table of quarters from a table of months"
    why: "A column of a table of quarters written as SUMIFS(months.revenue, months.fiscal_quarter, quarter) stops with 'aggregations should be in scalars section', so a roll-up of months into quarters or years is one scalar per period written by hand, and a mix variance can only be worked out for a whole year. In Excel this is the ordinary summary sheet. XLOOKUP(month, budget.month, budget.units) already reads another table's whole column in a row formula; an aggregate does not"
    how: "ADR-058 (proposed): an argument Excel reads as a range is a whole column in a row formula, by a table of functions and positions shared by the evaluator, the dependency order and the exporter; an own-table aggregate (revenue / SUM(revenue)) is allowed; SUM, MAX and the others keep their row-by-row meaning with several arguments; whole columns are read without copying the context (row lookups copy the whole model today, 0.79 s for 4,000 rows); NPV and IRR are left as they are. Build it once the ADR is accepted"
    acceptance: "examples/rolling-forecast has a table of quarters made with SUMIFS over months, its values equal the four quarter scalars, the exported workbook recalculates to them in Gnumeric and LibreOffice, and import gives the formula back"

  - id: T2-MISSING-VALUES
    title: "An empty cell in a number column: a month with no actual yet"
    why: "A number column refuses null ('null values not allowed in numeric arrays'), so the months of a forecast that are not closed hold 0, and an actual that really is 0 looks the same. Excel has empty cells, and ISBLANK, COUNT and AVERAGE treat them differently from 0"
    how: "An ADR first, as Excel's rules for an empty cell differ by function (SUM skips it, AVERAGE does not count it, a reference to it reads 0, ISBLANK is TRUE); decide whether Forge follows them or keeps a smaller rule, how a blank is written in YAML (null or ~), shown in JSON, exported (an empty cell) and imported"
    acceptance: "The rolling forecast's actual columns hold null for open months, is_actual can be ISNUMBER(actual), and for each function the Gnumeric suite checks on an empty cell, Forge gives Gnumeric's answer"

  - id: T2-SCALAR-DATES
    title: "A date as a scalar input, and a date result shown as a date"
    why: "last_actual: 2026-10-31 is refused ('must be a number'), so a model writes =DATE(2026, 10, 31), and the result is printed as 46326, Excel's day number, in calculate, report and the exported Scalars sheet. A table column of dates is already a date (ADR-054); a scalar is not"
    how: "Extend ADR-054 to scalars: a scalar written as a date is a date, shown as a date and exported as a date cell; a formula scalar whose result is a date (DATE, EOMONTH, EDATE) is shown as one. The schema of the model format changes, so decide in the ADR whether this needs a new version"
    acceptance: "The rolling forecast writes last_actual: 2026-10-31, forge calculate and forge report print 2026-10-31, the workbook's cell is a date cell, and import gives the date back"

  - id: T2-NUMBER-FORMAT
    title: "A format: attribute next to unit:, carried into the exported workbook"
    why: "forge export writes every number in Excel's default format, so a margin is 0.1234 and a price 786.32036, and the workbook has to be formatted by hand before it is shown to anyone. unit: says what a number is, not how to show it. The maintainer's and his brother's idea, 2026-11-12: the workbook is what an audience sees"
    how: "An ADR first: it changes the model format (a new version, as 5.2.0 was for the period column), so it touches the schema, the parser, the exporter and the importer. Decide there: whether format: holds Excel's own number-format codes (\"0.0%\", \"#,##0.00\"; nothing to translate, and import can read them back) or a smaller list of Forge's; whether it is allowed on scalars, on columns, or both; and that it changes how a number is shown and never its value (calculate, JSON and --output keep the numbers as they are). forge report and Forge Studio's cards and grid then show what Forge gives them; Studio adds no formatting rule of its own"
    acceptance: "The bagel example with a format: on a price, a percentage and a count, exported and opened in Excel or LibreOffice, shows those cells formatted, with the same values and 0 mismatches after recalculation; forge import of that workbook gives the format: back; a file without format: exports the workbook it exports today, byte for byte apart from the time"

# ═══════════════════════════════════════════════════════════════════════════════
# STUDIO — the web interface (ADR-055, ADR-056)
# ═══════════════════════════════════════════════════════════════════════════════
# A track of its own, worked in its own session alongside the engine tiers.
# It does not wait for tier 1 and does not compete with it. Done: S1, the
# engine builds without the command line or the servers, and for wasm32 in CI
# (PR #126); S2, forge-wasm runs Forge's 20 tools in WebAssembly with the
# native answers, 4.62 MB (1.51 MB gzipped) before wasm-opt (PR #129); S3,
# Forge Studio in studio/ calculating with forge-wasm, every scalar on screen
# checked against forge calculate in a headless browser.
# S4, Studio published on GitHub Pages after each release (workflow
# pages.yml; it publishes once Pages is switched on and the workflow runs).
# S5, the editor and the cards side by side above 900 px; S6, formula colours
# read from the VS Code extension's grammar, with one copy of the rules; S7,
# a formula edited on its card, kept only when Forge accepts it; S8, Excel
# export and import in the browser, the workbook forge export writes.

studio:
  [] # every studio item is done (2026-11-11); the next ones come from using Studio
  # Decided 2026-11-12, not to be added: editing in the Grid tab. The cards
  # and the YAML editor already edit values and formulas, a column has one
  # formula and a grid invites one per cell, and Studio is not an imitation of
  # Excel. The grid stays a read-only view (ADR-056 addendum, S11).

