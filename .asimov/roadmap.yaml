  - id: T1-HUGE-STATS
    title: "The summary statistics of a simulation overflow above about 1e154"
    why: "Found 2026-11-16 while fixing T1-NONFINITE: MC.Triangular(-1E+307, 0, 1E+307) draws finite values and forge simulate prints a finite mean, median, extremes and percentiles, but Std Dev: inf, because Statistics::from_samples squares each deviation (src/monte_carlo/statistics.rs). Any output, from a distribution or a formula (x^200), with values above about 1.3e154 does the same; a sum of many values near 1e306 makes the mean inf too, and the histogram's max - min can overflow. The variance of values near 1e307 (about 1e613) cannot be a number at all"
    how: "An ADR or a short decision first: refuse an output whose values cannot be summarized, or report the standard deviation by scaling (the largest deviation out, then back in) and the variance as too large to show. Keep the results of every model that calculates today the same to the last digit (compute the plain way first, as triangular_quantile does)"
    acceptance: "forge simulate on MC.Triangular(-1E+307, 0, 1E+307) prints no inf and no NaN, or exits 1 saying why; the decision is written down; the refused_everywhere tests in src/monte_carlo/distributions.rs no longer allow the one inf line"

