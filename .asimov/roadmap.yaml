# Forge Roadmap
# Version: Cargo.toml | History: CHANGELOG.md | Config: project.yaml
#
# Rewritten 2026-11-07 after a day of real use through MCP (see CHANGELOG
# 10.0.0-rc.3 and the fixes after it). Every bug found that day, including
# a wrong answer, was found by building a model, not by review or coverage.
# The organizing question for every item is therefore: does this make the
# next real model built with Forge more likely to be right and less painful?
# Reach (distribution, REST parity, transports, benchmarks) comes after that.
#
# A roadmap item is an instruction to an autonomous agent. Each one has an
# acceptance criterion the agent cannot satisfy by writing more code: a
# number checked outside Forge, a documented behaviour observed, a decision
# written down. "Polish" and "improve" are not criteria.

state:
  version: 10.0.0-rc.12, released 2026-11-10 after wrong answers in forge
    export and forge import found while making dates real dates (ADR-054), namely
    formulas over a date column that gave other answers in Excel than in
    Forge, + that joined text, TEXT with a format it did not know, and an
    import that read dates held as text as dates. The two-week stable clock in
    docs/STABILITY.md runs from this release (no earlier than 2026-11-24); a
    new wrong answer restarts it, and fixing T1-TEXT-NUMBERS will. rc.12 is
    the first release with forge report, the starter model, dates as real
    dates, and Homebrew and cargo-binstall installation. rc.11 added PREV,
    period columns and model format 5.2.0 (ADR-053).
    Unreleased since rc.12 is a wrong answer in forge export (T1-TEXT-NUMBERS,
    done 2026-11-10), formulas over text that looks like a number written
    live where Excel reads that text another way, so the next release
    candidate restarts the clock.
  format: model format 5.1.0 (ADR-051), with inputs as plain numbers, formula
    scalars as a formula mapping, and results written next to formulas in
    place; 5.2.0 (ADR-053) adds the period column and is needed only by a
    file that has one. examples/ are 5.1.0, and 5.2.0 where they have a period
    column; test-data/ and the validation repos stay 5.0.0 on purpose (one
    spec of forge-e2e-gnumeric is 5.2.0, for the period column).
  scope: all analysis engines are supported (ADR-050). The maintainer uses
    them and expects more scenario and simulation features.
  users: none known. One outside contributor used Forge for a few weeks in
    2026 and paused.
  what_works: calculate, validate, audit, export, import, includes with
    @namespace.name, scenarios, simulate, goal-seek, break-even,
    sensitivity, tornado, MCP with inline content, REST API with inline
    content. Verified on one 12-month model with an included costs file;
    totals matched an independent calculation and the Excel export
    recalculated with 0 mismatches.
  verified_on_a_real_model: every analytics command, on the examples/bagel
    models, with headline numbers asserted in tests/bagel_example.rs against
    independent calculations (T1-USE, 2026-11-07). The numbers were right in
    all of them; the bugs were in what surrounded them (variance flags,
    output order, a 74,000-token bootstrap reply, unreported ties).
  unverified: watch and upgrade (file tooling, not analytics).

# ═══════════════════════════════════════════════════════════════════════════════
# TIER 1 — TRUST (next release or two)
# ═══════════════════════════════════════════════════════════════════════════════

tier1:
  # Found while making dates real dates (ADR-054, 2026-11-10): places where
  # Forge and Excel may give different answers without a warning, and places
  # where Forge says less than it knows.
  - id: T1-YEARFRAC-FEB
    title: "YEARFRAC from the last day of February to a 31st, basis 0"
    why: "YEARFRAC(2026-02-28, 2026-12-31) is 300/360 in Forge and 301/360 in Gnumeric and LibreOffice. Forge applies the 30/360 rule for a 31st after moving the February start to the 30th; the published account of Excel's own YEARFRAC does not. The Excel check of 2026-11-06 covered an end on the 17th, not on a 31st"
    how: "Type =YEARFRAC(DATE(2026,2,28), DATE(2026,12,31), 0) in Excel: 0.8333 is Forge's, 0.8361 the engines'. If Excel gives 0.8361, change YEARFRAC, and check ACCRINT and PRICEDISC with the same dates before touching the day count they share"
    acceptance: "The Excel value is recorded in forge-e2e-gnumeric with the date it was checked, and Forge gives it"

  - id: T1-IMPORT-MIXED
    title: "forge import turns text in a column of numbers into 0"
    why: "A column whose first cell is a number is imported as numbers, and a cell that holds text (n/a, a note) becomes 0 without a warning"
    acceptance: "Such a column is imported with a warning that names the cells, and a test holds it"

  - id: T1-IMPORT-AGGREGATE
    title: "forge import writes a model that does not calculate from a column that reads its own total"
    why: "A share of a total, =A2/SUM($A$2:$A$5) down a column, is imported as share: =n / SUM(n), which forge calculate refuses (aggregations should be in scalars section). The import says Import Complete and gives no warning. Found 2026-11-10 with a workbook made for the date checks; rc.11 does the same"
    how: "Either import the total as a scalar the column reads, as the starter writes it by hand (share: =n / totals.n), or import the column as its values with a warning. The first keeps the formula"
    acceptance: "A workbook with a share-of-total column is imported to a model that calculates to the workbook's values, and a test holds it"

  - id: T1-EXPORT-UNCALCULATED
    title: "forge export says Export Complete for a model that does not calculate"
    why: "A model with one failing formula (a MATCH that finds nothing) is exported with exit code 0 and no warning: the formulas are written without results. The export needs the results to know what each formula column holds (ADR-054), so next: =EDATE(d, 1) and y4: =LEFT(next, 4) are written as =LEFT(B2, 4), which is 4608 in Excel where Forge, once the model calculates, holds 2026. rc.11 writes the same"
    how: "Say that the model does not calculate and name the error, at least; decide whether to refuse the export (forge calculate already refuses) or to write it with the warning"
    acceptance: "forge export of a model that does not calculate either fails with the calculation's error or says in its output that no result was checked, and a test holds it"


