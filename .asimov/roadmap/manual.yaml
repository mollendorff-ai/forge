backlog:
  - id: A15-MAINTAINER-STEPS
    title: "Index Forge at DeepWiki and Context7, then read what each says"
    why: "A15 added llms.txt, context7.json and .devin/wiki.json, but DeepWiki has never indexed the repository and Context7 has no entry for it (2026-11-25); only the maintainer can add it, and Context7 wants a free API key"
    how: "The maintainer: index the repository at deepwiki.com/mollendorff-ai/forge and add it at context7.com/add-library (a free key from its dashboard lifts the anonymous quota). Then an agent reads each service's answer about Forge (and GitMCP's again, its index was old) and corrects the config files where one is wrong or thin"
    acceptance: "DeepWiki and Context7 answer from the current pages (the guide, the skill, 23 MCP tools), and the answers are recorded in this item's built: line"
    model: "Sonnet 5.5, low"
  - id: T2-FIRST-USER
    title: "Watch one real person build a model with Forge"
    why: "Every bug found on 2026-11-07 came from building a model, and fresh agents have found the rest (T1-AGENT-FRICTION). A person who did not write Forge has not been watched yet. This is to find where a model goes wrong or a command confuses, not to test demand: adoption is not a goal (2026-11-16)"
    how: "When someone offers, not by recruiting: one FP&A analyst or AI pipeline builder, their own small model, Studio or the command line, the maintainer watching without helping. Write down where they stop"
    acceptance: "Notes from the session are in this file as tier items with acceptance criteria, or the decision that nothing needs to change"
  - id: M-WHAT-IF-PLAN-EXAMPLES
    title: "The guide and the examples use --plan on the what-if commands, and the examples' pairs that are the same plan become one file"
    why: "Filed 2026-11-26 by the features lane (F-WHAT-IF-PLAN, ADR-076 addendum of 2026-11-26): scenarios, compare, goal-seek, break-even, sensitivity, tornado and audit take --plan, so one file can hold a plan and its uncertainty. examples/bagel has bagel.yaml and bagel_simulate.yaml, the same plan twice; docs/FEATURES.md says calculate --plan only; the comments of bagel_simulate.yaml, microgrid_risk.yaml and realestate_risk.yaml say calculate cannot evaluate MC.* inputs, and nothing says the what-if commands can at plan"
    how: "Say --plan where the guide and FEATURES.md speak of an uncertain model's what-ifs; decide which example pairs are the same plan and merge them, keeping every figure a page or a test asserts (Studio's sets, forge-wasm's cases and the examples' tests name these files)"
    acceptance: "The guide's pages pass validation/repo; each merged example gives the figures its tests assert, at plan"
    model: "Sonnet 5.5, medium: pages that are run, and figures that are tested"
  - id: M-QUESTION-PAGES-TRIAL
    title: "A trial of five question pages on mollendorff.ai, each opening its model in Studio, measured for four weeks"
    why: "Asked by the maintainer on 2026-11-27: Forge is almost unknown (the maintainer is about its only user), and people do not know what it can do. A much larger catalog of examples was weighed and set aside: examples/ already has 16 sets and docs/posts/ 8 posts that few people see, a reader does not browse a catalog of a tool they have not heard of, agents recommend what people link to rather than what a repository holds, and every example here is checked on every release. What Forge has that a template site does not is a link that opens a working, editable model with its uncertainty in the browser, the model itself after the # (ADR-080). So: a few pages, each the answer to a question people search for, each with that link, and a measure of whether anyone came. This is an adoption trial; T2-FIRST-USER's 'adoption is not a goal' (2026-11-16) is the maintainer's to revise"
    how: "1. Choose five questions people type into a search box, each one where Forge shows what a spreadsheet cannot (a range instead of one number, a choice, a rival's answer), mostly for a person or a small business, such as rent or buy with an uncertain house price, a job offer with equity, a food truck's break-even, a rival shop's price cut, lease or buy equipment; write down why each was chosen. 2. Write each model in examples/, its figures checked against a calculation written outside Forge and asserted in the examples' tests, as the bagel shop's are. 3. Write each page in mollendorff-ai.github.io: the question, the answer in plain words with one surprising number, how sure the answer is, and an Open this model link to forge.mollendorff.ai with the model after the #; no scripts or cookies, as the site has none; English and French, as the site is. 4. The maintainer verifies mollendorff.ai in Google Search Console with a DNS record at EasyDNS (nothing added to the pages) and posts the best page where its readers are. 5. After four weeks, record what Search Console and the repository's traffic page show"
    acceptance: "Five pages are live on mollendorff.ai, each opening its model in Studio with the page's numbers (each link opened in a browser and its numbers checked against forge calculate when the page is written; a lasting Studio test, if wanted, is filed in the features backlog, which owns studio/); each model's figures are asserted in the examples' tests; Search Console has four weeks of data from the day the pages went live; this item's built: line records, for each page, its impressions, clicks and searches, the repository's referrers and stars over the same weeks, and a decision: write more pages of the kind that drew people, or stop"
    model: "Opus 5.5, high to choose the five questions (the choice is the bet); Opus 5.5, medium for the models and their checks; Sonnet 5.5, medium for the pages. Steps 4 and 5's measures are the maintainer's"

