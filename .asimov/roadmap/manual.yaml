  - id: T2-FIRST-USER
    title: "Watch one real person build a model with Forge"
    why: "Every bug found on 2026-11-07 came from building a model, and fresh agents have found the rest (T1-AGENT-FRICTION). A person who did not write Forge has not been watched yet. This is to find where a model goes wrong or a command confuses, not to test demand: adoption is not a goal (2026-11-16)"
    how: "When someone offers, not by recruiting: one FP&A analyst or AI pipeline builder, their own small model, Studio or the command line, the maintainer watching without helping. Write down where they stop"
    acceptance: "Notes from the session are in this file as tier items with acceptance criteria, or the decision that nothing needs to change"

