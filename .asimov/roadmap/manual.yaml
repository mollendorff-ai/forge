    title: "The pipeline and the skill move to rc.35"
    why: "rc.35 (2026-11-25) fails a formula with no stored result in forge validate and has forge_validate's passed, so the workarounds kept for rc.34 can go"
    acceptance: "examples/pipeline/forge.yml installs v10.0.0-rc.35 with no jq step, docs/guide/pipeline.md says so, pipeline.rs passes and the red case still fails; the two rc.34 notes in skills/forge-modelling/SKILL.md are gone and skill.rs passes"
    built: "2026-11-25: examples/pipeline/forge.yml installs v10.0.0-rc.35; its jq step is now a plain JSON step (the artifact stays), and the page, docs/WORKFLOWS.md and pipeline.rs say so (the rc.34-only test is gone, the red case fails at validate). The skill lost its three rc.34 notes (passed, the column edit, the by-hand fallback). pipeline, skill and guide tests pass"
