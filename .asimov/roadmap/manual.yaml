    model: "Sonnet 5.5, low: the behaviour is written in ADR-075 and the changelog"

  - id: M-PIPELINE-EXAMPLE-RC35
    title: "forge-pipeline-example runs the rc.35 workflow, and the guide's table says what its three pull requests now do"
    why: "Found 2026-11-25 by the features lane. github.com/mollendorff-ai/forge-pipeline-example is the repository docs/guide/pipeline.md's \"It has run\" section links to: the bagel model, the workflow, and three pull requests opened as the page's examples (#1 calculated, passes; #2 not calculated, fails at forge validate; #3 a formula with no result, fails at the JSON check). It still runs rc.34 with the jq step; examples/pipeline/forge.yml moved to rc.35 (M-RC35-FOLLOW-UP), where forge validate itself fails a formula with no stored result. So the page's 'This workflow has run, unchanged' is no longer true, and #3 would now fail one step earlier than its row says. #1 and #2 were merged although their text says not to be (the repository's main passes forge validate); #3 is open and red on purpose"
    how: "Copy examples/pipeline/forge.yml to the repository (a pull request, which needs the maintainer to open it or to give a session push access to that repository), then reopen the two failing examples against it, with #3 closed unmerged, and read each run's conclusion. Update the page's table and its dates from those runs"
    acceptance: "The page's three rows link to runs of the rc.35 workflow, each failing at the step the row names; the repository's README says the same; validation/repo's pipeline checks pass"
    model: "Sonnet 5.5, medium: three pull requests reopened and their runs read"

done:
  - id: A10-README-AND-TRIALS
    title: "The README as the front door, then a trial by a fresh reader of each kind"
    how: "Last, once it has pages to link to: one door per reader, the bagel story, 'checked on every pull request by' in place of dated run stamps. Then one fresh agent per reader follows only the docs and reports its friction, as T1-AGENT-FRICTION did for the prompts"
    acceptance: "readme_commands.rs passes; four trial reports name no step that failed, or each is a roadmap item"
    model: "Opus 5.5, high for the README; Sonnet 5.5, medium for the trials"
    built: "2026-11-25: the README opens with a door for each of ADR-078's five readers (the page docs/README.md starts each on), tells the bagel shop's first year in five checked commands (calculate, break-even, tornado, the 80% price seek, the price war) with the mortgage and the rolling forecast as other models, and its table of checks says which job runs each on a pull request, with no date (the results are VALIDATION.md's). readme_commands.rs checks its links and anchors, the five doors and that table. Four trials, each a fresh agent (Sonnet 5.5, medium) with the docs only, an empty folder and its own HOME, the release rc.35: the new user (lessons 1 to 6), the AI user (the README's prompt, ai.md, forge mcp by hand over stdio, the skill end to end), the pipeline builder (pipeline.md, the workflow's steps run by hand, green and red) and the contributor (CONTRIBUTING.md from a clone: make check 6.5 minutes, a change, the commit). No step blocked any of them. Fixed the same day: lesson 3's git commit on a machine with no git identity, lesson 1's unexplained audit warning, the skill's --formula example on a name its model lacks, MCP.md's missing initialize handshake and its Claude Code command, the pipeline pages' rc.34 wording (uncalculated, the runs of 2026-11-24), ai.md's count of its ways. CONTRIBUTING.md's four points went to the architecture lane's backlog (AR-CONTRIBUTING-TRIAL). Left as cosmetic: the pages show the lines that matter, not every line a command prints, as the guide's index says"
  - id: A15-DOC-INDEXERS
    title: "What Context7, DeepWiki and GitMCP tell an agent about Forge, corrected"
    why: "Coding agents look up an unknown library through these; no model was trained on Forge, so they may be the only source an agent reads, and they may repeat stale docs"
    acceptance: "Each service's answer about Forge read and recorded; a config file (context7.json, DeepWiki's) added where the service reads one and its answer is wrong or thin"
    built: "2026-11-25: read through each service's own endpoint. GitMCP (gitmcp.io/mollendorff-ai/forge, MCP over HTTP with a session id): its answers were stale, from an old index: the docs/ listing led with CHANGELOG_ARCHIVE.md (v0.1.3 to v7.2.11), the MCP search returned FEATURES.md's v1.7.0 section (five tools, `forge_import`), ADR-027 and code comments with /home/rex paths, where Forge has 23 tools and a guide of lessons. DeepWiki (mcp.deepwiki.com): 'Repository not found', never indexed; deepwiki.com itself is behind a Vercel bot check. Context7: search by name finds only other projects named forge (digitalbazaar/forge, tensorblock/forge), and the anonymous quota was spent (needs a free key from its dashboard), so Forge's own entry is unread. Added llms.txt (GitMCP's first source: the guide, the skill, MCP, pipeline, then the reference), context7.json (folders, exclusions, three rules) and .devin/wiki.json (a repo note). Still the maintainer's: index the repository at deepwiki.com/mollendorff-ai/forge and add it at context7.com/add-library, then read what each says"
    model: "Sonnet 5.5, low"
