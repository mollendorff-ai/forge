    title: "docs/MAINTAINING.md's release steps reviewed, with the changelog collected by scriv"
    why: "A9-ROLES left it open: the maintainer has not reviewed the release steps; E-LANES changes step 3 (the changelog is collected from changelog.d/)"
    acceptance: "Each step is the one the engine lane ran for the next release, or corrected; roles.rs passes; the maintainer's review is dated here"
    model: "Sonnet 5.5, medium: steps checked against a real release"
    checked: "2026-11-26, against rc.36 (release commit 5b9646b, run 45850019234, PR #450): the jobs, their order, the version places, scriv's collection and the CI hand-off to Release matched. Corrected: the version is also in CITATION.cff and server.json; the release job makes the SBOM and signs each archive and the SBOM with cosign; the release page has 13 files, not 6; the cosign verify-blob check was missing. roles.rs holds each. Not yet done: the maintainer's dated review, so the item stays open"
  - id: AR-MAINTAINING-SCORECARD
    title: "docs/MAINTAINING.md and the CI page name the Scorecard workflow"
    why: "Found 2026-11-25 by the engine lane (A17-SCORECARD): .github/workflows/scorecard.yml runs on Tuesdays and on every push to main and publishes the OpenSSF Scorecard score the README's badge shows; MAINTAINING.md's weekly section names only weekly.yml and validation.yml"
    acceptance: "The page says what scorecard.yml does and when, and roles.rs holds the claim like the others"
    model: "Sonnet 5.5, low"

  - id: AR-CONTRIBUTING-TRIAL
    title: "What a fresh contributor found in CONTRIBUTING.md"
    why: "Filed by the manual lane from A10's trial (2026-11-25): a fresh agent cloned main and followed CONTRIBUTING.md through make check (6.5 minutes), a small change and a commit. Nothing blocked. (1) Nothing says git commit runs a pre-commit hook of 4 to 8 minutes (only docs/SESSIONS.md, which a person is not sent to): the commit sat silent for almost 5 minutes. (2) The Rust row says 1.97 or later and that CI's stable is 1.100.0; that 1.100 is needed only for coverage has to be inferred. (3) The changelog fragment's name needs a lane (changelog.d/README.md), and the lanes are explained only in AGENTS.md: which lane an outside contributor writes is a guess. (4) No branch, fork or pull request steps, and no word on whether a pull request needs an issue first"
    acceptance: "Each of the four is answered on the page, or the decision that it should not be; roles.rs passes"
    model: "Sonnet 5.5, low: four sentences on one page"
  - id: AR-REST-EVERY-TOOL
    title: "The API server's pages say every MCP tool is served over REST (ADR-081)"
    why: "Found 2026-11-25 by the features lane (T3-API): forge serve now serves every MCP tool at POST /api/v1/<name> (goal-seek, simulate, edit, ...), each running the tool itself through ForgeMcpServer::call (src/api/tools.rs), and GET /api/v1/openapi.json, an OpenAPI 3.1 document made from the tools' schemas. 08-API-SERVER-ARCHITECTURE.md (its opening and the /version row), 01-COMPONENT-ARCHITECTURE.md and docs/EMBEDDING.md still say five operations, the other analyses being MCP tools and commands. The ADR index has ADR-081's row, added with the ADR because validation/repo requires one"
    acceptance: "08, 01 and EMBEDDING.md describe the served tools, the 400 and 422 answers and the document; architecture_docs.rs passes"
    model: "Sonnet 5.5, low: ADR-081 says what to write"
  - id: AR-RELEASE-FILES
    title: "MAINTAINING.md names the files whose version a release changes beyond Cargo.toml"
    why: "Found 2026-11-26 by the engine lane: CITATION.cff (version, date-released) and server.json (version twice) hold the crate's version, and validation/repo metadata.rs fails a release that leaves them behind; .well-known/security.txt expires 2027-11-26. The page that says what a release changes does not list them"
    how: "Add the three files to the release steps in docs/MAINTAINING.md, and the places-the-version-is-written check in roles.rs if it lists them"
    acceptance: "docs/MAINTAINING.md names them and validation/repo passes"
    model: "Haiku 5.5, low"


