backlog:
  - id: T1-NO-SKIPPING
    title: "No way round the three rules, in every crate"
    why: "Counted 2026-11-16 by validation/repo/src/no_skipping.rs: 218 lint allow or expect attributes, 16 lints allowed in Cargo.toml files, 31 places of code compiled only for or only without coverage, 2 ignored tests. Counted again 2026-11-24: every budget in no_skipping.rs is 0 except the crates clippy.toml allows in two versions (4: syn, getrandom, r-efi, hashbrown), each held by a library the maintainer decided to keep (ADR-072, ADR-075). None can be lowered today: tracing-attributes 0.1.31, zeroize_derive 1.5.0 and strum_macros 0.28 are the latest releases and are on syn 2; ahash 0.8.13 and jsonschema 0.63.1 still bring getrandom 0.3 (tried 2026-11-24, nothing removed); yaml-edit 0.3.6 is the latest and its rowan 0.16 is on hashbrown 0.14. Checked again 2026-11-26 against the newest release of each holder: tracing-attributes 0.1.31, zeroize_derive 1.5.0 and strum_macros 0.28.0 are on syn ^2 (and zerocopy-derive 0.8.63, windows-implement and windows-interface hold it too); rowan 0.17.0 (and yaml-edit 0.3.6, on rowan ^0.16) take hashbrown ^0.14.3; and getrandom 0.3 is held on wasm32 by jsonschema, jsonschema-value and referencing, which take getrandom ^0.3.4 with wasm_js (0.60.2, which the lockfile has, and 0.63.2, the latest). ahash 0.8.14 no longer brings getrandom 0.3 where 0.8.12 did, so on a host build it is gone, but clippy reads every target and the three crates keep it on wasm32 (removing Forge's getrandom_03 line breaks the wasm32 build, tried 2026-11-26), so no budget can fall"
    how: "What is left is not in Forge's code: no #[allow] or #[expect], no lint set to allow, no coverage-only code, no ignored test, no formatting skip and no tests outside their file are left (every other budget in no_skipping.rs is 0). The four crates clippy.toml allows in two versions fall when a library stops bringing the duplicate: syn when tracing-attributes, zeroize_derive and strum_macros move to syn 3; getrandom and r-efi when jsonschema (its wasm32 dependency) moves to getrandom 0.4; hashbrown when rowan moves to hashbrown 0.17. Check the newest release of each holder when a Dependabot pull request touches one, lower the budget in the same change, and remove the line in clippy.toml"
    acceptance: "Every budget in validation/repo/src/no_skipping.rs is 0 and the test passes; CLAUDE.md and project.yaml name no exception"
  - id: E-SC-PINNED
    title: "The one dependency of the build that is not pinned (Pinned-Dependencies, 9)"
    why: "Scorecard 2026-11-25 scores Pinned-Dependencies 9: every action is pinned to a commit (a validation/repo test holds that), so something else is not, such as a pip or npm install, a cargo install without --locked, or a download in a script"
    how: "Open the check in the viewer for the file and line; pin it (a hash, an exact version, --locked) or say here why it cannot be Done 2026-11-27 without the viewer, from Scorecard's own rules (its checks.md): editors/vscode and validation/mermaid had no lockfile (both gitignored), so ci.yml and diagrams.yml ran npm install and took whatever the dependencies of their dependencies were that day; both now commit a package-lock.json and run npm ci, tested with npm ci and npm test in editors/vscode. Still candidates if the next run does not give 10: pip install -r validation/games/requirements.txt in validation.yml has == pins but no hashes (pip-compile --generate-hashes and --require-hashes, a larger change), and cargo install cross --git in release.yml has no --rev, which Scorecard does not read but which is unpinned all the same. The viewer's file and line settle which"
    acceptance: "Pinned-Dependencies is 10 on the next run, or this item says what stays and why"
    model: "Sonnet 5.5, low"
  - id: E-SC-FUZZING
    title: "Fuzzing: decide whether Forge gets a fuzz target, and which (Fuzzing, 0)"
    why: "Scorecard 2026-11-25 scores Fuzzing 0. Forge parses untrusted YAML and formulas, which is what fuzzing is for, and it already has property tests (proptest). Scorecard counts OSS-Fuzz, ClusterFuzzLite and some languages' native fuzzing; whether it counts proptest or cargo-fuzz for Rust has to be checked in its docs first. A fuzz crate is a crate, so AGENTS.md's rules hold for it: 100% coverage, pedantic lints, inline tests"
    how: "Check which tools Scorecard's Fuzzing check detects for Rust. If a cargo-fuzz target on the formula parser and the YAML reader is counted, weigh it against the rules above; if only OSS-Fuzz or ClusterFuzzLite is, it is a larger step. Ask the maintainer before adding a crate Checked 2026-11-27 against Scorecard's checks.md: the Fuzzing check counts (1) the repository being in OSS-Fuzz's project list, (2) ClusterFuzzLite deployed in the repository, and (3) fuzzing or property-based testing written in the language: Go's native fuzzing, QuickCheck and its kin for Haskell, fast-check for JavaScript and TypeScript, proper and quickcheck for Erlang, FsCheck for C# and F#. Rust is not on the list, so neither cargo-fuzz nor proptest counts by itself. What would raise the score: ClusterFuzzLite (a workflow, a .clusterfuzzlite folder with a Dockerfile and a build script, and cargo-fuzz targets on the formula parser and the YAML reader, which are crates under AGENTS.md's rules: 100% coverage, pedantic lints, tests inline), or fast-check as a devDependency of studio/ with a property test of the browser app (studio/ is JavaScript, its modules parse what a user types; a dependency, not a crate). The maintainer decides which, or neither"
    acceptance: "The maintainer decides: a fuzz target is added with its own tests and Fuzzing rises, or this item says it is not worth its cost for Forge today"
    model: "Opus 5.5, medium: a decision with a cost"
  - id: S-SCORECARD-SETTINGS
    title: "Scorecard checks that are the maintainer's: Branch-Protection, CII-Best-Practices, Code-Review, Contributors (user)"
    why: "Scorecard 2026-11-25 scores Branch-Protection 0, Code-Review 0, CII-Best-Practices 0 and Contributors 6. None is a change to the code"
    how: "Branch-Protection: in Settings, Rules, protect main (require a pull request and the CI checks, block force pushes). CII-Best-Practices: register the repository at https://www.bestpractices.dev and answer the passing-level questions; the engine lane can supply the evidence for each. Code-Review: Scorecard wants a reviewer other than the author to approve each pull request; with one maintainer it stays 0, and the proposal is to leave it. Contributors: counts contributors from several organisations; with one maintainer it stays below 10, and the proposal is to leave it"
    acceptance: "Branch-Protection and CII-Best-Practices are done by the maintainer, or each is refused with a reason; Code-Review and Contributors are accepted as they are or the maintainer says otherwise"
