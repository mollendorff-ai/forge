    acceptance: "Vulnerabilities is 10 on the next run, or this item names the advisory and why it stays"
    model: "Sonnet 5.5, low"
    built: "2026-11-26. The advisory is RUSTSEC-2026-0543: chrono is unmaintained (informational, no security flaw, every version affected, no patch; the advice is jiff or time). cargo audit warns on an unmaintained crate but does not fail, which is why it passed. It stays: rmcp, the MCP SDK, requires chrono with no feature to leave it out (3.11.0: chrono ^0.4.38, not optional), so replacing chrono in Forge's own date code (38 uses in 15 files) would not take it out of the tree, nor raise the score. Vulnerabilities stays 9 until rmcp moves off chrono; check then, and weigh moving Forge's own dates to jiff or time with it"
  - id: E-MC-MESSAGE
    title: "The what-if commands say why they cannot run a file with MC.* inputs, as calculate does"
    why: "Found 2026-11-26 by a model written from scratch with v10.0.0-rc.36 (an uncertain launch, its inputs with value: and an MC.* formula). forge calculate and forge validate on it say which inputs use MC.* and to run forge simulate or forge calculate --plan (src/cli/commands/mod.rs, the check before calculating). forge scenarios, compare, break-even, goal-seek, sensitivity and audit instead say 'Unknown function: MC.Triangular' for each input, and list every formula downstream as not calculated; scenarios and compare also print 'Formula evaluation error:' twice. MC.Triangular is a function Forge knows, so the message sends the reader the wrong way. report and export run"
    acceptance: "Each of those commands, on such a file, gives calculate's message (the inputs, and what to run instead), held by a test per command; or runs it at plan if F-WHAT-IF-PLAN lands first"
    model: "Sonnet 5.5, medium: one check shared by six commands, a test each"
    built: "2026-11-26. The check calculate and validate make before calculating (src/cli/commands/mod.rs, reject_distributions) now takes the command's name, and the cores of compare, goal-seek and break-even, sensitivity, scenarios and tornado run it first (tornado has the same failure and was not on the list), so the CLI, the MCP tools and REST all say which inputs use MC.*, that the command cannot evaluate them, and to run forge simulate or forge calculate --plan. audit still prints the trail, with that message as its warning in place of Unknown function. A test per command runs it on a model with an MC.Triangular input and fails on the old message"
