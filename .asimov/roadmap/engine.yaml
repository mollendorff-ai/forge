# Roadmap of the engine lane (the engine as it is, validation, CI, releases, repository hygiene).
# Lanes: .asimov/project.yaml and AGENTS.md. Schema: asimov's roadmap.yaml
# (current, previous, backlog), plus done:, where this lane's finished items
# go, each with its dated built: line. Take work from here only; work found
# for another lane goes at the end of that lane's backlog.
# Items done before the split (2026-11-25) are in ../roadmap.yaml.

current:
  id: A17-SCORECARD
  title: "OpenSSF Scorecard on the repository, with its badge"
  why: "An outside rating of the practices T1-SUPPLY-CHAIN put in place, which a reader can check without trusting the README"
  acceptance: "A pinned scorecard workflow runs weekly and on main; the README shows the badge; each check scored below 10 is fixed or a roadmap item says why not"
  model: "Sonnet 5.5, low"
  status: in_progress
  built_so_far: "2026-11-25. .github/workflows/scorecard.yml (ossf/scorecard-action v2.6.0 and codeql-action upload-sarif v4.39.5, both pinned to a commit; weekly on Tuesdays, on every push to main, on branch_protection_rule and by hand; publishes the score), the badge in README.md, and validation/repo tests that every action in every workflow is pinned to a commit and that scorecard.yml and the badge stay"
  left: "After the first run on main: read the score at https://scorecard.dev/viewer/?uri=github.com/mollendorff-ai/forge, and for each check below 10 fix it or add an item here saying why not. Some are the maintainer's settings (branch protection, required reviews, a security policy file); say so in the item"

previous: {}

backlog:
  - id: T1-NO-SKIPPING
    title: "No way round the three rules, in every crate"
    why: "Counted 2026-11-16 by validation/repo/src/no_skipping.rs: 218 lint allow or expect attributes, 16 lints allowed in Cargo.toml files, 31 places of code compiled only for or only without coverage, 2 ignored tests. Counted again 2026-11-24: every budget in no_skipping.rs is 0 except the crates clippy.toml allows in two versions (4: syn, getrandom, r-efi, hashbrown), each held by a library the maintainer decided to keep (ADR-072, ADR-075). None can be lowered today: tracing-attributes 0.1.31, zeroize_derive 1.5.0 and strum_macros 0.28 are the latest releases and are on syn 2; ahash 0.8.13 and jsonschema 0.63.1 still bring getrandom 0.3 (tried 2026-11-24, nothing removed); yaml-edit 0.3.6 is the latest and its rowan 0.16 is on hashbrown 0.14"
    how: "One kind of lint or one crate per pull request, each lowering its budget in validation/repo/src/no_skipping.rs. A count is not a size: the #![allow] of three cast lints at the top of core/array_calculator/evaluator/mod.rs is one attribute and covers the whole evaluator, about 24,000 lines, so it is worth more than most. float_cmp in tests: an assertion helper for an exact value. Casts: checked conversions (try_from) with the error named, in numeric code with a test at the boundary, since a careless cast is a wrong answer. too_many_lines: split the function. multiple_crate_versions: update or replace the dependency that pulls the second version. The coverage-only test files: make each run under cargo llvm-cov (it measures the binary they start). The two ignored tests: run the timing test in the release-build job it was meant for, and give the round-trip corpus a fixture in the repository"
    acceptance: "Every budget in validation/repo/src/no_skipping.rs is 0 and the test passes; CLAUDE.md and project.yaml name no exception"
  - id: A16-SBOM
    title: "An SBOM (CycloneDX or SPDX) attached to each release"
    why: "The release proves who built the binary (attestations, rc.28); an SBOM says what is inside it"
    acceptance: "release.yml attaches it, made by a pinned tool; a release candidate carries it and a scanner reads it"
    model: "Sonnet 5.5, medium"
  - id: A18-METADATA
    title: "CITATION.cff, security.txt, the crate's keywords and categories, GitHub topics, and the site's robots.txt checked"
    why: "Agents and people find a tool by searching crates.io, GitHub and docs.rs; GitHub shows 'Cite this repository' from CITATION.cff; Forge wants to be read, so no AI crawler should be blocked by accident"
    acceptance: "CITATION.cff valid (cffconvert) and its version checked against Cargo.toml by a test; /.well-known/security.txt on the site; keywords and categories set; the topics set by the maintainer; robots.txt read and recorded"
    model: "Haiku 5.5, low; the topics are the maintainer's"
  - id: A13-MCP-REGISTRY
    title: "server.json for the official MCP Registry, and the other listings pointed at it"
    why: "The LobeHub listing still shows the Elastic-2.0 licence and an old README; one authoritative entry, kept true by a test, is the fix at the source"
    acceptance: "server.json validates against the registry's schema, a test checks its version against Cargo.toml and its description against the binary, and the entry is published (the maintainer's account)"
    model: "Sonnet 5.5, medium"
  - id: E-EDIT-UNCERTAIN
    title: "forge edit --uncertain: the monte_carlo outputs it writes skip the year's profit"
    why: "Found 2026-11-24 (the manual lane's handoff, item 4)"
    acceptance: "Reproduced by a failing test first; the outputs include it, or the default stays with the reason written here. Ask the maintainer before changing the default"
    model: "Opus 5.5, medium: a default that users see"
  - id: E-REPO-COVERAGE
    title: "validation/repo's own coverage measured in CI"
    why: "64% under cargo llvm-cov -p mollendorff-forge-repo (2026-11-24); the checks of the docs are code that is not itself held"
    acceptance: "CI measures it and fails below a floor that only rises, as ci.yml does for the main crate"
    model: "Opus 5.5, medium: a gate change"
  - id: T3-BENCH
    title: "Per-function benchmarks"
    why: "Content for a talk, not a user need"
  - id: T1-LISTINGS
    title: "Outside listings show today's Forge"
    why: "The LobeHub MCP listing (royalbit forge) still shows the Elastic-2.0 licence and the battle-tested wording of an old README"
    how: "The maintainer asks LobeHub to refresh or remove it; check other listings (ecosyste.ms, docs.rs for old versions) at the same time"
    acceptance: "The listing shows MIT OR Apache-2.0 and the current description, or is gone"
  - id: S-HOME
    title: "mollendorff.ai: the page is up; the www certificate and the .com/.ca forwards are left (user)"
    why: "The page exists (mollendorff-ai.github.io, no scripts or cookies). On 2026-11-15 https://www.mollendorff.ai showed 'This Connection Is Not Private' on an iPhone: DNS is right, the GitHub Pages certificate does not cover www"
    how: "Settings, Pages in mollendorff-ai.github.io: remove the custom domain, save, add mollendorff.ai again, wait for the certificate, tick Enforce HTTPS. Then open mollendorff.com and mollendorff.ca on the phone and see where they land (EasyDNS forwards if they do not reach mollendorff.ai)"
    acceptance: "https://www.mollendorff.ai opens without a warning; .com and .ca land on mollendorff.ai"

done:
  - id: E-LANES
    title: "Four lanes, each with its own roadmap, and changelog entries as fragments"
    why: "Four sessions work on Forge at once and shared one roadmap and one [Unreleased] section: the same items sat in several handoffs (#430 was built twice), and every pull request collided in CHANGELOG.md and roadmap.yaml (2026-11-25)"
    deliverables:
    - "lanes: in .asimov/project.yaml (engine, manual, features, architecture), valid under asimov 3.6.0"
    - "every open item in exactly one lane's file; ids unique across .asimov/roadmap.yaml and .asimov/roadmap/ (validation/repo lanes.rs)"
    - "a change's changelog entry is a fragment in changelog.d/, collected by scriv at a release; [Unreleased] holds only scriv's marker (validation/repo lanes.rs)"
    - "AGENTS.md says what each lane owns; docs/SESSIONS.md holds the lessons the handoffs repeated; the handoff skill writes a lane's delta only"
    model: "Opus 5.5, medium: the process every session follows"
    built: "2026-11-25, #435: lanes: in .asimov/project.yaml, a roadmap for each lane, changelog entries as fragments in changelog.d/ (scriv), docs/SESSIONS.md, and validation/repo lanes.rs holding it. asimov 3.6.0 (mollendorff-ai/asimov v3.6.0) reads the lanes"
  - id: T1-COVERAGE-GATE
    title: "100% coverage: lines, functions and regions, with nothing skipped"
    why: "ADR-004 requires 100%, but its 2026-11-08 note made it a goal; P-COV100 was parked for the same reason, now overruled by the maintainer (2026-11-16: no exceptions, no skipping). Measured on PR #257's head (2026-11-16): lines 88.04%, functions 84.46%, regions 86.31%. Since then the Coverage job fails below floors in ci.yml (88.0, 84.4 and 86.3 at first; 88.9, 85.4 and 87.3 since PR #258; 89.6, 86.1 and 88.1 since PR #259), which only rise, and make coverage fails below 100"
    how: "List each uncovered line by file (cargo llvm-cov --ignore-filename-regex 'tests/' --summary-only, then --show-missing-lines). Cover each with a test that asserts a result. A line no test can reach is a defensive branch that cannot happen: remove it, or make the type rule it out; never exclude it from the count. Raise the floors in ci.yml with each merge that raises coverage"
    acceptance: "The floors in ci.yml are 100 for lines, functions and regions, and the Coverage job passes on main; validation/repo/src/no_skipping.rs counts no coverage-only code and no ignored test"
    built: "2026-11-25. The floors in ci.yml are 100 for lines, functions and regions (since 2026-11-23, rc.35), make coverage fails below 100, and no_skipping.rs counts no coverage-only code and no ignored test. CI's Coverage job passes on main"
  - id: E-CI-DOCS-PATHS
    title: "A pull request that changes only pages runs the page checks"
    why: "CI's path filter has no docs/**, README.md or *.md, so A8's and A9's pull requests ran only the Mermaid check (found in A14's trial, 2026-11-25)"
    acceptance: "docs/**, *.md and skills/** are in the filter of the job that runs validation/repo; a page-only pull request shows it ran"
    model: "Sonnet 5.5, low: a filter, held by workflows.rs"
    built: "2026-11-25. docs/**, **/*.md and skills/** are in the push and pull_request filters of ci.yml, which starts the Repository checks job; validation/repo workflows_doc.rs holds them"
  - id: E-DOC-COUNTS
    title: "The test count in README.md and VALIDATION.md checked when a release is made, not on every merge"
    why: "doc_counts fails main whenever another lane's merge crosses a step of 50 ('over 3,350 tests'); main was red after #428 for that. The figure belongs to the release"
    decided: "The maintainer, 2026-11-25: drop the figure"
    acceptance: "doc_counts' test-count check runs in the release's checks only (or the figure is dropped, the maintainer's choice); no other lane's merge can turn main red with it"
    model: "Sonnet 5.5, low: one check moves"
    built: "2026-11-25. README.md and VALIDATION.md give no count of unit tests (a count says nothing about quality and went stale with every merge); doc_counts.rs no longer counts them and fails if one comes back. The numbers shown are the ones a stranger can check: 100% coverage (the badge), the Gnumeric case count, R, Gambit, Excel"
