  - id: F-WHAT-IF-PLAN
    title: "The what-if commands take --plan, so one file holds a plan and its uncertainty"
    why: "Found 2026-11-26 by a model written from scratch with v10.0.0-rc.36. forge calculate --plan evaluates each MC.* input at its value:, but scenarios, compare, tornado, break-even, goal-seek, sensitivity and audit have no --plan, so a model whose inputs are uncertain needs a second copy with plain numbers for its what-ifs: examples/bagel has bagel.yaml and bagel_simulate.yaml, the same plan twice, which drift unless someone keeps them equal"
    how: "Ask the maintainer first: --plan on each (the CLI, the MCP tools, REST, forge-wasm, as calculate's was in S-UNCERTAIN, ADR-076), or the plan as the default when a file has MC.* inputs, with the ADR addendum that decides it. Then a manual item to merge the examples' pairs where they are the same plan"
    acceptance: "forge scenarios and forge break-even --vary assumptions.price_per_dozen on examples/bagel/bagel_simulate.yaml, at plan, give bagel.yaml's year.profit (786.32) and break-even price (15.97); each command's --help says so"
    model: "Opus 5.5, high: a surface change across four doors, and a default to decide"
    built: "2026-11-26. The maintainer chose a flag (ADR-076, addendum of 2026-11-26): scenarios, compare, goal-seek, break-even, sensitivity, tornado and audit take --plan, and plan: true in their MCP tools, over REST (the served tools and the audit's own endpoint) and in forge-wasm. One rule sets the plan in every command (at_plan_or_refused, src/cli/commands/plan.rs); a scenario still sets an uncertain input to its own number, and an uncertain input is an input at plan (varied, a tornado's bar, no output of scenarios). Without --plan the refusal says to run the same command with --plan. Checked by hand on a launch whose price is uncertain (LAUNCH, through the command line, MCP and REST), and on bagel_simulate.yaml: break-even 15.97 as bagel.yaml, sensitivity at 16 gives 786.32, compare rent_hike as calculate --plan --scenario rent_hike; forge-wasm cases at plan. The acceptance's forge scenarios on bagel_simulate.yaml cannot hold: its one scenario, rent_hike, has no probability, so there is nothing to weigh with or without --plan; compare stands for it. To fit the plan fields under the tools/list ceiling (28,000 bytes, T3-MCP-TOKENS), the three field docs every tool repeats are shorter"
