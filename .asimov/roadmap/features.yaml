    model: "Sonnet 5.5, medium: the game card is the pattern"
    built: "2026-11-26. forge_bayesian is asked for the scenario chosen on the Model view (studio/bayesscenario.js; runAnalyses passes it), and the card says which scenario it is drawn in. examples/expected_loss.yaml is a Studio set of its own (A lender's loan), the only network with scenarios in a set. tests/analyses.mjs applies each scenario of each network (recession and boom): every number is the tool's in that scenario, with and without evidence, the recession given a default shows 865/1254 as the file's own working has it, and the plan comes back on the plan chip. The network's named queries are drawn by the card as chances, so tests/screen.mjs does not look for them as scalars"
  - id: F-EDIT-TEXT-COLUMN
    title: "forge edit changes a table's column of text"
    why: "forge edit changed a column of numbers or dates (2026-11-24) and refused text. Proposed by the manual lane; the maintainer chose it on 2026-11-25"
    acceptance: "set_value with a list of texts changes the column; the file's quoting and comments are kept, checked on files that quote each way"
    built: "2026-11-25. set_value with a list of texts sets a column of text (src/edit/column.rs, text::set_text_column): a row with the same text keeps its bytes, a changed row keeps its quotes ('single' with ' doubled, \"double\" escaped as JSON escapes), and a plain row stays plain when YAML reads it back as that text, else double quotes; comments and the list's style stay. Texts are compared as texts (1.0 is not 1), a number for a row of text is refused, and the read-back refuses a column whose type changes (texts that are all dates). --set takes the quotes off each item of a list. Tested on flow and block lists in each quoting, Unicode names, the words YAML reads as true, false or null, and every column of text of the examples changed and back (the fund's ledger refuses, its lookups failing). ADR-075 says it; the docs are the manual lane's M-EDIT-TEXT-COLUMN-DOCS"
