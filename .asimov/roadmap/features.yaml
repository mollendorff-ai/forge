# Roadmap of the features lane (new behaviour in the engine and its surfaces: command line, Studio, MCP, REST).
# Lanes: .asimov/project.yaml and AGENTS.md. Schema: asimov's roadmap.yaml
# (current, previous, backlog), plus done:, where this lane's finished items
# go, each with its dated built: line. Take work from here only; work found
# for another lane goes at the end of that lane's backlog.
# Items done before the split (2026-11-25) are in ../roadmap.yaml.

current: {}

previous: {}

backlog:
  - id: T3-TRANSPORT
    title: "MCP over HTTP/SSE via rmcp"
    why: "Needed for hosted or browser clients; nobody has one yet"
  - id: F-EXAMPLES-ONE-FILE
    title: "examples/microgrid and examples/realestate are one file each, the plan and its uncertainty, run with --plan"
    why: "Found 2026-11-27 by the manual lane (M-WHAT-IF-PLAN-EXAMPLES). microgrid_risk.yaml and realestate_risk.yaml are microgrid.yaml and realestate.yaml with MC.* formulas on five inputs and a monte_carlo: section, and the scenarios and tornado of the plan files; they drift unless someone keeps them equal. The manual lane did not merge them: it is Rust tests and Studio, not the guide"
    how: "Fold the risk file into the plan file (value: beside each formula is the plan's figure, so the plan does not change). Then every test that calculates the plan file gets plan: true (goal_seek.rs, sensitivity.rs, scenarios.rs, tornado.rs, decision_tree.rs, excel_io/mod.rs, plan.rs, simulate/mod.rs), forge-wasm's cases and expected.rs, and Studio's two sets for each example (plan, how sure) and studio/tests become one set, with ADR-077's table. The examples' READMEs say --plan on the what-if commands. Bagel is not part of this: it stays two files (see M-WHAT-IF-PLAN-EXAMPLES, done)"
    acceptance: "Each merged example gives the figures its tests assert (microgrid's project NPV of 13,161,304.86 at plan, realestate's 155,715.31, and each simulation's percentiles); the guide's pages pass validation/repo"
  - id: F-INSIGHTS
    title: "forge insights: Forge says what is surprising in a model, with the command that shows each finding"
    why: "Proposed 2026-11-27, from a model written from scratch with v10.0.0-rc.36 (a floating sauna, members at 79 a month for three visits). Its best finding was one nobody asked for: profit is 39,151 with no new members, about 14,500 at 10 a month and 17,207 at the plan's 12, so the plan sat near its worst point. It showed only because the author was curious enough to run two sensitivity tables. A model answers the questions its reader thinks to ask; an agent asked to calculate reports the plan and stops. Each check an analyst would make already exists as a command (sensitivity, break-even, simulate, scenarios, game); nothing runs them together and says which results deserve a look"
    how: "An ADR first: which checks, how a finding is ranked, how far each input is swept (a tornado's low and high where the model has them), and what is never reported (a linear model's plain slopes). Checks to start from: an output not monotonic in an input, with the plan near its worst; the plan within 10% of a break-even; a scenario that changes which choice is best; the mean under uncertainty far from the plan; a driver whose rank correlation comes through a correlations: entry (F-DRIVERS-CORRELATED); a game with more than one equilibrium, or one both players would leave together. Then the command, its JSON, the forge_insights MCP tool and REST, and a card in Studio's Analyze view"
    acceptance: "forge insights on examples/bagel names, each with the command that shows it: the price within 10% of break-even (15.97 against 16), the simulated mean far below the plan (-15,925.94 against 786.32), and the price war's equilibrium that both shops would leave together (19,189 each against 21,489). On a fixture written for it, the sauna's members give the non-monotonic finding with the plan near the minimum. Running each named command shows the finding. A linear model with no break-even near its plan gives no finding. The ADR is accepted before the code"
    model: "Opus 5.5, high: what counts as interesting is the design; a finding that is noise teaches people to ignore the command"
  - id: F-RECEIPTS
    title: "Every number has a receipt: a write-up names model results, Forge fills them in, and forge validate fails when they disagree"
    why: "Proposed 2026-11-27. The weak link in an AI's financial answer is the prose after the engine: the same session wrote two wrong numbers into its own README about a model Forge had calculated exactly (28,704 written as 23,920, and a recovery that the table did not show). This repository already refuses a number in its guide that no command prints (validation/repo); a user's memo, an agent's answer or a pull request's description has no such check. An agent whose numbers are filled in by Forge cannot invent one, and a reader can reproduce each from a link"
    how: "An ADR first: how a write-up names a result (a result, a scenario's result, a game's result such as trail.equilibrium_3.vapeur.join) and its format; how Forge fills a Markdown file in; how forge validate checks one against its model; and how a filled-in answer carries a Studio link with the model after the # (ADR-080), so anyone can open the figures in a browser. It builds on expect: (T2-SCENARIO-CHECKS) and forge report. Then an MCP tool that returns an answer with its receipts, so an agent can write prose without typing a number"
    acceptance: "A Markdown file that names results of examples/bagel is filled in by Forge with the numbers forge calculate, scenarios and game print; changing an input in the model makes forge validate fail on the file and name each stale number; the filled-in file's Studio link opens the model and shows the same numbers (a studio test); the MCP tool returns the filled-in text and the link. The ADR is accepted before the code"
    model: "Opus 5.5, medium: most of the parts exist (expect:, report, the Studio link); the syntax is the decision"
  - id: F-VALUE-OF-INFORMATION
    title: "What is it worth to find out? The best choice under uncertainty, and the value of knowing each uncertain input first"
    why: "Proposed 2026-11-27. Every uncertain model ends with 'it depends', and none says which uncertainty is worth paying to settle before deciding. In the sauna model of that day, choosing whether to close in summer turned on the winter (winter_lift drove profit at +0.85) and hardly on member growth (+0.06): a winter survey would be worth paying for, a membership study would not. Forge holds the plan, its uncertainty and the choices in one file, which is what the expected value of perfect information (and of partial information, input by input) needs; few planning tools compute it, and it turns a model into a list of what to find out next"
    how: "An ADR first: how a model declares its choices (inputs with a few options, such as open_in_summer 0 or 1, or a price) and its objective (an output's mean to start; risk attitude later, as its own item); the best choice over simulate's fixed draws; the value of perfect information overall; and for each uncertain input the value of knowing it alone (EVPPI), by a method the ADR chooses and justifies (nested runs, or regression on the draws). Then forge simulate's report, its JSON and MCP tool, and Studio"
    acceptance: "On a model small enough to solve by hand, the best choice, the expected value of perfect information and each input's value match the hand calculation; on a larger one they agree with an outside implementation (such as R's voi package) within its sampling error, on the same draws where possible; an input that cannot change the best choice is worth 0. The ADR is accepted before the code"
    model: "Opus 5.5, high: EVPPI is easy to get subtly wrong, and a wrong value of information would send someone to pay for the wrong study"
  - id: F-STUDIO-DRIVERS-CORRELATED
    title: "Forge Studio's drivers list names an input's correlation, as forge simulate does"
    why: "Found 2026-11-27 (F-DRIVERS-CORRELATED): forge simulate's JSON now carries correlated_with on a driver that is in a correlations: entry, because its rank correlation can come through the input it is correlated with, and Studio's 'what drives it' list (studio/app.js) still shows the bare number"
    acceptance: "On a model whose inputs are correlated, each driver in Studio's list that is in a correlation says so, with the other input and the coefficient, read from the simulation's own answer; a model with no correlations is drawn as before; a studio test shows it. studio/app.js is at the 1,500-line limit: the list is drawn from a module of its own"
    model: "Sonnet 5.5, medium: the drivers list is drawn from simulate's answer"

done:
  - id: F-GOAL-SEEK-NO-CROSSING
    title: "A goal seek that finds no crossing says where it looked and what it found there"
    why: "Found 2026-11-27 by the same model: forge goal-seek --target year.payback_years --value 5 --vary assumptions.price_per_seat, where payback = barge_build / profit. It answered 'No solution found in search range. The target value 5 may not be achievable', with no range and no values. expand_search_range_quiet (src/cli/commands/analysis/goal_seek.rs) widened the range up to 1,000 times and the output never crossed 5: negative at the low end (a loss), under 5 at the high end, and through infinity at the break-even price in between. Seeking year.profit = 37,000 (the profit a five-year payback needs) found 47.02 at once; the message could have pointed there"
    acceptance: "When no crossing is found, the error names the widest range tried and the output at each end; when the output changes sign between two ends without crossing the target (a pole, such as a division by a result that passes zero), it says so. break-even gives the same message. A test with a reciprocal output checks it"
    model: "Sonnet 5.5, medium: one function and its error text"
    built: "2026-11-27. A goal seek or break-even that finds no crossing says: No solution found. Varying 'x' from 0.00001 to 100000, the widest range tried, 'y' is 1.0000000001 at 0.00001 and 10000000001 at 100000, and does not cross the target value 0. When the output has opposite signs at the two ends it adds that it changes sign without crossing the target, as a division by a result that passes zero does, and to seek a target on that result instead. expand_search_range_quiet keeps the widest pair of ends and their outputs (src/cli/commands/analysis/goal_seek.rs); break-even is the same goal seek for 0, so it says the same. Tests: a target out of reach (the range and both outputs), a reciprocal =10 / (x - 5) seeking 5 (the pole), break-even through the command line. The sauna seek of the item (payback = build / profit) is that reciprocal: its profit crosses zero between the ends, and the message now says so; it did not run here, the sauna model not being in the repository"
  - id: F-DRIVERS-CORRELATED
    title: "forge simulate names a driver's correlation next to its rank correlation"
    why: "Found 2026-11-27 by a model written from scratch with v10.0.0-rc.36 (a floating sauna: winter_lift and @costs.wood.price_per_cord correlated at 0.5 under monte_carlo.correlations). The wood price came out as a positive driver of year.profit (+0.359), though a dearer cord only ever lowers profit: it rides on the cold winters it is correlated with. The number is right, as a rank correlation; nothing on the line says it is borrowed, and the reader takes it for an effect"
    acceptance: "In forge simulate's drivers, and in its JSON and the forge_simulate MCP tool, an input named in a correlations: entry carries the other input and the coefficient (for example: +0.359  @costs.wood.price_per_cord  (correlated 0.5 with assumptions.winter_lift)); a model with no correlations prints as today; a test on a correlated pair checks the note"
    model: "Sonnet 5.5, medium: the correlations are already parsed in src/monte_carlo/correlation.rs; this is printing"
    built: "2026-11-27. A driver that is in a monte_carlo.correlations entry names the other input and the coefficient: forge simulate prints `+0.314  financials.revenue  (correlated -0.6 with financials.margin)`; its JSON (and so forge_simulate over MCP and REST, and forge-wasm) has correlated_with: [{input, coefficient}] on that driver and nothing on any other, and the YAML a trailing `# correlated ...` comment. Names are the inputs' full names, resolved as the correlation itself resolves them (a short name matches the one input it ends); an input in two correlations names both, in the order configured. Where the notes come from: sample_inputs returns the resolved pairs it correlated with (engine.rs), so the report and the draws read one list. Tests: the engine's drivers, YAML and JSON on a correlated pair, an input in two, and none; the printed line on a model with and without correlations; the bagel's drivers through MCP carry no note. forge simulate --help says so. Not done, filed: Studio's drivers list (F-STUDIO-DRIVERS-CORRELATED) and docs/EXAMPLES.md's printed output (M-EXAMPLES-DRIVERS-CORRELATED)"
  - id: T2-GAME-THEORY
    title: "Games: a payoff table, and which strategies are an equilibrium"
    why: "Parked as P-GAME until a user asked; the maintainer asked on 2026-11-16, for his own kinship-protocol (github.com/mollendorff-ai/kinship-protocol), which calls Forge its game-theory calculator and wants more games. Read from its 13 models: a game is written by hand as scalars, one formula per strategy per parameter step (stag_hunt.yaml: c0_coop, c0_defect, c0_coop_wins, then c1_, c2_, c3_), a 'wins' flag is an IF the author writes, and the Axelrod tournament's average payoffs are numbers typed in (grim_base 2.622), calculated somewhere else. Forge works out a payoff and cannot say which strategy is dominated or where the equilibrium is. The second use is the one behind T1-MA-EXAMPLE: a bidding contest or a price answer, where the other side reacts"
    how: "ADR-068 (accepted 2026-11-19): a games: section in model format 5.5.0, exact expected values for tournaments, results readable by formulas. The maintainer asked for it before the stable release (2026-11-19). Built: the section and its parser, schema 5.5.0, a game as a cell of the calculation, dominated strategies, pure equilibria for any number of players, mixed ones for two (checked against nashpy 0.0.43 and by hand), tornado, simulate, sensitivity and goal-seek on a game result, and a warning from forge export that names the games (Excel cannot find an equilibrium; the payoff formulas are not written and the results are numbers as of the export). Then (PR #299): the forge game command; tournaments (exact match values as joint Markov chains, noise, continuation, collectively stable strategies; every pair of the nine strategies within 2.4 standard errors of the axelrod library's seeded average); the forge_game MCP tool (21 tools) and game in forge-wasm; seven examples in examples/games with their numbers asserted (stag hunt, chicken and Axelrod from kinship-protocol, inspection with its tornado, a noisy tournament, battle of the sexes, the continuation sweep). kinship-protocol's three models are rewritten in its own repository (its v0.5.0, 2026-11-20), with the four further games; one went against this item's acceptance text: in its noisy tournament generous TitForTat came 5th at 5% noise and TitForTwoTats won at 1%, so 'a forgiving strategy wins' holds only while mistakes are rare (its docs/MORE_GAMES.md). The e2e suite is T2-GAME-THEORY-E2E. The ADR says what is left out (more than two players in mixed strategies, extensive-form games, auctions)."
    acceptance: "kinship-protocol's stag hunt, chicken and Axelrod tournament are rewritten as game sections and give the results its models store today, or the difference is explained; the tournament's average payoffs are calculated by Forge and no longer typed in; every equilibrium in the tests is checked against the outside tool or a hand calculation. Two more games, chosen because the three above do not cover them: an inspection game (an AI complies or cheats, a human audits or trusts; it has no pure equilibrium, so it tests the mixed path, and a tornado on the penalty shows the known result that a harsher penalty lowers the audit rate and not the cheating), and a tournament with noise (each move is mistaken with a small seeded probability, so tit-for-tat falls apart and a forgiving strategy wins), each with its equilibrium or ranking checked the same way. Optional, same checks: a battle of the sexes (two pure equilibria and one mixed), and a sweep of the continuation probability that shows cooperation taking over near the threshold kinship-protocol derives by formula"
    built: "2026-11-27, closed on a check, no code. Everything in the acceptance is on main: the games: section (ADR-068, format 5.5.0), forge game, the forge_game MCP tool, game in forge-wasm and Studio, ten examples in examples/games with their numbers asserted (stag hunt, chicken, Axelrod, inspection, noisy tournament, battle of the sexes, continuation sweep; ADR-073 adds public goods, volunteers dilemma, hawk-dove), and validation/games against Gambit, axelrod and R (T2-GAME-THEORY-E2E). kinship-protocol (main at 2026-11-25) has its stag hunt, chicken and Axelrod tournament as games: sections, and all 13 of its game models validate; its Axelrod model has Forge play the matches (grim 2.596, tft 2.448) where it typed grim 2.622, a figure above the 5-a-round maximum. One part of the acceptance does not hold, as the item already says: a forgiving strategy wins the noisy tournament only while mistakes are rare. Left out on purpose, as ADR-068 lists: extensive-form games, auctions and continuous strategies, dominance by a mixed strategy, strategies a user writes in a tournament"
