identity:
  name: "forge"
  type: rust

description: >
  YAML financial modeling engine with Excel-style formulas, its own
  evaluator (203 functions), Monte Carlo and scenario analysis, Excel
  export/import, an MCP server and a REST API. Deterministic. Formulas
  checked against Gnumeric and analytics against R, games against Gambit
  and the axelrod library, by the suites in validation/ (ADR-057).

stack:
  - rust (stable; CI lints with the newest stable, so pin nothing)
  - clap (CLI)
  - yaml_serde + serde (model files; their schemas in schema/, checked by jsonschema, ADR-071)
  - petgraph (dependency graph of formula cells)
  - axum + tokio + tower-http (REST API)
  - rmcp (MCP server, stdio)
  - rust_xlsxwriter / calamine (Excel write / read)
  - rand + rand_distr, statrs (Monte Carlo sampling, statistics)
  - indexmap (model order is preserved everywhere)
  - notify (forge watch)

conventions:
  - "Result<T, E> for errors in library code; a panic is a bug. Sorting and comparing f64 uses total_cmp, never partial_cmp().unwrap() (validation/repo/src/conventions.rs)"
  - "No silent wrong answers: an input that cannot be used (unknown name, NaN, failing include) is an error that names it and suggests the closest name"
  - "Tests are inline, all of them (the maintainer, 2026-11-16: inline or not, never both): a #[cfg(test)] mod tests in the file it tests, no tests/ folder in any crate and no test module in a file of its own. A test of the command line or the MCP server calls the code in-process (cli::forge, mcp::Session). End-to-end checks of the built binary are the suites in validation/gnumeric and validation/r, run by .github/workflows/validation.yml; validation/repo, which checks the docs, workflows and sources against the binary, run by the Repository checks job; and the MCP Protocol Test job, with the closed pipe. A changed expected value is named in the pull request title (ADR-057). validation/repo/src/no_skipping.rs keeps the count of tests/ files at 0 (roadmap T1-TESTS-INLINE, done 2026-11-17)"
  - "Every bug fix starts with a failing test: a wrong answer, an error, a crash, a wrong message or a refusal that should not happen. The test reproduces the bug, fails on the commit before the fix and passes after it (the PR template asks for it)"
  - "Every new or changed command gets an examples/ model whose numbers are checked by a calculation made outside Forge, asserted in a test (src/cli/commands/examples.rs (its bagel_example tests) shows how; the PR template asks for it)"
  - "Zero warnings; clippy pedantic + nursery + cargo ([lints] in Cargo.toml) at -D warnings, on every target (--all-targets) and on the oldest supported Rust as well as stable, in every crate, in the pre-commit hook (make lint) and in CI. No skipping, no exceptions (the maintainer, 2026-11-16; CLAUDE.md): no #[allow(...)] or #[expect(...)], alone or in a cfg_attr, and no lint set to allow in a Cargo.toml, multiple_crate_versions included. Fix the code, or the dependency"
  - "Formatting: cargo fmt --all -- --check passes (rustfmt.toml), in the pre-commit hook and in CI, with no #[rustfmt::skip] and no ignore in rustfmt.toml"
  - "100% test coverage, not negotiable (the maintainer, 2026-11-16; ADR-004, CLAUDE.md). A test asserts a result; one that only runs the code does not count. No skipping: no cfg(coverage) or cfg(not(coverage)) code, no coverage(off), no ignored test. CI fails below the floor in ci.yml, which only rises, to 100 (roadmap T1-COVERAGE-GATE); make coverage fails below 100"
  - "validation/repo/src/no_skipping.rs counts every way round these three rules; the counts only fall, to zero (roadmap T1-NO-SKIPPING). Never raise its budget or lower the coverage floor"
  - "CHANGELOG.md has an [Unreleased] section; every PR adds its entry there in plain words that say what a user saw and what changed (the PR template asks for it)"
  - "Docs describe what the code does today; a superseded design doc gets a dated note at the top, not a rewrite (the PR template asks; last checked across docs/architecture on 2026-11-08)"
  - "No Rust file over 1,500 lines, its inline tests included, in any crate (validation/repo/src/conventions.rs): a longer file is split into modules by what it does, never emptied of its tests"
  - "MIT OR Apache-2.0 license (Cargo.toml, LICENSE-MIT, LICENSE-APACHE)"
