# Dates as real dates in the workbook (Forge ADR-054).
#
# forge export writes a column of dates as date cells (the day number, shown
# as a date). A formula reads a date as Forge reads it there: the cell where a
# number is read, the date's text where text is read, DATE(y, m, d) for a date
# written in the formula. Gnumeric and LibreOffice recalculate the cells.
#
# Expected values, from the same calculation in Python (datetime, not Forge):
#   day numbers: 2026-01-31 = 46053, 2026-02-28 = 46081, 2026-12-01 = 46357,
#                2026-06-01 = 46174, 2026-01-01 = 46023, 2000-01-01 = 36526
#   due.d          2026-01-31  2026-02-28  2026-12-01  2026-02-28
#   due.amount     10          20          30          40
#   next_month     2026-02-28  2026-03-28  2027-01-01  2026-03-28
#   late           0           0           1           0
#   tomorrow       46054       46082       46358       46082
#   later_of       46174       46174       46357       46174
#   or_default     2000-01-01  2026-02-28  2026-12-01  2026-02-28
#   before         2026-01-01  2026-01-31  2026-02-28  2026-12-01
#   plan.month     2026-11-01  2026-12-01  2027-01-01  2027-02-01
#   month_end      2026-11-30  2026-12-31  2027-01-31  2027-02-28 (46446)
#   loans.maturity n/a         2026-01-31  2026-12-01  none    (text in the workbook)
#
# loans.maturity is text that is a date in some rows. Forge reads such a date
# as its day number where a number is read, and Excel reads text there: text
# is greater than any number, MAX skips it, and it equals no number. forge
# export writes those formulas as Forge's values (the columns year, late and
# is_jan31_number); with the formulas live, Gnumeric and LibreOffice give 4
# for the sum of late and 0 for the equality with DATE(). A scalar written as
# its value (MAX(loans.maturity), 0 in both engines) is not a case here: the
# engines would have nothing to calculate. Forge's own tests hold those.
#
# Also here, because they came with the same decision: + adds as in Excel
# ("5" + 1 is 6), & joins text, and TEXT reads Excel's format codes.

_forge_version: "5.2.0"

due:
  d: ["2026-01-31", "2026-02-28", "2026-12-01", "2026-02-28"]
  amount: [10, 20, 30, 40]
  label: ["a", "b", "c", "d"]
  next_month: "=EDATE(d, 1)"
  late: "=IF(d > DATE(2026, 6, 1), 1, 0)"
  late_written: "=IF(d > \"2026-06-01\", 1, 0)"
  is_jan31: "=IF(d = DATE(2026, 1, 31), 1, 0)"
  is_jan31_written: "=IF(d = \"2026-01-31\", 1, 0)"
  year_text: "=LEFT(d, 4)"
  tag: "=label & \"-\" & d"
  tomorrow: "=d + 1"
  later_of: "=MAX(d, DATE(2026, 6, 1))"
  or_default: "=IF(amount > 15, d, \"2000-01-01\")"
  before: "=PREV(d, \"2026-01-01\")"
  shown: "=TEXT(d, \"mmm d, yyyy\")"
  is_text: "=IF(ISTEXT(d), 1, 0)"

plan:
  month: {start: 2026-11, count: 4, unit: month}
  month_end: "=EOMONTH(month, 0)"
  days: "=DAY(EOMONTH(month, 0))"

loans:
  maturity: ["n/a", "2026-01-31", "2026-12-01", "none"]
  amount: [10, 20, 30, 40]
  open: "=IF(maturity = \"n/a\", 1, 0)"
  is_jan31: "=IF(maturity = \"2026-01-31\", 1, 0)"
  is_jan31_number: "=IF(maturity = DATE(2026, 1, 31), 1, 0)"
  year: "=IFERROR(YEAR(maturity), 0)"
  late: "=IFERROR(IF(maturity > DATE(2026, 6, 1), 1, 0), 0)"

