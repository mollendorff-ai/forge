# Wrong answers found on 2026-11-14 by generated cases (ADR-062:
# validation/sweep/generate.py, seeds 1 to 10) against Gnumeric 1.12 and
# LibreOffice 26.2, each fixed in Forge. The expected values are what both
# engines give, or LibreOffice where Gnumeric cannot judge (each says why). A case that should be an error is
# wrapped in IFERROR(..., -1). On rc.23, 30 of the 35 fail; the other five
# are controls or guard a rewrite (DATEDIF on the same day, IFNA keeping
# another error, MINUTE at midnight, NPER far from a ratio of 1, COUNTIF of
# dates).
#
# gp.x: 1, 2, empty, 4, 5, 7     gp.y: 2, empty, 6, 8, 11, 13
#   the pairs with both cells: (1, 2), (4, 8), (5, 11), (7, 13)
# gt.t: "", " a  b ", "Banana", "date", "x", "Hello World"  (an empty text
#   first) above "c", ignoring case: date, x, Hello World; at most "b": only
#   " a  b " ("banana" comes after "b")
# gr.v: 629.65, 1.005, 1E-12, -0, 0, -0.93: three values above 0

_forge_version: "5.4.0"

gp:
  x: [1, 2, null, 4, 5, 7]
  y: [2, null, 6, 8, 11, 13]
  # A formula column, so the runner reads this section as a table
  k: "=x * 1"

gt:
  t: ["", " a  b ", "Banana", "date", "x", "Hello World"]
  d: [2024-01-15, 2024-02-29, 2023-12-31, 2025-06-30, 2026-01-01, 2020-02-29]
  n: "=LEN(t)"

gr:
  v: [629.65, 1.005, 1e-12, -0.0, 0.0, -0.93]
  k: "=v * 1"

assumptions:
  # A pair with an empty cell is left out of SLOPE, CORREL and the like (it was an error)
  test_slope_skips_pairs:
    value: null
    formula: "=SLOPE(gp.y, gp.x)"
    expected: 1.8933333333333333
  test_intercept_skips_pairs:
    value: null
    formula: "=INTERCEPT(gp.y, gp.x)"
    expected: 0.45333333333333314
  test_rsq_skips_pairs:
    value: null
    formula: "=RSQ(gp.y, gp.x)"
    expected: 0.9741062801932368
  test_correl_skips_pairs:
    value: null
    formula: "=CORREL(gp.x, gp.y)"
    expected: 0.9869682265368206
  test_forecast_skips_pairs:
    value: null
    formula: "=FORECAST(10, gp.y, gp.x)"
    expected: 19.386666666666667
  test_covariance_p_skips_pairs:
    value: null
    formula: "=COVARIANCE.P(gp.x, gp.y)"
    expected: 8.875
  test_covariance_s_skips_pairs:
    value: null
    formula: "=COVARIANCE.S(gp.x, gp.y)"
    expected: 11.833333333333334
  # #N/A is an error that IFNA and ISNA catch, and an empty cell is not an error
  test_ifna_match_not_found:
    value: null
    formula: "=IFNA(MATCH(99, gp.x, 0), -1)"
    expected: -1
  test_isna_match_not_found:
    value: null
    formula: "=IF(ISNA(MATCH(99, gp.x, 0)), 1, 0)"
    expected: 1
  test_isna_other_error:
    value: null
    formula: "=IF(ISNA(1/0), 1, 0)"
    expected: 0
  test_ifna_keeps_other_errors:
    value: null
    formula: "=IFERROR(IFNA(1/0, 5), -1)"
    expected: -1
  test_iferror_of_an_empty_cell:
    value: null
    formula: "=IFERROR(INDEX(gp.x, 3), -1)"
    expected: 0
  test_iserror_of_an_empty_cell:
    value: null
    formula: "=IF(ISERROR(INDEX(gp.x, 3)), 1, 0)"
    expected: 0
  test_isnumber_of_an_error:
    value: null
    formula: "=IF(ISNUMBER(1/0), 1, 0)"
    expected: 0
  # DATEDIF with the start after the end is #NUM!
  test_datedif_start_after_end:
    value: null
    formula: "=IFERROR(DATEDIF(DATE(1999,1,31), DATE(1999,1,15), \"YM\"), -1)"
    expected: -1
    libreoffice: "Gnumeric 1.12 cannot read DATEDIF from an xlsx file"
  test_datedif_same_day_control:
    value: null
    formula: "=DATEDIF(DATE(2024,3,1), DATE(2024,3,1), \"D\")"
    expected: 0
    libreoffice: "Gnumeric 1.12 cannot read DATEDIF from an xlsx file"
  # A time that rounds up to midnight is the next day's 0
  test_hour_rounds_to_midnight:
    value: null
    formula: "=HOUR(0.999999999)"
    expected: 0
  test_minute_rounds_to_midnight:
    value: null
    formula: "=MINUTE(0.999999999)"
    expected: 0
  # Payments at a rate near 0 keep their digits
  test_pmt_rate_near_zero:
    value: null
    formula: "=PMT(1e-9, 24, -2.5, -0.227092664139)"
    expected: 0.11362886219906
  test_ppmt_rate_near_zero:
    value: null
    formula: "=PPMT(1e-9, 1, 11, 368.64)"
    expected: -33.5127271051636
  test_nper_ratio_far_from_one:
    value: null
    formula: "=NPER(0.1, -1e-12, -2.5)"
    expected: -275.36121334252
  test_rate_large_loan:
    value: null
    formula: "=RATE(276, -100, 1000000000000000)"
    expected: -0.0950995532592133
  # The normal density far in a tail is 0 (it was an error)
  test_norm_dist_far_tail:
    value: null
    formula: "=NORM.DIST(-179859, -6.66, 1, FALSE)"
    expected: 0
  # DB, DDB and VDB out of their range
  test_db_life_zero:
    value: null
    formula: "=IFERROR(DB(1, 0.093, 0, 8), -1)"
    expected: -1
  test_db_period_past_the_life:
    value: null
    formula: "=IFERROR(DB(1234.5678, 100, 3, 14, 4), -1)"
    expected: -1
    libreoffice: "Gnumeric 1.12 gives a number for a period past the life; LibreOffice gives #NUM!, as Forge does"
  test_vdb_salvage_above_cost:
    value: null
    formula: "=IFERROR(VDB(1, 3.38, 16, 8.9, 14), -1)"
    expected: -1
  test_ddb_fractional_period:
    value: null
    formula: "=DDB(2.5, 1, 15, 3.1)"
    expected: 0.246813062639783
  test_ddb_after_the_salvage:
    value: null
    formula: "=DDB(202.845, 35.9, 21, 18.7)"
    expected: 0
  # RRI with a negative ratio has a root when 1/nper is whole
  test_rri_negative_ratio_one_period:
    value: null
    formula: "=RRI(1, 100, -50)"
    expected: -1.5
  # Criteria compare text with text, and a pattern matches neither a date nor an empty text
  test_countif_text_above:
    value: null
    formula: "=COUNTIF(gt.t, \">c\")"
    expected: 3
  test_countif_text_at_most:
    value: null
    formula: "=COUNTIF(gt.t, \"<=b\")"
    expected: 1
  test_countif_dates_are_not_text:
    value: null
    formula: "=COUNTIF(gt.d, \"<=b\")"
    expected: 0
  test_countif_star_skips_empty_text:
    value: null
    formula: "=COUNTIF(gt.t, \"*\")"
    expected: 5
  test_match_star_skips_empty_text:
    value: null
    formula: "=MATCH(\"*\", gt.t, 0)"
    expected: 2
  # RANK.EQ counts the values above, exactly
  test_rank_zero_beside_tiny:
    value: null
    formula: "=RANK.EQ(0, gr.v)"
    expected: 4
  # ROUND with a unit past any double (10^309 and up): Forge said it had no
  # result; Gnumeric 1.12 and LibreOffice 26.2 give 0 (checked 2026-11-18)
  test_round_unit_past_any_double:
    value: null
    formula: "=ROUND(12345.6, -400)"
    expected: 0
