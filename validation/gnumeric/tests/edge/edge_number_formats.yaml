# Excel number formats, as format: holds them and TEXT reads them (Forge
# ADR-061, model format 5.4.0).
#
# Each case is TEXT(value, code) against the text that Gnumeric 1.12 and
# LibreOffice 26.2 both give for it (measured 2026-11-13, 25 codes on the
# values 1234.567, -1234.567, 0, 0.1234 and 46326; the two engines agree on
# every one used here). The first codes are those format: added: sections
# (the negative one has no minus of its own), colours, _ (a space), * (a
# fill: nothing in text) and trailing commas, each dividing by 1,000. The
# rest are codes Forge read before, kept as a check that they still do.
#
# Left out: 0.0,,"M" of -1234.567, where both engines write 0.0M and Forge
# -0.0M (a negative number that rounds to zero keeps its minus in Forge, as
# for TEXT(-0.001, "0.00"); see number_format.rs).

_forge_version: "5.4.0"

assumptions:
