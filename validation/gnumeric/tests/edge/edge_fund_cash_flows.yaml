# The investors' cash flows of examples/fund, as data, in the plan's order.
#
# Corvane Seed Fund I: eight calls into companies, ten yearly fee calls, and
# eight exits with the managers' carry taken from the last. examples/fund
# builds these rows with XLOOKUP and LET, which Gnumeric 1.12 does not have;
# here they are typed, so both engines recalculate XIRR and XNPV on them.
#
# Expected values, from Python written from examples/fund/README.md (scipy's
# brentq, actual/365 days from the first date, as Microsoft's documentation
# describes XIRR and XNPV; not Forge):
#   net:   XIRR 0.10826144576361177, XNPV at 12% -1599342.071630658
#   gross: XIRR 0.15675607686941964
#   late:  every exit a year later, the rows kept in the plan's order, so the
#          dates are out of order but none is before the first:
#          XIRR 0.0900660541848615, XNPV at 12% -4633065.970461081

