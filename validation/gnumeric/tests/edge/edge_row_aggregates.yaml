# Aggregates in a row formula (Forge ADR-058): an aggregate's range is the
# whole column, of another table or of the row's own, and its criterion the
# row's value. forge export writes the range as an absolute range and the
# criterion as the row's cell, as on a summary sheet in Excel.
#
# Expected values, worked out by hand (tests/row_aggregates.rs has the same):
#   months: q = 1, 1, 2, 2, 3; revenue = 10, 20, 30, 40, 50
#   by quarter: sums 30, 70, 50; counts 2, 2, 1; means 15, 35, 50;
#     maxima 20, 40, 50; minima 10, 30, 50; with cat "a" only 10, 30, 50
#   percentiles 0.25, 0.5, 0.75 of the revenue: (n - 1) p gives 20, 30, 40,
#     (n + 1) p gives 15, 30, 45; quartiles 1, 2, 3 give 20, 30, 40
#   revenue: mean 30, squared deviations 1000 (VAR.S 250, STDEV.P sqrt 200);
#     against q (mean 1.8): products of deviations 50, squared q deviations
#     2.8, so slope 50 / 2.8, intercept 30 - 1.8 slope, CORREL 50 / sqrt 2800,
#     FORECAST at quarter x: 30 + slope (x - 1.8)
#   SUMPRODUCT(revenue, q) = 10 + 20 + 60 + 80 + 150 = 320; GEOMEAN 12e6^0.2
#   own table: share 10/150 .. 50/150; rank by COUNTIF 5 .. 1; MAX(25, revenue)
#     works row by row (several arguments): 25 .. 50

_forge_version: "5.1.0"

months:
  q: [1, 1, 2, 2, 3]
  cat: ["a", "b", "a", "b", "a"]
  revenue: [10, 20, 30, 40, 50]
  share: "=revenue / SUM(revenue)"
  rank: "=COUNTIF(revenue, \">\" & revenue) + 1"
  clipped: "=MAX(25, revenue)"
  weighted: "=SUMPRODUCT(revenue, q)"

quarters:
  quarter: [1, 2, 3]
  p: [0.25, 0.5, 0.75]
  sumifs: "=SUMIFS(months.revenue, months.q, quarter)"
  sumifs_two: "=SUMIFS(months.revenue, months.q, quarter, months.cat, \"a\")"
  averageifs: "=AVERAGEIFS(months.revenue, months.q, quarter)"
  maxifs: "=MAXIFS(months.revenue, months.q, quarter)"
  minifs: "=MINIFS(months.revenue, months.q, quarter)"
  countifs: "=COUNTIFS(months.q, quarter)"
  sumif: "=SUMIF(months.q, quarter, months.revenue)"
  countif: "=COUNTIF(months.q, quarter)"
  averageif: "=AVERAGEIF(months.q, quarter, months.revenue)"
  percentile: "=PERCENTILE.INC(months.revenue, p)"
  percentile_exc: "=PERCENTILE.EXC(months.revenue, p)"
  quartile: "=QUARTILE.INC(months.revenue, quarter)"
  forecast: "=FORECAST(quarter, months.revenue, months.q)"
  with_let: "=LET(k, quarter, SUMPRODUCT((months.q = k) * months.revenue))"
  sum: "=SUM(months.revenue)"
  average: "=AVERAGE(months.revenue)"
  max: "=MAX(months.revenue)"
  min: "=MIN(months.revenue)"
  count: "=COUNT(months.revenue)"
  median: "=MEDIAN(months.revenue)"
  mode: "=MODE(months.q)"
  geomean: "=GEOMEAN(months.revenue)"
  sumproduct: "=SUMPRODUCT(months.revenue, months.q)"
  var: "=VAR.S(months.revenue)"
  stdev: "=STDEV.P(months.revenue)"
  correl: "=CORREL(months.revenue, months.q)"
  slope: "=SLOPE(months.revenue, months.q)"
  intercept: "=INTERCEPT(months.revenue, months.q)"

