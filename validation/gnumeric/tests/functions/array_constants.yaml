# Array constants (ADR-064): a row {1,2,3} or a column {1;2;3} of numbers,
# texts and TRUE or FALSE, written in a formula as in Excel. Each case is
# checked against Gnumeric 1.12 (LibreOffice 26.2 where Gnumeric cannot
# judge, each says why) after `forge export`, which writes the constant as
# it is, and against Forge after `forge import`, which reads it back.
#
# rc.x: 1, 2, 3, and a row formula that reads an array constant row by row.

_forge_version: "5.4.0"

rc:
  x: [1, 2, 3]
  y: "=INDEX({10;20;30}, x)"
  z: "=x + SUM({1,2})"

assumptions:
  test_sum_of_a_row:
    value: null
    formula: "=SUM({1,2,3})"
    expected: 6
  test_sum_of_a_column:
    value: null
    formula: "=SUM({1;2;3})"
    expected: 6
  test_signs_and_exponents:
    value: null
    formula: "=SUM({-1,+2,-3.5E1})"
    expected: -34
  test_large_number_item:
    value: null
    formula: "=SUM({1E+15,1})"
    expected: 1000000000000001
  test_large:
    value: null
    formula: "=LARGE({5,1,3,3,8}, 2)"
    expected: 5
  test_small:
    value: null
    formula: "=SMALL({5,1,3,3,8}, 2)"
    expected: 3
  test_max:
    value: null
    formula: "=MAX({3,9,2})"
    expected: 9
  test_average:
    value: null
    formula: "=AVERAGE({1,2,3,4})"
    expected: 2.5
  test_median:
    value: null
    formula: "=MEDIAN({1,5,2,8})"
    expected: 3.5
  test_count_skips_text:
    value: null
    formula: "=COUNT({1,2,\"a\"})"
    expected: 2
  test_match_text_in_a_column:
    value: null
    formula: "=MATCH(\"b\", {\"a\";\"b\";\"c\"}, 0)"
    expected: 2
  test_match_number:
    value: null
    formula: "=MATCH(7, {1,3,5,7,9}, 0)"
    expected: 4
  test_sumproduct:
    value: null
    formula: "=SUMPRODUCT({1,2,3}, {4,5,6})"
    expected: 32
  test_and_of_booleans:
    value: null
    formula: "=IF(AND({TRUE,FALSE}), 1, 0)"
    expected: 0
  test_index_of_a_column:
    value: null
    formula: "=INDEX({10;20;30}, 2)"
    expected: 20
  test_index_of_a_row:
    value: null
    formula: "=INDEX({10,20,30}, 2)"
    expected: 20
    libreoffice: "Gnumeric 1.12 reads INDEX's second argument as a row of a one-row constant (#REF!); Microsoft's INDEX page: with one row, it is the column"
  test_arithmetic_on_a_constant:
    value: null
    formula: "=SUM({1,2,3} * 2)"
    expected: 12
    libreoffice: "Gnumeric 1.12 takes one item of {1,2,3} * 2 in a cell that is not an array formula (2); LibreOffice gives 12"
  test_xlookup:
    value: null
    formula: "=XLOOKUP(2, {1,2,3}, {10,20,30})"
    expected: 20
    libreoffice: "Gnumeric 1.12 has no XLOOKUP"
  test_row_formula_reads_a_constant:
    value: null
    formula: "=SUM(rc.y)"
    expected: 60
  test_row_formula_adds_a_sum_of_a_constant:
    value: null
    formula: "=SUM(rc.z)"
    expected: 15
