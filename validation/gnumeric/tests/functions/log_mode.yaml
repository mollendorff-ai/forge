# LOG with a base, MODE, and the Excel names of the variance family
# Functions covered: LOG, MODE, MODE.SNGL, VAR, VAR.P, STDEV, STDEV.P

_forge_version: "5.0.0"

assumptions:
  # LOG(number) is base 10; LOG(number, base) is any base
  log_default_base:
    value: null
    formula: "=LOG(100)"
    expected: 2
  log_base_10:
    value: null
    formula: "=LOG(1000, 10)"
    expected: 3
  log_base_2:
    value: null
    formula: "=LOG(8, 2)"
    expected: 3
  log_fractional_number:
    value: null
    formula: "=LOG(0.5, 2)"
    expected: -1
  log_fractional_base:
    value: null
    formula: "=LOG(10, 0.1)"
    expected: -1
  log_base_e:
    value: null
    formula: "=LOG(EXP(3), EXP(1))"
    expected: 3

  # MODE is the most frequent value; a tie goes to the one met first
  mode_basic:
    value: null
    formula: "=MODE(2, 4, 4, 4, 5, 5, 7, 9)"
    expected: 4
  mode_tie_first_wins:
    value: null
    formula: "=MODE(5, 1, 1, 5)"
    expected: 5
  mode_sngl:
    value: null
    formula: "=MODE.SNGL(3, 3, 1)"
    expected: 3
  mode_negative:
    value: null
    formula: "=MODE(-2, -2, 1, 3)"
    expected: -2

  # The Excel names of the variance family
  var_alias:
    value: null
    formula: "=VAR(2, 4, 4, 4, 5, 5, 7, 9)"
    expected: 4.571428571428571
  var_p:
    value: null
    formula: "=VAR.P(2, 4, 4, 4, 5, 5, 7, 9)"
    expected: 4
  stdev_alias:
    value: null
    formula: "=STDEV(2, 4, 4, 4, 5, 5, 7, 9)"
    expected: 2.138089935299395
  stdev_p:
    value: null
    formula: "=STDEV.P(2, 4, 4, 4, 5, 5, 7, 9)"
    expected: 2
