# Batch of 26 functions added in Forge 10.1: regression, the normal distribution,
# loan and depreciation schedules, and a few conveniences.
# Functions covered: SLOPE, INTERCEPT, RSQ, FORECAST, FORECAST.LINEAR, COVARIANCE.P, COVARIANCE.S,
#   GEOMEAN, PERCENTILE.INC, PERCENTILE.EXC, QUARTILE.INC, QUARTILE.EXC, NORM.DIST, NORM.INV,
#   NORM.S.DIST, NORM.S.INV, RRI, SYD, CUMIPMT, CUMPRINC, VDB, MROUND, WEEKNUM, ISOWEEKNUM, XMATCH
# Expected values come from outside Forge: R (lm, cor, quantile types 7 and 6, pnorm, dnorm, qnorm,
# an amortisation loop for CUMIPMT and CUMPRINC), and Python (a depreciation loop for VDB, the
# calendar for weeks, round-half-away for MROUND). TEXTJOIN returns text and is checked in its unit tests.

_forge_version: "5.0.0"

