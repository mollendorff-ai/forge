[package]
name = "mollendorff-forge-e2e-gnumeric"
version = "0.0.0"
edition = "2021"
description = "Forge formulas compared with Gnumeric and LibreOffice"
license = "MIT OR Apache-2.0"
# Run from this repository (ADR-057); not published
publish = false

[lib]
name = "forge_e2e_gnumeric"
path = "src/lib.rs"

[[bin]]
name = "forge-e2e-gnumeric"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# YAML parsing
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"

# Temp files for XLSX/CSV
tempfile = "3.23"

# Error handling
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
