[package]
name = "forge-wasm"
version = "0.1.0"
edition = "2021"
description = "Forge's tools in a browser: the same core functions as the command line and MCP, on models held in memory (ADR-055)"
repository = "https://github.com/mollendorff-ai/forge"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# cdylib for wasm-pack, rlib for the native tests and the expected-results example
crate-type = ["cdylib", "rlib"]

[dependencies]
mollendorff-forge = { path = "..", default-features = false }
serde = "1.0"
serde_json = "1.0"
wasm-bindgen = "0.2"
# A Rust panic in the browser shows its message in the console
console_error_panic_hook = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
