# scriv (https://scriv.readthedocs.io), pinned in the Makefile's changelog
# target. Each change adds one fragment here; the engine lane collects them
# into CHANGELOG.md when it makes a release (docs/MAINTAINING.md).
[scriv]
format = md
categories = Added, Changed, Fixed, Removed
md_header_level = 2
entry_title_template = [{{ version }}] - {{ date.strftime('%%Y-%%m-%%d') }}
version = literal: Cargo.toml: package.version
