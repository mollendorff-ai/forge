_forge_version: 1.0.0
assumptions:
  test_true_gt_false:
    value: 1.0
    formula: =IF(TRUE > FALSE, 1, 0)
    expected: 1
  test_true_eq_one:
    value: 1.0
    formula: =IF(TRUE = 1, 1, 0)
    expected: 1
    gnumeric_skip: "Excel and Gnumeric compare a boolean with a number as unequal; Forge treats them as equal"
  test_false_eq_zero:
    value: 1.0
    formula: =IF(FALSE = 0, 1, 0)
    expected: 1
    gnumeric_skip: "Excel and Gnumeric compare a boolean with a number as unequal; Forge treats them as equal"
  test_string_exact_match:
    value: 1.0
    formula: =IF("ABC" = "ABC", 1, 0)
    expected: 1
  test_string_case_insensitive:
    # Excel = operator is case-insensitive (use EXACT() for case-sensitive)
    value: 1.0
    formula: =IF("ABC" = "abc", 1, 0)
    expected: 1
  test_float_eq_int:
    value: 1.0
    formula: =IF(1.0 = 1, 1, 0)
    expected: 1
  test_gt_basic:
    value: 1.0
    formula: =IF(10 > 9, 1, 0)
    expected: 1
  test_gte_equal:
    value: 1.0
    formula: =IF(10 >= 10, 1, 0)
    expected: 1
  test_lt_basic:
    value: 1.0
    formula: =IF(10 < 11, 1, 0)
    expected: 1
  test_lte_equal:
    value: 1.0
    formula: =IF(10 <= 10, 1, 0)
    expected: 1
  test_not_equal:
    value: 1.0
    formula: =IF(10 <> 9, 1, 0)
    expected: 1
  test_floating_point_rounded:
    value: 1.0
    formula: =IF(ROUND(0.1 + 0.2, 1) = 0.3, 1, 0)
    expected: 1
  # Note: forge correctly handles floating point comparison
  # 0.1 + 0.2 = 0.3 returns TRUE (expected behavior for spreadsheets)
  test_floating_point_precision:
    value: 1.0
    formula: =IF(0.1 + 0.2 = 0.3, 1, 0)
    expected: 1
    gnumeric_skip: "Excel rounds to 15 digits and returns TRUE; Gnumeric returns FALSE"
