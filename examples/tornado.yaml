# Tornado Diagram Example
# ========================
# Run with: forge tornado examples/tornado.yaml
#
# This example performs one-at-a-time sensitivity analysis on project NPV.
# Each input is varied from its low to high value while others stay at base.
#
# The tornado diagram shows which inputs have the most impact on NPV,
# sorted by magnitude (largest swing at top).
#
# Unlike Monte Carlo (probabilistic), tornado is deterministic:
# - Shows the RANGE of outcomes for each input
# - Identifies which assumptions to focus on
# - Easy to communicate to stakeholders

_forge_version: "5.0.0"

# ─────────────────────────────────────────────────────────────────────────────
# Tornado Configuration
# ─────────────────────────────────────────────────────────────────────────────
tornado:
  output: valuation.npv

  # The base case (center of the tornado) is the model's own values below

  # Input ranges to test (low to high)
  inputs:
    - name: revenue_growth
      low: 0.05
      high: 0.20

    - name: operating_margin
      low: 0.15
      high: 0.30

    - name: discount_rate
      low: 0.08
      high: 0.15

    - name: tax_rate
      low: 0.20
      high: 0.35

    - name: initial_investment
      low: 800000
      high: 1500000

# ─────────────────────────────────────────────────────────────────────────────
# Model Inputs
# ─────────────────────────────────────────────────────────────────────────────
assumptions:
  revenue_growth:
    value: 0.10
    formula: null

  operating_margin:
    value: 0.20
    formula: null

  discount_rate:
    value: 0.10
    formula: null

  tax_rate:
    value: 0.25
    formula: null

  initial_investment:
    value: 1000000
    formula: null

  base_revenue:
    value: 500000
    formula: null

# ─────────────────────────────────────────────────────────────────────────────
# Projections (5-Year)
# ─────────────────────────────────────────────────────────────────────────────
projections:
  year: [1, 2, 3, 4, 5]
  revenue: "=assumptions.base_revenue * (1 + assumptions.revenue_growth) ^ year"
  operating_profit: "=revenue * assumptions.operating_margin"
  tax: "=operating_profit * assumptions.tax_rate"
  net_income: "=operating_profit - tax"

# ─────────────────────────────────────────────────────────────────────────────
# Valuation
# ─────────────────────────────────────────────────────────────────────────────
valuation:
  npv:
    value: null
    formula: "=NPV(assumptions.discount_rate, projections.net_income) - assumptions.initial_investment"

# ─────────────────────────────────────────────────────────────────────────────
# Expected Output:
# ─────────────────────────────────────────────────────────────────────────────
# Base Case NPV: -$625,000 (5 years of net income worth $375,000, less the
# $1,000,000 investment). Checked against an independent calculation.
#
# NPV at each input's low and high value, largest swing first:
#   Initial Investment   -$425,000 to -$1,125,000   swing $700,000
#   Operating Margin     -$718,750 to   -$437,500   swing $281,250
#   Revenue Growth       -$673,141 to   -$509,454   swing $163,687
#   Tax Rate             -$600,000 to   -$675,000   swing  $75,000
#   Discount Rate        -$603,645 to   -$671,168   swing  $67,523
#
# Forge prints each swing after "±". It is the full low-to-high range.
