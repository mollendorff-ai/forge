_forge_version: "5.4.0"
# Project Kittiwake (fictional): Valdane Instruments bids for Quillon Sensors.
#
# Valdane offers a 30% premium to Quillon's undisturbed share price, 60% in
# cash it borrows and 40% in new Valdane shares. Does the deal create value
# for Valdane's shareholders once the synergies, the integration bill and
# the fees are counted? Is it accretive or dilutive to earnings per share,
# year by year? And what is the most Valdane can pay before it is not?
# Millions, except per share; five years from closing. All figures are made up.
#
#   forge calculate deal.yaml --dry-run
#   forge scenarios deal.yaml
#   forge tornado deal.yaml
#   forge break-even deal.yaml --output valuation.value_created --vary offer.premium
#   forge compare deal.yaml --scenarios base,all_cash,all_shares
_includes:
  - file: buyer.yaml
    as: buyer
  - file: target.yaml
    as: target

# Valdane's own case for Quillon, which its deal team underwrites
case:
  # Quillon's earnings, revenue and cash, a year, for five years;
  # Quillon's management plans 9% (target.yaml)
  quillon_growth: {value: 0.07, format: "0.0%", better: higher}
  # Growth for ever after year 5
  terminal_growth: {value: 0.025, format: "0.0%"}
  # The return Valdane's investors ask for on a business like Quillon's
  discount_rate: {value: 0.08, format: "0.0%"}

offer:
  premium: {value: 0.30, format: "0%"}
  price_per_share:
    formula: "=@target.company.unaffected_price * (1 + premium)"
    format: "$#,##0.00"
  equity_value:
    formula: "=price_per_share * @target.company.shares"
    format: "$#,##0"
  # The debt comes with the company
  enterprise_value:
    formula: "=equity_value + @target.company.net_debt"
    format: "$#,##0"
  ev_to_ebitda:
    formula: "=enterprise_value / @target.company.ebitda"
    format: "0.0\"x\""
  price_to_earnings:
    formula: "=equity_value / @target.company.net_income_next_year"
    format: "0.0\"x\""
  # What Quillon's shareholders get above what the market said their shares were worth
  premium_paid:
    formula: "=equity_value - @target.company.unaffected_price * @target.company.shares"
    format: "$#,##0"

financing:
  # The share of the price paid in cash; the rest in new Valdane shares
  cash_share: {value: 0.60, format: "0%"}
  debt_rate: {value: 0.065, format: "0.00%", better: lower}
  # Bankers, lawyers and the bridge loan, as a share of the equity value
  fees_rate: {value: 0.02, format: "0.0%"}
  fees:
    formula: "=offer.equity_value * fees_rate"
    format: "$#,##0"
  # The cash part and the fees, all borrowed
  new_debt:
    formula: "=offer.equity_value * cash_share + fees"
    format: "$#,##0"
  # The share part, at Valdane's share price
  new_shares:
    formula: "=offer.equity_value * (1 - cash_share) / @buyer.company.share_price"
    format: "#,##0.0"
  # Of the combined company, the share Quillon's shareholders end up owning
  quillon_holders_own:
    formula: "=new_shares / (@buyer.company.shares + new_shares)"
    format: "0.0%"
  # Net debt over EBITDA on the day of closing; the rating agencies are
  # comfortable up to 2.5
  leverage_at_close:
    formula: "=(@buyer.company.net_debt + @target.company.net_debt + new_debt) / (@buyer.company.ebitda + @target.company.ebitda)"
    format: "0.00\"x\""

synergies:
  # Costs taken out a year once fully in place: two plants into one,
  # purchasing, a head office. They reach the full amount over cost_ramp_earnings.
  cost_run_rate: {value: 40, better: higher}
  cost_ramp_years: 3
  # Sales of Quillon's sensors through Valdane's channels, a year once in
  # place, at the margin they earn; they start in year 2
  revenue_run_rate: {value: 60, better: higher}
  revenue_margin: {value: 0.30, format: "0%"}
  revenue_ramp_years: 4
  # One-off cost of getting the synergies: severance, systems, the plant move
  integration_cost:
    better: lower
    value: 100
  # Customer lists and technology valued at closing, and written off over
  # ten years: a cost in the accounts, not in cash
  intangibles: 400
  amortisation_years: 10

# The five years after closing, in the accounts
earnings:
  year: {start: 2027, count: 5, unit: year}
  n: "=ROW()"
  buyer_net_income: "=@buyer.company.net_income_next_year * (1 + @buyer.company.earnings_growth) ^ (n - 1)"
  target_net_income: "=@target.company.net_income_next_year * (1 + case.quillon_growth) ^ (n - 1)"
  cost_synergies: "=synergies.cost_run_rate * MIN(1, n / synergies.cost_ramp_years)"
  revenue_synergies: "=synergies.revenue_run_rate * MIN(1, (n - 1) / synergies.revenue_ramp_years)"
  synergy_profit: "=cost_synergies + revenue_synergies * synergies.revenue_margin"
  # Half the integration bill in the first year, then 35% and 15%
  integration_phasing: [0.5, 0.35, 0.15, 0, 0]
  integration: "=synergies.integration_cost * integration_phasing"
  interest: "=financing.new_debt * financing.debt_rate"
  amortisation: "=synergies.intangibles / synergies.amortisation_years"
  # Both companies' earnings, the synergies less what they cost, the new
  # interest and the amortisation, all after tax
  pro_forma_net_income: "=buyer_net_income + target_net_income + (synergy_profit - integration - interest - amortisation) * (1 - @buyer.company.tax_rate)"
  pro_forma_eps: {formula: "=pro_forma_net_income / (@buyer.company.shares + financing.new_shares)", format: "$#,##0.00"}
  standalone_eps: {formula: "=buyer_net_income / @buyer.company.shares", format: "$#,##0.00"}
  accretion: {formula: "=pro_forma_eps / standalone_eps - 1", format: "0.0%"}
  # The way the press release will count it: before amortisation and
  # integration costs
  adjusted_eps: {formula: "=(pro_forma_net_income + (integration + amortisation) * (1 - @buyer.company.tax_rate)) / (@buyer.company.shares + financing.new_shares)", format: "$#,##0.00"}
  adjusted_accretion: {formula: "=adjusted_eps / standalone_eps - 1", format: "0.0%"}

# The same five years in cash, which is what the deal is worth: Quillon's on
# its own, and what the synergies add after tax
cash:
  year: {start: 2027, count: 5, unit: year}
  n: "=ROW()"
  target_cash: {formula: "=@target.company.free_cash_flow_next_year * (1 + case.quillon_growth) ^ (n - 1)", format: "#,##0.0"}
  synergy_cash: {formula: "=(earnings.synergy_profit - earnings.integration) * (1 - @buyer.company.tax_rate)", format: "#,##0.0"}
  discount: "=1 / (1 + case.discount_rate) ^ n"

valuation:
  # Year 5's cash growing for ever, as a value at the end of year 5
  terminal_multiple:
    formula: "=(1 + case.terminal_growth) / (case.discount_rate - case.terminal_growth)"
    format: "0.0"
  # What Quillon is worth on its own, with its debt
  standalone:
    better: higher
    formula: "=SUMPRODUCT(cash.target_cash, cash.discount) + INDEX(cash.target_cash, 5) * terminal_multiple * INDEX(cash.discount, 5)"
    format: "$#,##0"
  # What the synergies are worth, net of the integration bill
  synergies:
    better: higher
    formula: "=SUMPRODUCT(cash.synergy_cash, cash.discount) + INDEX(cash.synergy_cash, 5) * terminal_multiple * INDEX(cash.discount, 5)"
    format: "$#,##0"
  # Everything Valdane pays: the shares, the debt it takes on and the fees
  price_paid:
    formula: "=offer.enterprise_value + financing.fees"
    format: "$#,##0"
  # The question: is Quillon, with the synergies, worth more than it costs?
  value_created:
    formula: "=standalone + synergies - price_paid"
    format: "$#,##0"
    better: higher
  # Value created a Valdane share, counting the new ones
  value_created_per_share:
    better: higher
    formula: "=value_created / (@buyer.company.shares + financing.new_shares)"
    format: "$#,##0.00"
  # How many times the synergies cover the premium
  synergy_cover:
    formula: "=synergies / offer.premium_paid"
    format: "0.00\"x\""
  # Of the synergies' value, the share that comes after year 5
  synergies_after_year_5:
    formula: "=INDEX(cash.synergy_cash, 5) * terminal_multiple * INDEX(cash.discount, 5) / synergies"
    format: "0%"
  deal_irr:
    better: higher
    formula: "=IRR(-price_paid, cash.target_cash + cash.synergy_cash + IF(cash.n = 5, (INDEX(cash.target_cash, 5) + INDEX(cash.synergy_cash, 5)) * terminal_multiple, 0))"
    format: "0.00%"

eps:
  year_1_accretion: {formula: "=INDEX(earnings.accretion, 1)", format: "0.0%", better: higher}
  year_3_accretion: {formula: "=INDEX(earnings.accretion, 3)", format: "0.0%", better: higher}
  year_5_accretion: {formula: "=INDEX(earnings.accretion, 5)", format: "0.0%", better: higher}
  year_1_adjusted_accretion: {formula: "=INDEX(earnings.adjusted_accretion, 1)", format: "0.0%", better: higher}
  # The first year the deal adds to reported earnings a share; 0 if none does
  first_accretive_year:
    formula: "=MINIFS(earnings.n, earnings.accretion, \">0\")"

scenarios:
  base:
    probability: 0.45
    description: As the board was shown
  slow_integration:
    probability: 0.25
    description: The plants take five years to merge and the bill runs 50% over
    scalars:
      synergies.cost_ramp_years: 5
      synergies.integration_cost: 150
  no_revenue_synergies:
    probability: 0.20
    description: Valdane's sales teams never sell Quillon's sensors
    scalars:
      synergies.revenue_run_rate: 0
  rates_up:
    probability: 0.10
    description: Rates rise 1.5 points before the debt is fixed; investors ask 9%
    scalars:
      financing.debt_rate: 0.08
      case.discount_rate: 0.09
  # Choices, not chances: how Valdane pays. No probability, so forge scenarios
  # leaves them out and names them; forge compare puts them beside the plan's 60/40
  all_cash:
    description: Valdane pays everything in borrowed cash
    scalars:
      financing.cash_share: 1
  all_shares:
    description: Valdane pays everything in new Valdane shares
    scalars:
      financing.cash_share: 0

tornado:
  output: valuation.value_created
  inputs:
    - name: offer.premium
      low: 0.20
      high: 0.45
    - name: synergies.cost_run_rate
      low: 20
      high: 55
    - name: synergies.revenue_run_rate
      low: 0
      high: 90
    - name: synergies.integration_cost
      low: 80
      high: 170
    - name: case.quillon_growth
      low: 0.04
      high: 0.10
    - name: case.discount_rate
      low: 0.075
      high: 0.09
    - name: case.terminal_growth
      low: 0.015
      high: 0.03
