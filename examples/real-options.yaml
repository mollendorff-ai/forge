# Real Options Analysis Example
# ==============================
# Run with: forge real-options examples/real-options.yaml
#
# This example values a phased factory investment with flexibility:
#
# Traditional NPV: Build factory now for $10M, expect $12M present value
#   => NPV = $12M - $10M = $2M
#
# But management has OPTIONS:
#   1. DEFER: Wait up to 2 years before deciding
#   2. EXPAND: Double capacity if demand is high (+$5M for 2x output)
#   3. ABANDON: Sell assets for $3M salvage if demand collapses
#
# Real options analysis values each flexibility on its own. They overlap, so
# Forge compares them instead of adding them up.

_forge_version: "5.1.0"

# ─────────────────────────────────────────────────────────────────────────────
# Real Options Configuration
# ─────────────────────────────────────────────────────────────────────────────
real_options:
  name: "Phased Factory Investment"
  method: binomial  # or black_scholes

  # Underlying asset characteristics
  underlying:
    current_value: 12000000     # PV of expected cash flows
    volatility: 0.30            # Annual std dev of value
    risk_free_rate: 0.05        # 5% risk-free rate
    time_horizon: 3             # 3-year analysis period
    dividend_yield: 0.02        # Cash leakage (opportunity cost)

  binomial_steps: 50            # Binomial tree steps (more = accurate)

  # Build now for $10M, worth $12M: NPV = $2M (worked out in traditional_analysis
  # below). Needed to value options held on top of the project (expand, abandon).
  traditional_npv: 2000000

  # Available options (each valued as an American option over time_horizon)
  options:
    # Option to wait before committing
    - type: defer
      name: "Wait up to 2 years before building"
      max_deferral: 2           # Can wait 0, 1, or 2 years
      exercise_cost: 10000000   # $10M to build the factory, now or later

    # Option to expand if successful
    - type: expand
      name: "Double capacity if demand high"
      exercise_cost: 5000000    # Additional $5M investment
      expansion_factor: 2.0     # Doubles output/value

    # Option to abandon if unsuccessful
    - type: abandon
      name: "Sell assets for salvage value"
      salvage_value: 3000000    # $3M recovery

# ─────────────────────────────────────────────────────────────────────────────
# Supporting Assumptions
# ─────────────────────────────────────────────────────────────────────────────
assumptions:
  # For context only - real options uses underlying config
  base_revenue: 4000000

  operating_margin: 0.30

  growth_rate: 0.08

# ─────────────────────────────────────────────────────────────────────────────
# Comparison: Traditional vs Real Options
# ─────────────────────────────────────────────────────────────────────────────
traditional_analysis:
  present_value: 12000000

  investment_cost: 10000000

  traditional_npv:
    formula: "=present_value - investment_cost"

# ─────────────────────────────────────────────────────────────────────────────
# Expected Output:
# ─────────────────────────────────────────────────────────────────────────────
# Traditional NPV: $12.0M - $10.0M = $2.0M (see traditional_analysis above)
#
# Option values (American options, binomial with 50 steps; checked against an
# independent Cox-Ross-Rubinstein tree), and the project value with each:
#   Defer:    $3,245,832 -> project $3,245,832 (waiting already includes
#             building now, so the NPV is not added again)
#   Expand:   $7,118,281 -> project $9,118,281 ($2M NPV + option)
#   Abandon:      $1,720 -> project $2,001,720 ($2M NPV + option)
#
# Best: build now and keep the option to expand, $9.12M.
# Waiting is worth $1.25M more than building with no flexibility ($3.25M - $2M),
# but less than building with the expansion option.
#
# The "exercise when" lines are rules of thumb, not the optimal exercise boundary.
