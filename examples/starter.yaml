# A first Forge model. Calculate it with: forge calculate starter.yaml
# Then see the results side by side with: forge report starter.yaml

# The model FORMAT version, not the Forge version (forge --version): "5.1.0"
# is enough for a new model. Later formats add features some examples use;
# forge schema --list lists them.
_forge_version: "5.1.0"

# A group of scalars: one value per name.
# An input is a plain number. A formula is written {formula: "=..."}, because
# forge calculate writes its result next to it, as value: ...
# The full name (plan.price) always works; a key of the same group (price) too.
plan:
  price: 40
  units_per_month: 120
  monthly_costs: 3000
  revenue: {formula: "=plan.price * plan.units_per_month", value: 4800}
  profit: {formula: "=plan.revenue - plan.monthly_costs", value: 1800}

# A table: columns of the same length, one row per item.
# A column formula is a bare "=..." string, calculated row by row from the
# table's own columns. Inside SUM, MIN, MAX or AVERAGE a column's name is the
# whole column, so "=revenue / SUM(revenue)" is each row's share of the total
# (ADR-058). A total that stands alone is a scalar, below, and a column may
# read it, as share_of_revenue does.
products:
  name: ["Basic", "Plus", "Pro"]
  price: [20, 40, 80]
  units: [200, 120, 30]
  revenue: "=price * units"
  share_of_revenue: "=revenue / totals.revenue"

# A scalar can reduce a column of a table, which it names with the table.
totals:
  revenue: {formula: "=SUM(products.revenue)", value: 11200}
  best_seller_units: {formula: "=MAX(products.units)", value: 200}
