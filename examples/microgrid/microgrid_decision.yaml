_forge_version: "5.1.0"
# Ilha Corva: which system, and build now or wait a year? (fictional)
#
# Two systems: a smaller one (2.8 MWp of solar, 9 MWh of battery) and the plan
# (3.4 MWp, 10 MWh), the best pair in a sweep of both sizes. Every number here
# comes from microgrid.yaml, calculated for that branch: 36 runs in all, and a
# test recalculates each one, so the tree cannot fall behind the model.
#
# A cost is the capex; a value is the present value of the cash the project
# frees up to 2046; both in today's money at 8%. Waiting a year: demand and
# diesel grow a year, the battery price is known, everything is discounted one
# more year, and the project runs 19 years instead of 20 so that it ends in
# the same year. Diesel and the sun are not known on any branch when the
# island decides.
#
#   forge decision-tree microgrid_decision.yaml
decision_tree:
  name: "Ilha Corva system"
  root:
    type: decision
    name: "Which system, now or in a year?"
    branches:
      build_small_now:
        cost: 7100000
        next: outcome_now_small
      build_big_now:
        cost: 8140000
        next: outcome_now_big
      wait_a_year:
        cost: 0
        next: battery_market
  nodes:
    battery_market:
      type: chance
      name: "Battery prices after a year"
      branches:
        fall_30_percent:
          probability: 0.5
          next: choose_after_fall
        flat:
          probability: 0.5
          next: choose_after_flat
    choose_after_fall:
      type: decision
      name: "Which system, battery prices fall"
      branches:
        build_small:
          cost: 5624074
          next: outcome_fall_small
        build_big:
          cost: 6481481
          next: outcome_fall_big
    choose_after_flat:
      type: decision
      name: "Which system, battery prices flat"
      branches:
        build_small:
          cost: 6574074
          next: outcome_flat_small
        build_big:
          cost: 7537037
          next: outcome_flat_big
    outcome_now_small:
      type: chance
      name: "Diesel and sun, 2.8 MWp + 9 MWh"
      branches:
        cheap_sunny:
          probability: 0.175
          value: 12643230
        cheap_cloudy:
          probability: 0.075
          value: 11391035
        plan_sunny:
          probability: 0.35
