# Bootstrap Resampling Example
# =============================
# Run with: forge bootstrap examples/bootstrap.yaml
#
# This example calculates confidence intervals for portfolio returns
# using non-parametric bootstrap resampling.
#
# Why bootstrap?
# - No assumption about distribution shape
# - Works with small samples
# - Validated against R's boot package
#
# Process:
# 1. Take historical returns (12 months)
# 2. Resample with replacement 10,000 times
# 3. Calculate statistic (mean, median, etc.) for each resample
# 4. Use distribution of statistics for confidence intervals

_forge_version: "5.0.0"

# ─────────────────────────────────────────────────────────────────────────────
# Bootstrap Configuration
# ─────────────────────────────────────────────────────────────────────────────
bootstrap:
  iterations: 10000
  confidence_levels: [0.90, 0.95, 0.99]
  seed: 42  # For reproducibility
  method: percentile  # percentile (default), basic, or bca (bias-corrected and accelerated)

  # Historical monthly returns (12 months)
  data:
    - 0.052   # Jan: +5.2%
    - -0.018  # Feb: -1.8%
    - 0.031   # Mar: +3.1%
    - 0.045   # Apr: +4.5%
    - -0.027  # May: -2.7%
    - 0.068   # Jun: +6.8%
    - 0.023   # Jul: +2.3%
    - -0.041  # Aug: -4.1%
    - 0.037   # Sep: +3.7%
    - 0.055   # Oct: +5.5%
    - -0.012  # Nov: -1.2%
    - 0.082   # Dec: +8.2%

  # What to calculate: one statistic per run (mean, median, std, var,
  # percentile, min or max). For a percentile, also set percentile_value.
  statistic: mean

# ─────────────────────────────────────────────────────────────────────────────
# Portfolio Context
# ─────────────────────────────────────────────────────────────────────────────
portfolio:
  # Growth Portfolio (scalar values must be numbers, so the label is a comment)

  initial_value:
    value: 1000000
    formula: null

  # Annualized return (simple)
  annual_return:
    value: null
    formula: "=0.0246 * 12"  # Sample mean (2.46%) * 12

  # Projected value after 1 year
  projected_value:
    value: null
    formula: "=initial_value * (1 + annual_return)"

# ─────────────────────────────────────────────────────────────────────────────
# Expected Output:
# ─────────────────────────────────────────────────────────────────────────────
# Sample mean: 2.46% monthly (12 months)
#
# Bootstrap of the mean (10,000 resamples, seed 42):
#   Std error: 1.10%
#   90% CI: [0.58%, 4.26%]
#   95% CI: [0.26%, 4.58%]
#   99% CI: [-0.37%, 5.12%]
#
# An independent bootstrap (numpy, 200,000 resamples) gives the same standard
# error and intervals within 0.1 percentage point.
#
# Interpretation:
# - With 95% confidence the true mean monthly return is between about 0.3% and 4.6%
# - Run again with statistic: median, std or percentile for the other measures
