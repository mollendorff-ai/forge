# Bayesian Network Example
# =========================
# Run with: forge bayesian examples/bayesian.yaml
#
# This example models credit default risk as a chain:
#
#   [Economic Conditions] ──► [Company Revenue] ──► [Default Probability]
#
# Here each node has one parent, so each conditional probability table (CPT)
# has one row per state of that parent. A node can also have several parents:
# list them in `parents`, and key each CPT row by one state of each parent, in
# that order, separated by commas: `"rainy, yes": [0.9, 0.1]`. See
# examples/bagel/slow_week.yaml for a two-parent network.
#
# Queries are command-line options, not part of the file:
#   forge bayesian examples/bayesian.yaml                                  # every node
#   forge bayesian examples/bayesian.yaml --query default_probability      # one node
#   forge bayesian examples/bayesian.yaml -q default_probability -e economic_conditions=bad
#   forge bayesian examples/bayesian.yaml -q economic_conditions -e default_probability=high
#
# The last one runs the chain backwards: given a high default risk, how likely
# is each economic condition?

_forge_version: "5.0.0"

bayesian_network:
  name: "Credit Risk Assessment"

  nodes:
    # Root node: no parents, so it has a prior
    economic_conditions:
      type: discrete
      states: ["good", "neutral", "bad"]
      prior: [0.30, 0.50, 0.20]  # P(good)=30%, P(neutral)=50%, P(bad)=20%

    # Child node: one row per economic condition, each row is
    # [P(high), P(medium), P(low)] and sums to 1
    company_revenue:
      type: discrete
      states: ["high", "medium", "low"]
      parents: ["economic_conditions"]
      cpt:
        good:    [0.60, 0.30, 0.10]
        neutral: [0.30, 0.50, 0.20]
        bad:     [0.10, 0.30, 0.60]

    # Leaf node: default risk given revenue
    default_probability:
      type: discrete
      states: ["low", "medium", "high"]
      parents: ["company_revenue"]
      cpt:
        high:   [0.85, 0.12, 0.03]  # High revenue -> low default risk
        medium: [0.40, 0.45, 0.15]
        low:    [0.10, 0.30, 0.60]  # Low revenue -> high default risk

# ─────────────────────────────────────────────────────────────────────────────
# Expected output (checked by hand-enumerating the joint distribution):
# ─────────────────────────────────────────────────────────────────────────────
# No evidence, default_probability:   low 48.25%, medium 29.70%, high 22.05%
# Given economic_conditions=bad:      low 26.50%, medium 32.70%, high 40.80%
# Backwards, given default high, economic_conditions:
#                                     good 16.73%, neutral 46.26%, bad 37.01%
#   (bad economy was 20% to begin with; seeing a high default risk makes it 37%)
