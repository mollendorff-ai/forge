_forge_version: "5.1.0"
# What the household of budget.yaml actually earned and spent in October.
# Compare the two with:
#   forge variance examples/household/budget.yaml examples/household/actual.yaml --threshold 10
# Anything under income is better higher and anything under expenses better
# lower, so no item needs a better: of its own; what is left over says so.

income:
  salary: 5200
  side_work: 150
  total:
    formula: "=salary + side_work"

expenses:
  rent: 1650
  groceries: 812.43
  transport: 96.5
  utilities: 163.2
  phone_internet: 120
  eating_out: 388.75
  subscriptions: 74.97
  total:
    formula: "=rent + groceries + transport + utilities + phone_internet + eating_out + subscriptions"

result:
  left_over:
    formula: "=income.total - expenses.total"
    better: higher
  savings_rate:
    formula: "=left_over / income.total"
    better: higher
