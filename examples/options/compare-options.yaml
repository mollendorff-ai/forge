# Five rental units side by side. The units and every number are invented.
#
#   forge calculate compare-options.yaml
#   forge report compare-options.yaml --format markdown
#
# Each option is a group of scalars with the same keys, so forge report lines
# them up in one table. Within a group, a formula names its own keys (rent);
# budget.take_home names a key of another group.

_forge_version: "5.1.0"

# What every option is measured against.
budget:
  take_home: 4800       # monthly pay after tax
  most_on_housing: 0.35 # the share of it to spend on housing, at most

maple_studio:
  rent: 1350
  utilities: 75
  internet: 60
  transit: 97
  move_in: 900
  increase: 0.03
  monthly: {formula: "=rent + utilities + internet + transit", value: 1582}
  first_year: {formula: "=monthly * 12 + move_in", value: 19884}
  second_year_monthly: {formula: "=rent * (1 + increase) + utilities + internet + transit", value: 1622.5}
  left_each_month: {formula: "=budget.take_home - monthly", value: 3218}
  share_of_pay: {formula: "=monthly / budget.take_home", value: 0.329583333333333}
  room_under_cap: {formula: "=budget.take_home * budget.most_on_housing - monthly", value: 98}

harbour_one_bed:
  rent: 1595
  utilities: 0
  internet: 55
  transit: 0
  move_in: 1200
  increase: 0.025
  monthly: {formula: "=rent + utilities + internet + transit", value: 1650}
  first_year: {formula: "=monthly * 12 + move_in", value: 21000}
  second_year_monthly: {formula: "=rent * (1 + increase) + utilities + internet + transit", value: 1689.875}
  left_each_month: {formula: "=budget.take_home - monthly", value: 3150}
  share_of_pay: {formula: "=monthly / budget.take_home", value: 0.34375}
  room_under_cap: {formula: "=budget.take_home * budget.most_on_housing - monthly", value: 30}

park_loft:
  rent: 1480
  utilities: 110
  internet: 65
  transit: 97
  move_in: 650
  increase: 0.04
  monthly: {formula: "=rent + utilities + internet + transit", value: 1752}
  first_year: {formula: "=monthly * 12 + move_in", value: 21674}
  second_year_monthly: {formula: "=rent * (1 + increase) + utilities + internet + transit", value: 1811.2}
  left_each_month: {formula: "=budget.take_home - monthly", value: 3048}
  share_of_pay: {formula: "=monthly / budget.take_home", value: 0.365}
  room_under_cap: {formula: "=budget.take_home * budget.most_on_housing - monthly", value: -72}

river_studio:
  rent: 1290
  utilities: 95
  internet: 60
  transit: 97
  move_in: 1500
  increase: 0.035
  monthly: {formula: "=rent + utilities + internet + transit", value: 1542}
  first_year: {formula: "=monthly * 12 + move_in", value: 20004}
  second_year_monthly: {formula: "=rent * (1 + increase) + utilities + internet + transit", value: 1587.15}
  left_each_month: {formula: "=budget.take_home - monthly", value: 3258}
  share_of_pay: {formula: "=monthly / budget.take_home", value: 0.32125}
  room_under_cap: {formula: "=budget.take_home * budget.most_on_housing - monthly", value: 138}

garden_one_bed:
  rent: 1525
  utilities: 85
  internet: 50
  transit: 0
  move_in: 400
  increase: 0.05
  monthly: {formula: "=rent + utilities + internet + transit", value: 1660}
  first_year: {formula: "=monthly * 12 + move_in", value: 20320}
  second_year_monthly: {formula: "=rent * (1 + increase) + utilities + internet + transit", value: 1736.25}
  left_each_month: {formula: "=budget.take_home - monthly", value: 3140}
  share_of_pay: {formula: "=monthly / budget.take_home", value: 0.345833333333333}
  room_under_cap: {formula: "=budget.take_home * budget.most_on_housing - monthly", value: 20}

# Across the options: other keys, so forge report gives them their own table.
summary:
  lowest_monthly: {formula: "=MIN(maple_studio.monthly, harbour_one_bed.monthly, park_loft.monthly, river_studio.monthly, garden_one_bed.monthly)", value: 1542}
  lowest_first_year: {formula: "=MIN(maple_studio.first_year, harbour_one_bed.first_year, park_loft.first_year, river_studio.first_year, garden_one_bed.first_year)", value: 19884}
