_forge_version: "5.2.0"
# A Canadian mortgage, and what paying 300 more each month does.
# Canadian fixed rates compound twice a year, payments are monthly.
# All figures are made up.

loan:
  principal: 450000
  annual_rate: 0.0479
  amortization_years: 25
  extra_per_month: 300

terms:
  # The monthly rate that compounds to the semi-annual rate
  monthly_rate:
    formula: "=(1 + loan.annual_rate / 2) ^ (1 / 6) - 1"
  months:
    formula: "=loan.amortization_years * 12"
  payment:
    formula: "=-PMT(monthly_rate, months, loan.principal)"
    unit: CAD

as_agreed:
  total_paid:
    formula: "=terms.payment * terms.months"
  total_interest:
    formula: "=total_paid - loan.principal"

with_extra:
  payment:
    formula: "=terms.payment + loan.extra_per_month"
  # Fractional: the last payment is smaller
  months_exact:
    formula: "=NPER(terms.monthly_rate, -payment, loan.principal)"
  full_months:
    formula: "=INT(months_exact)"
  # Balance left after the full payments, paid with interest a month later
  balance_after_full:
    formula: "=loan.principal * (1 + terms.monthly_rate) ^ full_months - payment * ((1 + terms.monthly_rate) ^ full_months - 1) / terms.monthly_rate"
  last_payment:
    formula: "=balance_after_full * (1 + terms.monthly_rate)"
  total_paid:
    formula: "=payment * full_months + last_payment"
  total_interest:
    formula: "=total_paid - loan.principal"

saved:
  interest:
    formula: "=as_agreed.total_interest - with_extra.total_interest"
  months:
    formula: "=terms.months - ROUNDUP(with_extra.months_exact, 0)"
  years:
    formula: "=months / 12"

# The loan month by month with the extra payment: each month opens with
# what the month before closed with. The last payment is what is left, and
# the months after it are zeros. The closed forms above say the same:
# check.* are all zero.
schedule:
  month: {start: 2026-12, count: 300, unit: month}
  number: "=ROW()"
  opening: "=PREV(closing, loan.principal)"
  interest: "=opening * terms.monthly_rate"
  payment: "=MIN(with_extra.payment, opening + interest)"
  principal_paid: "=payment - interest"
  closing: "=opening + interest - payment"

year_one:
  interest:
    formula: "=SUMIFS(schedule.interest, schedule.number, \"<=12\")"
  principal_paid:
    formula: "=SUMIFS(schedule.principal_paid, schedule.number, \"<=12\")"

paid_off:
  payments:
    formula: "=COUNTIF(schedule.payment, \">0\")"
  last_payment:
    formula: "=INDEX(schedule.payment, payments)"
  year:
    formula: "=YEAR(INDEX(schedule.month, payments))"
  month_of_year:
    formula: "=MONTH(INDEX(schedule.month, payments))"

# The schedule against the closed forms
check:
  interest:
    formula: "=ROUND(SUM(schedule.interest) - with_extra.total_interest, 6)"
  last_payment:
    formula: "=ROUND(paid_off.last_payment - with_extra.last_payment, 6)"
  payments:
    formula: "=paid_off.payments - ROUNDUP(with_extra.months_exact, 0)"
