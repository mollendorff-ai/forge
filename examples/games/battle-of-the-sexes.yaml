# Battle of the Sexes
# ===================
# Run in the examples folder: forge game games/battle-of-the-sexes.yaml
#
# Alex and Sam want an evening together, Alex at the opera and Sam at the
# football. Two pure equilibria, one where both go to each place, and a
# mixed one where Alex goes to the opera with 3/5 and Sam with 2/5, each
# expecting 6/5: less than either pure one gives the one who likes it less
# (nashpy agrees, and by hand each mix makes the other indifferent).
#
# Each result above is written under expect:, and
# forge validate games/battle-of-the-sexes.yaml checks that Forge still gives
# them (ADR-074).

_forge_version: "5.6.0"

games:
  evening:
    players: [alex, sam]
    strategies: [opera, football]
    payoffs:                          # [alex, sam]
      opera: {opera: [3, 2], football: [0, 0]}
      football: {opera: [0, 0], football: [2, 3]}

expect:                       # worked out by hand
  evening.pure_equilibria: 2
  evening.equilibria: 3
  evening.equilibrium_3.alex.opera: =3/5
  evening.equilibrium_3.sam.opera: =2/5
  evening.equilibrium_3.alex.payoff: =6/5
  evening.equilibrium_3.sam.payoff: =6/5
