# When Cooperation Holds
# ======================
# Run in the examples folder: forge game games/continuation.yaml
#   forge sensitivity games/continuation.yaml --vary w --range 0.3,0.7,0.05 --output long_run.stable.grim
#
# A match that ends at random: after each round it goes on with the chance
# w. Against GrimTrigger, AlwaysDefect gets T once and then P, an average of
# (1 - w) T + w P a round, while GrimTrigger gets R against itself. So once
# w reaches (T - c - R) / (T - P), 0.5 here, nothing in the roster does
# better against GrimTrigger than it does, and it is collectively stable.
# kinship-protocol derives that threshold by formula; the sweep shows it.
#
# Each result above is written under expect:, for the file as written and
# for each scenario, and forge validate games/continuation.yaml checks that Forge
# still gives them (ADR-074).
# At w = 0.6, AlwaysDefect gets 0.4 * 5 + 0.6 * 1 = 2.6 against GrimTrigger,
# under its 3; at w = 0.4 (short_matches) it gets 3.4, and GrimTrigger is not
# stable.

_forge_version: "5.6.0"

w: 0.6    # the chance that a match goes on after a round
c: 0      # the cost of a defection
dilemma_payoffs:
  T: 5
  R: 3
  P: 1

games:
  dilemma:
    players: [me, you]
    strategies: [cooperate, defect]
    symmetric: true
    payoffs:
      cooperate: {cooperate: =R, defect: 0}
      defect: {cooperate: =T - c, defect: =P - c}

  long_run:
    tournament:
      round: dilemma
      players:
        grim: grim_trigger
        tft: tit_for_tat
        ad: always_defect
      continuation: =w

kinship:
  threshold:
    formula: "=(T - c - R) / (T - P)"
    value: 0.5
    notes: The continuation from which GrimTrigger is stable against AlwaysDefect
  grim_holds:
    formula: "=long_run.stable.grim"
    value: 1

expect:                       # worked out by hand
  kinship.threshold: 0.5
  long_run.match.grim.grim: 3
  long_run.match.ad.grim: 2.6
  long_run.stable.grim: 1

scenarios:
  short_matches:
    description: A chance of 0.4 that a match goes on, under the threshold
    scalars: {w: 0.4}
    expect: {long_run.match.ad.grim: 3.4, long_run.stable.grim: 0}
