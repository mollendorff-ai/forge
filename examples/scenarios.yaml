_forge_version: "5.1.0"
assumptions:
  acquisition_cost: 10000000.0
  base_revenue: 5000000.0
  operating_margin: 0.2
  discount_rate: 0.1
  revenue_growth: 0.1
  market_share: 0.15
  synergy_savings: 200000.0
projections:
  year:
  - 1
  - 2
  - 3
  revenue: =assumptions.base_revenue * (1 + assumptions.revenue_growth) ^ year
  operating_profit: =revenue * assumptions.operating_margin
  synergies: =assumptions.synergy_savings * year
  total_profit: =operating_profit + synergies
valuation:
  npv_cash_flows:
    value: 3963185.57475582
    formula: =NPV(assumptions.discount_rate, projections.total_profit)
  net_value:
    value: -6036814.42524418
    formula: =npv_cash_flows - assumptions.acquisition_cost
  irr:
    value: -0.277390095633868
    formula: =IRR(-assumptions.acquisition_cost, projections.total_profit)
scenarios:
  bull_case:
    probability: 0.3
    description: Competitor exits market, we capture 25% share
    scalars:
      revenue_growth: 0.25
      market_share: 0.25
      synergy_savings: 500000
      operating_margin: 0.25
  base_case:
    probability: 0.5
    description: Market grows normally, integration on track
    scalars:
      revenue_growth: 0.1
      market_share: 0.15
      synergy_savings: 200000
      operating_margin: 0.2
  bear_case:
    probability: 0.2
    description: Recession hits, integration challenges
    scalars:
      revenue_growth: -0.05
      market_share: 0.1
      synergy_savings: 50000
      operating_margin: 0.12
