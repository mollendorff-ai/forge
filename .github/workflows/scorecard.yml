name: Scorecard

# An outside rating of how the repository is run (OpenSSF Scorecard): pinned
# actions, a policy for reporting vulnerabilities, signed releases, and the
# rest. It runs weekly and on every push to main, publishes the score the
# README's badge shows, and uploads the findings to the Security tab
# (roadmap A17-SCORECARD).
on:
  schedule:
    - cron: '29 7 * * 2'   # Tuesdays 07:29 UTC
  push:
    branches: [ main ]
  branch_protection_rule:
  workflow_dispatch:

# Scorecard's own rule: nothing is granted at the top, each job asks for what
# it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    permissions:
      # Upload the results to the Security tab
      security-events: write
      # Publish the score, so that the badge can show it
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload the findings to the Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
