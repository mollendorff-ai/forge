name: Weekly

# Catches problems that appear without a code change: a new security advisory
# for a dependency, or a new stable or beta Rust release that breaks the build.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  push:
    branches: [ main ]
    paths:
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/weekly.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/weekly.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # The cargo-audit binary is built once and restored: `cargo install`
      # then finds it and does nothing, until a newer cargo-audit is released.
      # Only main saves; its advisory database is fetched on every run.
      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on any vulnerability. Ignored advisories are listed, with reasons,
      # in .cargo/audit.toml; "unmaintained" warnings are reported, not fatal.
      - name: Audit dependencies
        run: cargo audit

  test:
    name: Tests on ${{ matrix.rust }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Run tests
        run: cargo test --release
      # Property tests (src/lib.rs, its properties tests) with many more cases than a pull
      # request runs, from a new seed each week, printed so a failure can be
      # replayed: PROPTEST_RNG_SEED=<seed> cargo test --lib -- tests::properties::
      - name: Property tests, more cases from this week's seed
        if: matrix.rust == 'stable'
        shell: bash
        run: |
          seed=$(date -u +%G%V)
          echo "PROPTEST_RNG_SEED=$seed" | tee -a "$GITHUB_STEP_SUMMARY"
          PROPTEST_RNG_SEED=$seed PROPTEST_CASES=1000 cargo test --release --lib -- tests::properties::
      # Strict clippy on stable only: a new beta lint should not fail the week.
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --release --all-targets -- -D warnings
