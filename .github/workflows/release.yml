name: Release

on:
  push:
    tags:
      - 'v*'
  # Run with --ref <tag>. The Auto Release job in ci.yml uses this, because a tag
  # pushed with GITHUB_TOKEN does not start the push trigger above.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: All tests must pass before building release artifacts
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache disabled - proc-macro issues
      # - name: Cache cargo
      #   uses: actions/cache@v6
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-release-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build for validation
        run: cargo build --release

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl - static binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            upx: true
            musl: true

          # Linux ARM64 (musl - static binary)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            upx: false
            cross: true

          # macOS ARM (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            upx: false

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            upx: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            upx: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install musl-tools (Linux x86_64 musl)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64 musl)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release (native)
        if: ${{ !matrix.cross }}
        # build.rs stamps other builds with the commit; a release is plain
        env:
          FORGE_RELEASE: "1"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Install UPX (Linux)
        if: matrix.upx && matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Install UPX (Windows)
        if: matrix.upx && matrix.os == 'windows-latest'
        run: choco install upx

      - name: Compress with UPX (Linux/Windows)
        if: matrix.upx
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            upx --best --lzma target/${{ matrix.target }}/release/forge.exe || true
          else
            upx --best --lzma target/${{ matrix.target }}/release/forge || true
          fi

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf forge-${{ matrix.target }}.tar.gz forge

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path forge.exe -DestinationPath forge-${{ matrix.target }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/forge-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> ../checksums.txt
            done
          done
          cat ../checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io on release
  # Forge Studio on GitHub Pages (ADR-056 decision 6), at this tag. A run
  # started with GITHUB_TOKEN, as Auto Release starts this one, sends no
  # workflow_run event to other workflows (rc.14 published nothing on its
  # own), so the Pages workflow is started here, the way Auto Release starts
  # this one.
  studio:
    name: Publish Forge Studio
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start Studio on Pages for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main -f ref="${{ github.ref_name }}"

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true  # Don't fail if already published

  # The formula in Formula/ (this repository is the Homebrew tap) installs the
  # binaries of the release, so it is rewritten from this release's checksums.
  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.formula.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Write the formula for this release
        id: formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --pattern checksums.txt --dir /tmp
          scripts/homebrew-formula.sh "${TAG#v}" /tmp/checksums.txt > Formula/forge.rb
          git diff --stat

      - name: Commit it to main
        run: |
          if git diff --quiet Formula/forge.rb; then
            echo "The formula is already for ${{ github.ref_name }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Homebrew formula for ${{ github.ref_name }}" Formula/forge.rb
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  # brew install and cargo binstall, as a user runs them, give this version.
  install:
    name: Install check
    needs: [homebrew, publish]
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ needs.homebrew.outputs.version }}
