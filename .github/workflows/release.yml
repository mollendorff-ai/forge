name: Release

on:
  push:
    tags:
      - 'v*'
  # Run with --ref <tag>. The Auto Release job in ci.yml uses this, because a tag
  # pushed with GITHUB_TOKEN does not start the push trigger above.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Gate: All tests must pass before building release artifacts
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Cache disabled - proc-macro issues
      # - name: Cache cargo
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-release-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build for validation
        run: cargo build --release

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl - static binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true

          # Linux ARM64 (musl - static binary)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true

          # macOS ARM (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install musl-tools (Linux x86_64 musl)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64 musl)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release (native)
        if: ${{ !matrix.cross }}
        # build.rs stamps other builds with the commit; a release is plain
        env:
          FORGE_RELEASE: "1"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf forge-${{ matrix.target }}.tar.gz forge

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path forge.exe -DestinationPath forge-${{ matrix.target }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: forge-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/forge-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      # The names are the published ones, without the build job's folder,
      # so `sha256sum -c checksums.txt` works next to downloaded archives
      - name: Generate checksums
        run: |
          scripts/release-checksums.sh artifacts > checksums.txt
          cat checksums.txt

      - name: Check the checksums before publishing
        run: |
          mkdir published
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} published/ \;
          cp checksums.txt published/
          cd published && sha256sum -c checksums.txt

      # A signed statement that this workflow built each archive from this
      # commit: unlike checksums.txt, it cannot be forged by whoever could
      # replace the release's files (verify with `gh attestation verify`)
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            published/*.tar.gz
            published/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What a tester gets: every asset of the release, downloaded into an
      # empty folder, checked with a plain sha256sum -c
      - name: Check the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir downloaded
          cd downloaded && sha256sum -c checksums.txt

  # Publish to crates.io on release
  # Forge Studio on GitHub Pages (ADR-056 decision 6), at this tag. A run
  # started with GITHUB_TOKEN, as Auto Release starts this one, sends no
  # workflow_run event to other workflows (rc.14 published nothing on its
  # own), so the Pages workflow is started here, the way Auto Release starts
  # this one.
  studio:
    name: Publish Forge Studio
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start Studio on Pages for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main -f ref="${{ github.ref_name }}"

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true  # Don't fail if already published

  # The formula in Formula/ (this repository is the Homebrew tap) installs the
  # binaries of the release, so it is rewritten from this release's checksums.
  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.formula.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Write the formula for this release
        id: formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --pattern checksums.txt --dir /tmp
          scripts/homebrew-formula.sh "${TAG#v}" /tmp/checksums.txt > Formula/forge.rb
          git diff --stat

      - name: Commit it to main
        run: |
          if git diff --quiet Formula/forge.rb; then
            echo "The formula is already for ${{ github.ref_name }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Homebrew formula for ${{ github.ref_name }}" Formula/forge.rb
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  # brew install and cargo binstall, as a user runs them, give this version.
  install:
    name: Install check
    needs: [homebrew, publish]
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ needs.homebrew.outputs.version }}
