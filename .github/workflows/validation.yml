name: Validation

# Runs the validation suites in validation/ (ADR-057) against a fresh
# build of Forge from the same commit:
#   validation/gnumeric  formulas compared with Gnumeric (and LibreOffice, for
#                        the LET, LAMBDA and COUNTUNIQUE cases Gnumeric cannot read)
#   validation/r         functions and analytics compared with R
#   validation/games     games compared with Gambit, tournaments with the
#                        axelrod library, 2 x 2 closed forms with R (ADR-068),
#                        the dynamics with egttools, and games of many
#                        players and their dynamics again in R (ADR-073)
# Weekly (which notices a new Gnumeric, LibreOffice or R), on demand, and on
# the pull requests and merges to main described below.
# Runs on Ubuntu 24.04: with the Gnumeric of 22.04, FLOOR and CEILING of a
# negative number returned #NUM! and six cases failed.
on:
  schedule:
    - cron: '41 6 * * 1'   # Mondays 06:41 UTC
  workflow_dispatch:
    inputs:
      seed:
        description: "Generated cases: the seed to replay (empty: this week's)"
        required: false
      per_function:
        description: "Generated cases: how many a function"
        required: false
        default: '200'
      games:
        description: "Games: how many generated games (the seed above is theirs too)"
        required: false
        default: '3000'
  # On pull requests and on main after a merge, when they change this file, the
  # source code, the version or dependencies in Cargo.toml, or a suite: the
  # result shows on the PR before it is merged, and main is checked with the
  # suites of the same commit (ADR-057).
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validation.yml'
      - 'Cargo.toml'
      - 'src/**'
      - 'validation/**'
  pull_request:
    paths:
      - '.github/workflows/validation.yml'
      - 'Cargo.toml'
      - 'src/**'
      - 'validation/**'

# A pull request's newer push cancels its older run. Every other run (a push
# to main) has a group of its own, so that one that hangs cannot hold up the
# ones after it, the release among them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gnumeric:
    name: Formulas vs Gnumeric
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Gnumeric and LibreOffice
        # LibreOffice from noble-backports: LET needs 24.8 or later, and
        # Ubuntu 24.04 itself has 24.2. A few minutes as a rule; 27 on
        # 2026-11-18, when the Ubuntu mirror was slow (165 kB/s for the
        # first 103 MB). The limit stops a hung mirror in three hours, where
        # the job ran until GitHub's six. Without recommended packages
        # Gnumeric is 7 packages, not 91: what it recommends is its
        # documentation, a PDF viewer (evince) and a solver (lp-solve), none
        # of which the suite uses. It passed all 2,150 cases with that
        # install, LibreOffice 26.2 included.
        timeout-minutes: 180
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnumeric
          sudo apt-get install -y --no-install-recommends -t noble-backports libreoffice-calc-nogui
          soffice --version
      - name: Build Forge
        run: cargo build --release
      - name: Run the suite
        working-directory: validation/gnumeric
        env:
          FORGE_BIN: ${{ github.workspace }}/target/release/forge
        run: cargo run --release
      # The commands the README shows print what it shows, and the timing
      # tests hold. In release: forge simulate --seek takes seconds, not
      # minutes, and a debug build cannot tell a copy from the work.
      - name: README commands and timings
        shell: bash
        run: |
          FORGE_BIN=target/release/forge cargo test --release -p mollendorff-forge-repo -- readme_commands
          cargo test --release --lib -- column_copies scalar_scaling
      # Generated cases (ADR-062): seed 1 on a pull request and a push, so a
      # change fails only for what it changes; the week's seed (year and ISO
      # week) on Mondays, 200 a function, to find what nobody wrote a case for.
      # A failure prints the command that replays it.
      - name: Generated cases
        working-directory: validation/sweep
        env:
          FORGE: ${{ github.workspace }}/target/release/forge
          SEED_INPUT: ${{ github.event.inputs.seed }}
          PER_FUNCTION_INPUT: ${{ github.event.inputs.per_function }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            seed="${SEED_INPUT:-$(date -u +%G%V)}"
            per="${PER_FUNCTION_INPUT:-200}"
          else
            seed=1
            per=20
          fi
          python3 -I generate.py --seed "$seed" --per-function "$per" --fail

  r:
    name: Functions and analytics vs R
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install R and packages
        # This one took 3 minutes on one run and 155 on another the same
        # morning (2026-11-18) and passed; a limit of 45 failed it, so the
        # limit is above what has been seen. The 155 were apt downloading 866
        # packages (849 MB): `r-base` brings R's recommended packages, and
        # those bring GDAL, a speech recogniser and a JavaScript runtime. The
        # validators use none of them, so R is `r-base-core` with the
        # compilers the CRAN packages below are built with (`r-base-dev`),
        # and no recommended packages: 20 packages.
        timeout-minutes: 180
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-jsonlite r-cran-boot r-cran-mvtnorm
          sudo Rscript -e 'install.packages(c("data.tree", "mc2d", "derivmkts"), repos = "https://cloud.r-project.org", Ncpus = 4)'
          # The current bnlearn needs R 4.4; Ubuntu 24.04 has R 4.3, so use an older release.
          sudo Rscript -e 'for (v in c("4.9.4", "4.9.3", "4.9.2", "4.9.1", "4.9", "4.8.3")) { if (!requireNamespace("bnlearn", quietly = TRUE)) try(install.packages(paste0("https://cloud.r-project.org/src/contrib/Archive/bnlearn/bnlearn_", v, ".tar.gz"), repos = NULL, type = "source")) }; library(bnlearn); cat("bnlearn", as.character(packageVersion("bnlearn")), "\n")'
      - name: Build Forge
        run: cargo build --release
      - name: Math, date and financial functions
        working-directory: validation/r
        env:
          FORGE_BIN: ${{ github.workspace }}/target/release/forge
        run: bash validators/r/run_all.sh
      - name: Analytics specs
        working-directory: validation/r
        env:
          FORGE_BIN: ${{ github.workspace }}/target/release/forge
        run: cargo run --release -- --all

  games:
    name: Games vs Gambit, axelrod and R
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Forge
        run: cargo build --release
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # pygambit 16.7.0 builds from source (about five minutes), so the built
      # wheels are kept: a directory of wheels for the pinned requirements,
      # restored when requirements.txt and the Python version are the same
      - name: Cache built wheels
        id: wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wheelhouse
          key: games-wheels-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('validation/games/requirements.txt') }}
      - name: Build wheels
        if: steps.wheels.outputs.cache-hit != 'true'
        run: pip wheel -r validation/games/requirements.txt -w wheelhouse
      # pygambit, the axelrod library, sympy and egttools, pinned: the pins are
      # what the numbers in VALIDATION.md were measured with. Installed from the
      # wheelhouse only.
      - name: Install Gambit and axelrod
        run: pip install --no-index --find-links wheelhouse -r validation/games/requirements.txt
      # Only R's base language and jsonlite: no recommended packages
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite
      # A pull request and a push: seed 1 and 300 games, 200 seeded runs of each
      # match. On Mondays, and on demand, the week's seed (year and ISO week),
      # 3,000 games and 1,000 runs, to find what nobody wrote a case for. A
      # failure prints the command that replays it.
      - name: Games
        working-directory: validation/games
        env:
          FORGE: ${{ github.workspace }}/target/release/forge
          SEED_INPUT: ${{ github.event.inputs.seed }}
          GAMES_INPUT: ${{ github.event.inputs.games }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            seed="${SEED_INPUT:-$(date -u +%G%V)}"
            games="${GAMES_INPUT:-3000}"
            runs=1000
          else
            seed=1
            games=300
            runs=200
          fi
          python3 -I run.py --seed "$seed" --games "$games" --runs "$runs" --fail
