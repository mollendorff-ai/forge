name: Validation

# Runs the two validation suites in validation/ (ADR-057) against a fresh
# build of Forge from the same commit:
#   validation/gnumeric  formulas compared with Gnumeric (and LibreOffice, for
#                        the LET, LAMBDA and COUNTUNIQUE cases Gnumeric cannot read)
#   validation/r         functions and analytics compared with R
# Weekly (which notices a new Gnumeric, LibreOffice or R), on demand, and on
# the pull requests and merges to main described below.
# Runs on Ubuntu 24.04: with the Gnumeric of 22.04, FLOOR and CEILING of a
# negative number returned #NUM! and six cases failed.
on:
  schedule:
    - cron: '41 6 * * 1'   # Mondays 06:41 UTC
  workflow_dispatch:
  # On pull requests and on main after a merge, when they change this file, the
  # source code, the version or dependencies in Cargo.toml, or a suite: the
  # result shows on the PR before it is merged, and main is checked with the
  # suites of the same commit (ADR-057).
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/validation.yml'
      - 'Cargo.toml'
      - 'src/**'
      - 'validation/**'
  pull_request:
    paths:
      - '.github/workflows/validation.yml'
      - 'Cargo.toml'
      - 'src/**'
      - 'validation/**'

# A pull request's newer push cancels its older run. Every other run (a push
# to main) has a group of its own, so that one that hangs cannot hold up the
# ones after it, the release among them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gnumeric:
    name: Formulas vs Gnumeric
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Gnumeric and LibreOffice
        # LibreOffice from noble-backports: LET needs 24.8 or later, and
        # Ubuntu 24.04 itself has 24.2
        run: |
          sudo apt-get update
          sudo apt-get install -y gnumeric
          sudo apt-get install -y -t noble-backports libreoffice-calc-nogui
          soffice --version
      - name: Build Forge
        run: cargo build --release
      - name: Run the suite
        working-directory: validation/gnumeric
        env:
          FORGE_BIN: ${{ github.workspace }}/target/release/forge
        run: cargo run --release

  r:
    name: Functions and analytics vs R
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install R and packages
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-jsonlite r-cran-boot r-cran-mvtnorm
          sudo Rscript -e 'install.packages(c("data.tree", "mc2d", "derivmkts"), repos = "https://cloud.r-project.org")'
          # The current bnlearn needs R 4.4; Ubuntu 24.04 has R 4.3, so use an older release.
          sudo Rscript -e 'for (v in c("4.9.4", "4.9.3", "4.9.2", "4.9.1", "4.9", "4.8.3")) { if (!requireNamespace("bnlearn", quietly = TRUE)) try(install.packages(paste0("https://cloud.r-project.org/src/contrib/Archive/bnlearn/bnlearn_", v, ".tar.gz"), repos = NULL, type = "source")) }; library(bnlearn); cat("bnlearn", as.character(packageVersion("bnlearn")), "\n")'
      - name: Build Forge
        run: cargo build --release
      - name: Math, date and financial functions
        working-directory: validation/r
        env:
          FORGE_BIN: ${{ github.workspace }}/target/release/forge
        run: bash validators/r/run_all.sh
      - name: Analytics specs
        working-directory: validation/r
        env:
          FORGE_BIN: ${{ github.workspace }}/target/release/forge
        run: cargo run --release -- --all
