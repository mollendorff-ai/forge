name: Studio on Pages

# Forge Studio (ADR-056 decision 6, roadmap S4) is published on GitHub Pages
# after each release: the page, forge-wasm of that release, and the release's
# examples. Pull requests build Studio and keep it as an artifact (ci.yml,
# job forge-wasm) and publish nothing.
#
# The Release workflow starts this one with the release's tag, once the
# GitHub release exists (job `studio` in release.yml). Events made with
# GITHUB_TOKEN start no other workflow, and neither `release: published` nor
# `workflow_run` reached this one for rc.14, so it is started explicitly. It
# can also be started by hand, with a tag or a branch.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to publish. A release before v10.0.0-rc.14 has no Studio: use main"
        required: true
        default: main

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Studio
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Version of this release
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install wasm-bindgen, the version in Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build forge-wasm and Studio
        run: |
          cargo build -p forge-wasm --profile wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir forge-wasm/pkg-web \
            target/wasm32-unknown-unknown/wasm/forge_wasm.wasm
          node studio/build.mjs forge-wasm/pkg-web studio-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: studio-site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The roadmap's acceptance check: the address shows this release's version
  # and the bagel model's profit, in a browser, from the published files
  check:
    name: The published page gives Forge's numbers
    needs: [build, deploy]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Open the page
        working-directory: studio
        run: |
          npm install --no-audit --no-fund
          # The browser comes from Playwright's own server. Its system packages
          # come from the runner's Ubuntu mirror, which did not answer on
          # 2026-11-11 and held a run for 20 minutes, so that step is limited
          # and the test says so if a library is still missing.
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "system packages not installed; continuing"
          node tests/live.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.build.outputs.version }}"
