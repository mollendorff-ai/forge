name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'schema/**'
      - 'editors/**'
      - 'forge-wasm/**'
      - 'studio/**'
      - 'validation/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'schema/**'
      - 'editors/**'
      - 'forge-wasm/**'
      - 'studio/**'
      - 'validation/**'
      - '.github/workflows/*.yml'

# A pull request's newer push cancels its older run. Every other run (a push
# to main) has a group of its own, so that one that hangs cannot hold up the
# ones after it, the release among them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rust: [stable]   # beta runs weekly, see weekly.yml
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-unknown-linux-gnu

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # shell: bash runs with -o pipefail. Without it the step's status is
      # tee's, so failing tests passed the job (roadmap T1-PROPERTIES PR).
      # The seed fixes the property tests' draws (src/lib.rs (its properties tests)).
      - name: Run tests
        shell: bash
        env:
          PROPTEST_RNG_SEED: "1"
        run: cargo test --verbose 2>&1 | tee test-output.txt

      - name: Parse test count
        if: matrix.rust == 'stable'
        run: |
          TOTAL=$(grep "^test result:" test-output.txt | awk '{sum += $4} END {print sum}')
          echo "TEST_COUNT=$TOTAL" >> $GITHUB_ENV
          echo "Total tests passed: $TOTAL"

      - name: Update test count badge
        if: matrix.rust == 'stable' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b8e2fa78efcf26a20ff97b483050b05a
          filename: forge-tests.json
          label: tests
          message: "${{ env.TEST_COUNT }} passing"
          color: brightgreen

  lint:
    name: Lint
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # The validation suites are programs that run the forge binary
      # (ADR-057); here only their lint and their own unit tests. The
      # Validation workflow runs them against Gnumeric and R.
      - name: Lint the validation suites
        run: cargo clippy -p mollendorff-forge-e2e-gnumeric -p mollendorff-forge-e2e-r -p mollendorff-forge-repo --all-targets -- -D warnings

      - name: Unit tests of the validation suites
        run: cargo test -p mollendorff-forge-e2e-gnumeric -p mollendorff-forge-e2e-r

  # What Forge says about itself is what it does (validation/repo): the docs,
  # workflows and sources checked against the code and against what the
  # release binary of the Build job prints, every command the docs show run
  # as a reader types it, forge simulate --seek included
  repo-checks:
    name: Repository checks
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v8
        with:
          name: forge-binary
          path: target/release

      - name: Check the repository against the binary
        env:
          FORGE_BIN: target/release/forge
        run: |
          chmod +x target/release/forge
          cargo test -p mollendorff-forge-repo

  # The oldest Rust Forge says it builds with (Cargo.toml rust-version,
  # clippy.toml msrv): a newer API used by accident breaks this job, not a
  # newcomer's first build (roadmap T1-MSRV)
  msrv:
    name: Builds and lints on the oldest supported Rust
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Read the declared version
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: Install that Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the command line and the library
        run: cargo build --locked --bin forge --lib

      # The README says CI fails on a warning: on this toolchain too, tests
      # included. Clippy 1.97 flags `assert_eq!` on exact whole-number floats;
      # such a test says so with #[allow(clippy::float_cmp)] and a reason.
      - name: Run clippy on every target
        run: cargo clippy --locked --all-targets -- -D warnings

  # The parser, the calculator and the analysis engines without the command
  # line or the servers, for a browser (ADR-055, roadmap S1-CORE-NO-OS)
  core-browser:
    name: Core for the browser (wasm32)
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the core for wasm32-unknown-unknown
        run: cargo build --lib --release --no-default-features --target wasm32-unknown-unknown

      - name: Build the core with Excel for wasm32-unknown-unknown
        run: cargo build --lib --release --no-default-features --features excel --target wasm32-unknown-unknown

      - name: Lint the core without the default features
        run: |
          cargo clippy --lib --no-default-features -- -D warnings
          cargo clippy --lib --no-default-features --features excel -- -D warnings

  # Forge's tools in WebAssembly give the native answers (ADR-055, roadmap
  # S2-FORGE-WASM). The module's size and each case's time are in the summary.
  forge-wasm:
    name: forge-wasm and Studio (WebAssembly against native)
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install wasm-bindgen, the version in Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Lint forge-wasm
        run: cargo clippy -p forge-wasm --all-targets -- -D warnings

      - name: Native tests (memory against disk, headline numbers)
        run: cargo test -p forge-wasm --release

      - name: Build the WebAssembly module
        run: |
          cargo build -p forge-wasm --profile wasm --target wasm32-unknown-unknown
          wasm-bindgen --target nodejs --out-dir forge-wasm/pkg \
            target/wasm32-unknown-unknown/wasm/forge_wasm.wasm

      - name: Native answers to every case
        run: cargo run -p forge-wasm --release --example expected -- forge-wasm/xlsx > forge-wasm/expected.json

      - name: The WebAssembly answers equal the native ones
        run: node forge-wasm/tests/node/compare.mjs forge-wasm/pkg forge-wasm/expected.json examples

      # Forge Studio (ADR-056): the same module built for the web, the page
      # around it, and a headless browser that reads the numbers on screen
      - name: Studio holds no calculation code
        run: node studio/tests/no-engine.mjs

      - name: Studio's formula colours are the VS Code grammar's
        run: node studio/tests/highlight.mjs

      - name: Studio changes one value in a YAML file and nothing else
        run: node studio/tests/text.mjs

      - name: Studio shows a percentage by the model's unit, and reads typed percentages as hundredths
        run: node studio/tests/format.mjs

      - name: Build Forge Studio
        run: |
          wasm-bindgen --target web --out-dir forge-wasm/pkg-web \
            target/wasm32-unknown-unknown/wasm/forge_wasm.wasm
          node studio/build.mjs forge-wasm/pkg-web studio-site

      # What a person downloads to open Studio (ADR-070): usable within 3
      # seconds on a 10 Mbps connection on a first visit, so at most 3,000,000
      # bytes gzipped, as GitHub Pages serves it. Under that, growth of more
      # than 100 KB in one pull request is said in its description and the
      # CHANGELOG, and size alone is no reason to replace a library with code
      # of our own. The module was 1,261,203 bytes on 2026-11-20 (ADR-069).
      - name: The WebAssembly module is within its size budget (3 MB gzipped, ADR-070)
        run: |
          raw=$(stat -c %s forge-wasm/pkg-web/forge_wasm_bg.wasm)
          gz=$(gzip -9 -c forge-wasm/pkg-web/forge_wasm_bg.wasm | wc -c)
          echo "forge_wasm_bg.wasm: $raw bytes, $gz gzipped (ceiling 3,000,000, ADR-070)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$gz" -gt 3000000 ]; then
            echo "::error::The WebAssembly module is $gz bytes gzipped, over the 3,000,000-byte ceiling of ADR-070 (Studio usable within 3 seconds on 10 Mbps). Find what grew, build it smaller, or decide the target again in ADR-070."
            exit 1
          fi

      - name: The built site has the grammar's rules
        run: node studio/tests/highlight.mjs studio-site

      - name: Every scalar on screen is forge calculate's
        working-directory: studio
        run: |
          npm install --no-audit --no-fund
          # The browser comes from Playwright's own server. Its system packages
          # come from the runner's Ubuntu mirror, which did not answer on
          # 2026-11-11 and held a run for 20 minutes, so that step is limited
          # and the test says so if a library is still missing.
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "system packages not installed; continuing"
          node tests/screen.mjs ../studio-site ../forge-wasm/expected.json

      - name: Formulas edited on their cards change their one line, and Forge refuses invalid ones
        working-directory: studio
        run: node tests/formulas.mjs ../studio-site

      - name: Studio's workbooks are forge export's, and Studio imports them
        working-directory: studio
        run: node tests/excel.mjs ../studio-site ../forge-wasm/xlsx

      - name: Studio saves through the share sheet, within the tap
        working-directory: studio
        run: node tests/save.mjs ../studio-site ../forge-wasm/xlsx

      - name: Studio suggests the model format's keys in the YAML editor
        working-directory: studio
        run: node tests/keys.mjs ../studio-site

      - name: Studio suggests names and functions inside a formula in the YAML editor
        working-directory: studio
        run: node tests/yamlformula.mjs ../studio-site

      - name: Studio shows a welcome card on a first visit, once
        working-directory: studio
        run: node tests/welcome.mjs ../studio-site

      - name: Studio's grid shows what Forge returns
        working-directory: studio
        run: node tests/grid.mjs ../studio-site

      - name: Studio weighs the scenarios Forge weighs and names the ones it leaves out
        working-directory: studio
        run: node tests/scenarios.mjs ../studio-site

      - name: Studio shows the games Forge works out, and they move with the inputs
        working-directory: studio
        run: node tests/games.mjs ../studio-site

      - name: Studio shows a format as Forge gives it
        working-directory: studio
        run: node tests/formats.mjs ../studio-site

      - name: Studio suggests names and functions while a formula is typed
        working-directory: studio
        run: node tests/suggest.mjs ../studio-site

      - name: Studio adds and deletes elements on the cards of every example
        working-directory: studio
        run: node tests/elements.mjs ../studio-site

      - name: Studio opens offline, and a later release replaces the cache
        working-directory: studio
        run: node tests/offline.mjs ../studio-site

      - name: Studio's layouts (320 px, side by side at 1440 px) and screenshots
        working-directory: studio
        run: node tests/layout.mjs ../studio-site ../studio-screenshots

      - name: Upload Studio's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-screenshots
          path: studio-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Forge Studio
        uses: actions/upload-artifact@v7
        with:
          name: forge-studio
          path: studio-site
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --release --verbose

      - name: Check binaries exist
        run: |
          test -f target/release/forge && echo "forge binary built"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: forge-binary
          path: target/release/forge
          retention-days: 1

  vscode:
    name: VS Code extension
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Every YAML file tokenized with VS Code's YAML grammar, the examples
      # validated with yaml-language-server, and the manifest packaged
      - name: Test and package
        run: |
          npm install --no-audit --no-fund
          npm test
          npx vsce package

  mcp-smoke:
    name: MCP Protocol Test
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: forge-binary
          path: .

      - name: MCP smoke test
        run: |
          chmod +x ./forge
          # rmcp requires notifications/initialized after initialize, and needs
          # inter-message delays so stdin doesn't close before processing completes
          (
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
            sleep 0.2
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            sleep 0.1
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            sleep 0.5
          ) | timeout 10 ./forge mcp > mcp-output.txt 2>/dev/null || true

          echo "=== MCP stdout ==="
          cat mcp-output.txt

          # Every stdout line must be valid JSON
          LINES=0
          while IFS= read -r line; do
            LINES=$((LINES + 1))
            if ! echo "$line" | jq . > /dev/null 2>&1; then
              echo "FAIL: Line $LINES is not valid JSON: $line"
              exit 1
            fi
          done < mcp-output.txt
          echo "PASS: All $LINES stdout lines are valid JSON"

          # tools/list must return exactly 21 tools
          TOOLS=$(jq -r 'select(.result.tools) | .result.tools | length' mcp-output.txt)
          if [ "$TOOLS" != "21" ]; then
            echo "FAIL: Expected 21 tools, got ${TOOLS:-none}"
            exit 1
          fi
          echo "PASS: Tool count is $TOOLS"

      # `forge functions | head` must end quietly, like other command-line
      # tools: only a real process has a pipe to close, so this runs the
      # built binary (it was tests/broken_pipe.rs)
      - name: A closed pipe ends quietly
        run: |
          ./forge functions 2> stderr.txt | head -1
          if [ -s stderr.txt ]; then
            echo "FAIL: forge wrote to stderr when its output was closed:"
            cat stderr.txt
            exit 1
          fi
          echo "PASS: nothing on stderr"

  coverage:
    name: Coverage
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Compiled dependencies, restored from the last run on main; only main
      # saves one, so pull requests do not fill the 10 GB the repository has
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          # The tests, then the built program for what only it runs (main,
          # MCP over stdio): scripts/coverage.sh
          scripts/coverage.sh --json --output-path cov.json
          for kind in lines functions regions; do
            echo "Coverage of $kind: $(jq ".data[0].totals.$kind.percent" cov.json)%"
          done
          COV=$(jq '.data[0].totals.functions.percent' cov.json | xargs printf '%.0f')
          echo "COVERAGE=$COV" >> $GITHUB_ENV

      # 100% coverage, no skipping (CLAUDE.md, roadmap T1-COVERAGE-GATE). Until
      # the code is at 100%, these floors are the coverage of the last merge,
      # rounded down to a tenth (the weekly run's new property-test seeds can
      # move it by hundredths): raise them whenever coverage goes up, to 100,
      # and never lower them. Set 2026-11-16 from PR #257's run (lines
      # 88.04%, functions 84.46%, regions 86.31%); raised 2026-11-17 from
      # PR #258's (88.94%, 85.47%, 87.35%) and PR #259's (89.62%, 86.14%,
      # 88.14%), as the inline tests moved in, and from PR #261's (91.91%,
      # 87.95%, 90.58%), when the command line ran in-process, and from PR
      # #262's (92.45%, 88.52%, 91.19%), when its tests ran under coverage, and
      # from PR #263's regions (91.20%), and from PR #266's (93.18%, 89.20%,
      # 91.97%), when 612 lines of dead date code were deleted, and on 2026-11-19
      # from a local run (95.20%, 91.93%, 95.01%) after update, upgrade, watch
      # and the API server were tested with nothing compiled out; set a tenth
      # lower, in case CI measures a hair differently. CI measured the regions
      # 0.9 points lower (94.14%, lines 95.20%, functions 92.13%: its run on
      # this PR), so the regions floor is 94.1, lowered at the maintainer's
      # word (2026-11-19) and to be raised again, to 100, as the rest is
      # covered: floors are set from CI's number, never a local one.
      # Raised 2026-11-19 from CI's run on main after PR #290 (95.69%, 92.68%,
      # 94.64%), rounded down to a tenth: from CI's number, never a local one.
      # Raised 2026-11-20 from CI's run on main after PR #303 and #304 (97.15%,
      # 94.86%, 96.39%), the same way.
      - name: Fail below the coverage floor
        env:
          FLOOR_LINES: "97.1"
          FLOOR_FUNCTIONS: "94.8"
          FLOOR_REGIONS: "96.3"
        run: |
          fail=0
          for kind in lines functions regions; do
            floor_var="FLOOR_${kind^^}"
            got=$(jq ".data[0].totals.$kind.percent" cov.json)
            if jq -e --argjson floor "${!floor_var}" ".data[0].totals.$kind.percent >= \$floor" cov.json >/dev/null; then
              echo "$kind: $got% (floor ${!floor_var}%)"
            else
              echo "::error::$kind coverage is $got%, below the floor of ${!floor_var}%: add tests, do not lower the floor"
              fail=1
            fi
          done
          exit $fail

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b8e2fa78efcf26a20ff97b483050b05a
          filename: forge-coverage.json
          label: coverage
          message: "${{ env.COVERAGE }}%"
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 0
          maxColorRange: 100

  update-docs:
    name: Update Generated Docs
    timeout-minutes: 30
    needs: [test, lint, build, repo-checks]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One run at a time, so two merges close together do not push over each other
    concurrency:
      group: update-generated-docs
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: forge-binary
          path: .

      - name: Generate FUNCTIONS.md
        run: |
          chmod +x ./forge
          ./forge functions --json > functions.json

          # Generate markdown header
          cat > docs/FUNCTIONS.md << 'HEADER'
          # Forge Function Reference

          > Auto-generated by CI from `forge functions --json`. Do not edit manually.

          HEADER

          # Add total count
          TOTAL=$(jq -r '.total' functions.json)
          CATS=$(jq -r '.categories | length' functions.json)
          echo "**${TOTAL} functions** across ${CATS} categories." >> docs/FUNCTIONS.md
          echo "" >> docs/FUNCTIONS.md

          # Generate category tables
          jq -r '.categories[] | "## \(.name) (\(.count) functions)\n\n| Function | Description | Syntax |\n|----------|-------------|--------|\n" + ([.functions[] | "| `\(.name)` | \(.description) | `\(.syntax)` |"] | join("\n")) + "\n"' functions.json >> docs/FUNCTIONS.md

          echo "FUNC_COUNT=$TOTAL" >> $GITHUB_ENV
          rm functions.json

      - name: Update functions badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b8e2fa78efcf26a20ff97b483050b05a
          filename: forge-functions.json
          label: functions
          message: "${{ env.FUNC_COUNT }}"
          color: blue

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/FUNCTIONS.md
          if git diff --staged --quiet; then
            echo "No changes to FUNCTIONS.md"
          else
            git commit -m "docs: auto-update FUNCTIONS.md [skip ci]"
            # main can move while this job runs (a release tags it, the
            # Homebrew formula is committed): put the commit on top and retry
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              echo "main moved; rebasing (attempt $attempt)"
              sleep $((attempt * 5))
              git pull --rebase origin main || { git rebase --abort; exit 1; }
            done
            echo "Could not push FUNCTIONS.md after 5 attempts"
            exit 1
          fi

  # Auto-release: if version changed, create tag to trigger release workflow
  auto-release:
    name: Auto Release
    timeout-minutes: 15
    needs: [test, lint, build, repo-checks]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.cargo_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.cargo_version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.cargo_version.outputs.version }} does not exist - will create"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.cargo_version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          if git push origin "$TAG"; then
            echo "Created and pushed tag $TAG"
          else
            # On 2026-11-11 GitHub refused this push for rc.16 ("refusing to allow a
            # GitHub App to create or update workflow ... without workflows
            # permission") though the commit was already on main and rc.14 and rc.15
            # had gone through. The same tag made through the API creates a ref to a
            # commit GitHub already has, and no workflow file is pushed.
            echo "git push of $TAG was refused; creating the tag through the API"
            TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags" -f tag="$TAG" -f message="Release $TAG" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$TAG_SHA"
            echo "Created tag $TAG through the API"
          fi

      # A tag can exist without its GitHub release: the Release run failed (on
      # 2026-11-10 no macOS arm64 runner took the job for 15 minutes and GitHub
      # cancelled it). Starting Release again on the next push to main retries it,
      # unless a Release run is already queued or running.
      - name: Check if the release exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.cargo_version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "missing=false" >> $GITHUB_OUTPUT
            echo "Release $TAG exists"
          elif [ -n "$(gh run list --workflow release.yml --json status --jq '.[] | select(.status != "completed") | .status')" ]; then
            echo "missing=false" >> $GITHUB_OUTPUT
            echo "Release $TAG is being built"
          else
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "Release $TAG does not exist - will start the Release workflow"
          fi

      # Tags pushed with GITHUB_TOKEN do not start other workflows, so start Release explicitly.
      - name: Start Release workflow
        if: steps.tag_check.outputs.exists == 'false' || steps.release_check.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "v${{ steps.cargo_version.outputs.version }}"
