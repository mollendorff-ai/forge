name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'schema/**'
      - 'editors/**'
      - 'forge-wasm/**'
      - 'studio/**'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'schema/**'
      - 'editors/**'
      - 'forge-wasm/**'
      - 'studio/**'
      - '.github/workflows/*.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rust: [stable]   # beta runs weekly, see weekly.yml
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-unknown-linux-gnu

      # Cache disabled - proc-macro issues
      # - name: Cache cargo
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose 2>&1 | tee test-output.txt

      - name: Parse test count
        if: matrix.rust == 'stable'
        run: |
          TOTAL=$(grep "^test result:" test-output.txt | awk '{sum += $4} END {print sum}')
          echo "TEST_COUNT=$TOTAL" >> $GITHUB_ENV
          echo "Total tests passed: $TOTAL"

      - name: Update test count badge
        if: matrix.rust == 'stable' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b8e2fa78efcf26a20ff97b483050b05a
          filename: forge-tests.json
          label: tests
          message: "${{ env.TEST_COUNT }} passing"
          color: brightgreen

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache disabled - proc-macro issues
      # - name: Cache cargo
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # The parser, the calculator and the analysis engines without the command
  # line or the servers, for a browser (ADR-055, roadmap S1-CORE-NO-OS)
  core-browser:
    name: Core for the browser (wasm32)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Build the core for wasm32-unknown-unknown
        run: cargo build --lib --release --no-default-features --target wasm32-unknown-unknown

      - name: Lint the core without the default features
        run: cargo clippy --lib --no-default-features -- -D warnings

  # Forge's tools in WebAssembly give the native answers (ADR-055, roadmap
  # S2-FORGE-WASM). The module's size and each case's time are in the summary.
  forge-wasm:
    name: forge-wasm and Studio (WebAssembly against native)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install wasm-bindgen, the version in Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Lint forge-wasm
        run: cargo clippy -p forge-wasm --all-targets -- -D warnings

      - name: Native tests (memory against disk, headline numbers)
        run: cargo test -p forge-wasm --release

      - name: Build the WebAssembly module
        run: |
          cargo build -p forge-wasm --release --target wasm32-unknown-unknown
          wasm-bindgen --target nodejs --out-dir forge-wasm/pkg \
            target/wasm32-unknown-unknown/release/forge_wasm.wasm

      - name: Native answers to every case
        run: cargo run -p forge-wasm --release --example expected > forge-wasm/expected.json

      - name: The WebAssembly answers equal the native ones
        run: node forge-wasm/tests/node/compare.mjs forge-wasm/pkg forge-wasm/expected.json examples

      # Forge Studio (ADR-056): the same module built for the web, the page
      # around it, and a headless browser that reads the numbers on screen
      - name: Studio holds no calculation code
        run: node studio/tests/no-engine.mjs

      - name: Build Forge Studio
        run: |
          wasm-bindgen --target web --out-dir forge-wasm/pkg-web \
            target/wasm32-unknown-unknown/release/forge_wasm.wasm
          node studio/build.mjs forge-wasm/pkg-web studio-site

      - name: Every scalar on screen is forge calculate's
        working-directory: studio
        run: |
          npm install --no-audit --no-fund
          # The browser comes from Playwright's own server. Its system packages
          # come from the runner's Ubuntu mirror, which did not answer on
          # 2026-11-11 and held a run for 20 minutes, so that step is limited
          # and the test says so if a library is still missing.
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "system packages not installed; continuing"
          node tests/screen.mjs ../studio-site ../forge-wasm/expected.json

      - name: Studio's layouts (320 px, side by side at 1440 px) and screenshots
        working-directory: studio
        run: node tests/layout.mjs ../studio-site ../studio-screenshots

      - name: Upload Studio's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-screenshots
          path: studio-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Forge Studio
        uses: actions/upload-artifact@v7
        with:
          name: forge-studio
          path: studio-site
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache disabled - proc-macro issues
      # - name: Cache cargo
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       target
      #     key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --verbose

      - name: Check binaries exist
        run: |
          test -f target/release/forge && echo "forge binary built"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: forge-binary
          path: target/release/forge
          retention-days: 1

  vscode:
    name: VS Code extension
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Every YAML file tokenized with VS Code's YAML grammar, the examples
      # validated with yaml-language-server, and the manifest packaged
      - name: Test and package
        run: |
          npm install --no-audit --no-fund
          npm test
          npx vsce package

  mcp-smoke:
    name: MCP Protocol Test
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: forge-binary
          path: .

      - name: MCP smoke test
        run: |
          chmod +x ./forge
          # rmcp requires notifications/initialized after initialize, and needs
          # inter-message delays so stdin doesn't close before processing completes
          (
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
            sleep 0.2
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            sleep 0.1
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            sleep 0.5
          ) | timeout 10 ./forge mcp > mcp-output.txt 2>/dev/null || true

          echo "=== MCP stdout ==="
          cat mcp-output.txt

          # Every stdout line must be valid JSON
          LINES=0
          while IFS= read -r line; do
            LINES=$((LINES + 1))
            if ! echo "$line" | jq . > /dev/null 2>&1; then
              echo "FAIL: Line $LINES is not valid JSON: $line"
              exit 1
            fi
          done < mcp-output.txt
          echo "PASS: All $LINES stdout lines are valid JSON"

          # tools/list must return exactly 20 tools
          TOOLS=$(jq -r 'select(.result.tools) | .result.tools | length' mcp-output.txt)
          if [ "$TOOLS" != "20" ]; then
            echo "FAIL: Expected 20 tools, got ${TOOLS:-none}"
            exit 1
          fi
          echo "PASS: Tool count is $TOOLS"

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov --ignore-filename-regex 'tests/' --json --output-path cov.json
          COV=$(jq '.data[0].totals.functions.percent' cov.json | xargs printf '%.0f')
          echo "COVERAGE=$COV" >> $GITHUB_ENV
          echo "Function coverage: ${COV}%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b8e2fa78efcf26a20ff97b483050b05a
          filename: forge-coverage.json
          label: coverage
          message: "${{ env.COVERAGE }}%"
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 0
          maxColorRange: 100

  update-docs:
    name: Update Generated Docs
    needs: [test, lint, build]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: forge-binary
          path: .

      - name: Generate FUNCTIONS.md
        run: |
          chmod +x ./forge
          ./forge functions --json > functions.json

          # Generate markdown header
          cat > docs/FUNCTIONS.md << 'HEADER'
          # Forge Function Reference

          > Auto-generated by CI from `forge functions --json`. Do not edit manually.

          HEADER

          # Add total count
          TOTAL=$(jq -r '.total' functions.json)
          CATS=$(jq -r '.categories | length' functions.json)
          echo "**${TOTAL} functions** across ${CATS} categories." >> docs/FUNCTIONS.md
          echo "" >> docs/FUNCTIONS.md

          # Generate category tables
          jq -r '.categories[] | "## \(.name) (\(.count) functions)\n\n| Function | Description | Syntax |\n|----------|-------------|--------|\n" + ([.functions[] | "| `\(.name)` | \(.description) | `\(.syntax)` |"] | join("\n")) + "\n"' functions.json >> docs/FUNCTIONS.md

          echo "FUNC_COUNT=$TOTAL" >> $GITHUB_ENV
          rm functions.json

      - name: Update functions badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b8e2fa78efcf26a20ff97b483050b05a
          filename: forge-functions.json
          label: functions
          message: "${{ env.FUNC_COUNT }}"
          color: blue

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/FUNCTIONS.md
          if git diff --staged --quiet; then
            echo "No changes to FUNCTIONS.md"
          else
            git commit -m "docs: auto-update FUNCTIONS.md [skip ci]"
            git push
          fi

  # Auto-release: if version changed, create tag to trigger release workflow
  auto-release:
    name: Auto Release
    needs: [test, lint, build]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.cargo_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.cargo_version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.cargo_version.outputs.version }} does not exist - will create"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.cargo_version.outputs.version }}" -m "Release v${{ steps.cargo_version.outputs.version }}"
          git push origin "v${{ steps.cargo_version.outputs.version }}"
          echo "Created and pushed tag v${{ steps.cargo_version.outputs.version }}"

      # A tag can exist without its GitHub release: the Release run failed (on
      # 2026-11-10 no macOS arm64 runner took the job for 15 minutes and GitHub
      # cancelled it). Starting Release again on the next push to main retries it,
      # unless a Release run is already queued or running.
      - name: Check if the release exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.cargo_version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "missing=false" >> $GITHUB_OUTPUT
            echo "Release $TAG exists"
          elif [ -n "$(gh run list --workflow release.yml --json status --jq '.[] | select(.status != "completed") | .status')" ]; then
            echo "missing=false" >> $GITHUB_OUTPUT
            echo "Release $TAG is being built"
          else
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "Release $TAG does not exist - will start the Release workflow"
          fi

      # Tags pushed with GITHUB_TOKEN do not start other workflows, so start Release explicitly.
      - name: Start Release workflow
        if: steps.tag_check.outputs.exists == 'false' || steps.release_check.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "v${{ steps.cargo_version.outputs.version }}"
